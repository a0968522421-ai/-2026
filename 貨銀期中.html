<script type="application/json" id="review">{"1":[{"h":"金融市場與金融中介","items":["**金融市場**{{financial markets}}：把資金從有剩餘的儲蓄者，移到有生產性投資機會的借款人，提升**經濟效率**{{economic efficiency}}、促進成長；運作不良會造成貧窮{{poverty}}。","**金融中介**{{financial intermediaries}}：銀行、保險公司、基金等。儲蓄者不直接買借款人的證券，而是透過中介**間接融資**{{indirect finance}}。","銀行很重要：連結儲蓄與投資、持有大量個人財富{{wealth}}、善於因應法規進行**金融創新**{{financial innovation}}。"]},{"h":"三大市場","items":["**債券市場**{{bond market}}：利率在這裡決定。**利率**{{interest rate}}是借錢的成本（每年 %）。","利率特性：**三個月國庫券**{{three-month Treasury bill}}利率比長期公債{{long-term Treasury bond}}**波動大、平均低**{{more volatile, lower on average}}；**Baa 公司債**{{Baa corporate bond}}利率較高（違約風險{{default risk}}），1970 年代後利差變大。","利率下降 → 房貸{{mortgage}}、學貸{{student loan}}成本降低 → 住宅支出{{housing expenditure}}增加；利率影響個人、企業與整體經濟。","**股票市場**{{stock market}}：最受關注的市場，股價波動極大（1987 年黑色星期一{{Black Monday}}單日跌 22%）。**普通股**{{common stock}}是對公司**盈餘與資產**{{earnings and assets}}的請求權{{claim}}。","股價上漲 → 財富增加 → 消費增加；企業**發行新股**{{issue new shares}}可募得更多資金。股價下跌則相反。","**外匯市場**{{foreign exchange market}}：**匯率**{{exchange rate}}是一國貨幣以另一國貨幣表示的價格。"]},{"h":"匯率：美元強弱","items":["**美元走強**{{stronger dollar / appreciation}}：外國貨與出國旅遊變便宜 → **美國消費者受益**{{benefits American consumers}}；出口品在國外變貴 → **美國企業受害**{{hurts American businesses}}。","**美元走弱**{{weaker dollar / depreciation}}：進口品{{imports}}變貴、出口{{exports}}變容易 → 企業受益、消費者受害。","計算直覺：£1 從 $2.40 變便宜（美元走強），同樣 £50 的毛衣換算成美元會**低於** $120{{less than $120}}。","易錯：「歐元的美元價格上漲」{{dollar price of euros rises}}＝美元貶值，對賣牛肉到歐洲的美國農民有利。"]},{"h":"貨幣、景氣與通膨","items":["**貨幣**{{money / money supply}}：購買商品勞務或償還債務時**普遍被接受**{{generally accepted}}的任何東西。","**景氣循環**{{business cycle}}：1900 年以來每次**衰退**{{recession}}前，**貨幣成長率**{{rate of money growth}}（不是貨幣存量 money stock）都會下降。","**通貨膨脹**{{inflation}}：物價水準「**持續**」上升{{continual increase in the price level}}；物價只漲一次不算。","長期而言，**通膨率**{{inflation rate}}與貨幣成長率強烈正相關。傅利曼：「Inflation is always and everywhere a **monetary** phenomenon.」","**預算赤字**{{budget deficit}}：可能推高利率、迫使 Fed 增加貨幣供給 → 貨幣成長加快 → 通膨上升。","美國**貨幣政策**{{monetary policy}}由**聯準會**{{Federal Reserve System, the Fed}}負責。"]},{"h":"總體衡量與計算","items":["**GDP**{{gross domestic product}}：一年內生產的所有「**最終**」{{final}}商品與勞務的**市場價值**{{market value}}。股債買賣、二手車屋、古董都不算（不是當期生產）。","**名目 GDP**{{nominal GDP}}用當期價格；**實質 GDP**{{real GDP}}用固定價格。**總產出＝總所得**{{aggregate output = aggregate income}}。","**GDP 平減指數**{{GDP deflator}}＝名目 GDP ÷ 實質 GDP × 100（9 兆 ÷ 6 兆 × 100＝150）。","**通膨率** πₜ＝(Pₜ − Pₜ₋₁) / Pₜ₋₁，分母是「上期」。例：**物價水準**{{price level}} 200 → 220，通膨 10%。","**成長率**{{growth rate}}＝(本期 − 上期) / 上期。例：10 兆 → 10.5 兆，成長 5%。","**實質所得**{{real income}}不變：物價翻倍，**名目所得**{{nominal income}}也要翻倍（5 萬 → 10 萬）。"]}],"2":[{"h":"金融市場的功能","items":["把資金從**貸方-儲蓄者**{{lender-savers}}導向**借方-支出者**{{borrower-spenders}}，讓資金流向有**生產性投資機會**{{productive investment opportunities}}的人，也讓消費者能安排購買時點。","借錢投資的判斷：專案報酬要**超過利息**才划算（借 $2000、**年利率**{{annual interest}} 10%，收益至少 $201）。"]},{"h":"直接融資 vs 間接融資","items":["**直接融資**{{direct finance}}：借款人直接把證券賣給出資者，在**初級市場**{{primary market}}進行（例：公司發新股、向朋友借錢、在初級市場買**商業本票**{{commercial paper}}）。透過**投資銀行**{{investment bank}}承銷仍算直接融資。","**間接融資**{{indirect finance}}：資金經過**金融中介**{{financial intermediary}}（例：存錢到銀行、買**共同基金**{{mutual fund}}、**退休基金**{{pension fund}}在次級市場買證券）。","易錯：在**次級市場**{{secondary market}}轉手證券，發行公司拿不到新資金，不算直接融資。"]},{"h":"證券與市場結構","items":["**債務工具**{{debt instrument}}：約定定期付息還本；**權益**{{equity}}（股票）：對盈餘與資產的請求權，股東是**剩餘請求者**{{residual claimant}}，沒有到期日。","債與股都可以是**長期**{{long-term}}工具、都是**對發行者所得的請求權**{{claim on the issuer's income}}、都能幫公司**募資**{{raise funds}}；股票**不可能**是短期{{short-term}}工具。","**到期期限**{{maturity}}：短期＜1 年，**中期**{{intermediate-term}} 1–10 年，長期 ≧10 年。","**證券**{{security}}對買方是**資產**{{asset}}、對發行者是**負債**{{liability}}。","初級市場：新證券首次出售，公司只有這時拿到資金。次級市場：舊證券轉手，提供**流動性**{{liquidity}}；次級市場價格越高，公司在初級市場募得越多。","**店頭市場**{{over-the-counter (OTC) market}}：股票、債券、外匯、**聯邦資金**{{federal funds}}都可以用**交易商**{{dealers}}報價方式交易；美國公債只在店頭市場交易。另一種是**交易所**{{exchange}}（如 NYSE）。","**貨幣市場**{{money market}}：一年內到期的工具，流動性高、價格波動小；**資本市場**{{capital market}}：長期債券與股票。","**外國債券**{{foreign bond}}：在外國發行、以當地貨幣計價；**歐洲債券**{{Eurobond}}：以非當地貨幣計價。"]},{"h":"金融中介為何存在","items":["**交易成本**{{transaction costs}}：**規模經濟**{{economies of scale}}讓中介把成本分攤給大量客戶（標準化合約 standardized contracts），降低交易成本。","**風險分攤**{{risk sharing}}，又叫**資產轉換**{{asset transformation}}：賣低風險資產給投資人、用所得買高風險資產；靠**分散投資**{{diversification}}（don't put all your eggs in one basket）降低風險。","**資訊不對稱**{{asymmetric information}}：借款人比貸方更了解自己的風險。","**逆選擇**{{adverse selection}}（交易**前**{{before the transaction}}）：最想借錢的往往是**高風險者**{{bad credit risks}}，例如二手車多是爛車。可解釋為何只有大公司能進證券市場、為何間接融資比較重要。","**道德風險**{{moral hazard}}（交易**後**{{after the transaction}}）：拿到錢後做出對出資者不利的事，例如用增資款請員工搭郵輪。","美國與各國企業**外部資金**{{external funds}}都以**銀行貸款**{{bank loans}}為主，證券市場較次要。"]},{"h":"金融中介的種類","items":["**存款機構**{{depository institutions}}：**商業銀行**{{commercial bank}}、**儲貸協會**{{savings and loan association, S&L}}、**互助儲蓄銀行**{{mutual savings bank}}、**信用合作社**{{credit union}}（後三者合稱**儲蓄機構**{{thrift institutions}}）。","**契約型儲蓄機構**{{contractual savings institutions}}：**壽險公司**{{life insurance company}}、**產險公司**{{fire and casualty insurance company}}、**退休基金**{{pension fund}}。","**投資型中介**{{investment intermediaries}}：**財務公司**{{finance company}}、共同基金、**貨幣市場共同基金**{{money market mutual fund}}。","主要資產：商業銀行＝房貸、消費與企業貸款、政府證券；儲貸與互助儲蓄＝**房貸**{{mortgages}}；信用合作社＝**消費者貸款**{{consumer loans}}；財務公司＝消費者與企業貸款；退休基金＝**公司股債**{{corporate bonds and stock}}。","貨幣市場共同基金：功能像**付息的支票帳戶**{{interest-paying checking account}}，可憑持股開支票，但沒有存款保險。"]},{"h":"金融監理與貨幣市場工具","items":["監理目的：增加投資人資訊（**證管會**{{SEC, Securities and Exchange Commission}}要求**揭露**{{disclosure}}）、確保金融體系健全；**不保證**投資人不虧損。","防恐慌措施：**限制進入**{{restrictions on entry}}、揭露、**存款保險**{{deposit insurance}}（**FDIC**，1930–33 恐慌後成立）、限制資產與業務（不能持有普通股）。","監理機關：**貨幣監理署**{{OCC, Office of the Comptroller of the Currency}}、FDIC、Fed 都監理部分商業銀行；**Fed 不發執照**{{charter}}；儲貸由**儲蓄機構監理局**{{OTS}}監理，信合社由 **NCUA** 監理。","1999 年廢除商業銀行與證券業的分離（Glass-Steagall Act）。","**國庫券**{{Treasury bill}}：最安全、流動性最高，無利息而**折價發行**{{sold at a discount}}，期限 3、6、12 個月。","短期工具：**可轉讓定存**{{negotiable CD}}、**銀行承兌匯票**{{banker's acceptance}}、商業本票、**附買回協議**{{repurchase agreement, repo}}、聯邦資金（銀行間隔夜借貸 overnight loans between banks）。房貸、**公司債**{{corporate bond}}、**政府機構證券**{{government agency securities}}、**市政債**{{municipal bond}}屬資本市場。"]}],"3":[{"h":"貨幣的定義","items":["**貨幣**{{money}}：購買商品勞務或償還債務時**普遍被接受**{{generally accepted}}的任何東西。決定性特徵是「被普遍接受」，不必有黃金支撐。","**通貨**{{currency}}＝紙幣與硬幣{{paper money and coins}}，只是貨幣的一部分；**支票存款**{{checking / checkable deposits}}也是貨幣，因為具備付款功能。","**貨幣 ≠ 財富**{{wealth}} **≠ 所得**{{income}}：財富是可儲值財產的總和；所得是**流量**{{flow}}（每段時間），貨幣與財富是**存量**{{stock}}（某時點）。年薪是所得、房子是財富、支票存款是貨幣也是財富。"]},{"h":"貨幣的三大功能","items":["**交易媒介**{{medium of exchange}}：讓它**有別於其他資產**{{distinguishes money from other assets}}的功能。消除**物物交換**{{barter}}的**欲望雙重巧合**{{double coincidence of wants}}，降低交易成本、鼓勵**專業分工**{{specialization}}、提升**效率**{{efficiency}}。","**計價單位**{{unit of account}}：用價格比較價值，減少需要的價格數目。N 種商品物物交換需要 **N(N−1)/2** 個價格（10 種 → 45 個）。","**價值儲存**{{store of value}}：股債、房子也能儲值，但貨幣**流動性最高**{{most liquid asset}}，所以通膨時人們仍持有貨幣。","**交易成本**{{transaction costs}}：交換商品勞務所花的時間與資源；物物交換的交易成本最高。","能當貨幣的**商品**{{commodity}}要：容易**標準化**{{standardized}}、被廣泛接受、**可分割**{{divisible}}、**不易損壞**{{does not deteriorate quickly}}。"]},{"h":"流動性與貨幣價值","items":["**流動性**{{liquidity}}：資產能多快、以多低成本換成交易媒介。賣出成本越高，流動性越低。排序例：通貨 ＞ **儲蓄債券**{{savings bonds}} ＞ 房子。","**貨幣價值**{{value of money}}與**物價水準**{{price level}}反向：物價翻倍 → 貨幣價值減半；物價跌一半 → 貨幣價值加倍。","**惡性通膨**{{hyperinflation}}：物價極快上漲，貨幣失去價值儲存功能，人們改用物物交換（例：尼加拉瓜 1990 年通膨超過 13,000%）。"]},{"h":"付款制度的演進","items":["**付款制度**{{payments system}}演進：物物交換 → 貴金屬（**商品貨幣**{{commodity money}}）→ 紙幣（**法定貨幣**{{fiat money}}）→ **支票**{{checks}} → **電子資金移轉**{{electronic funds transfer}}。每一步都是**降低交易成本**{{reduce transaction costs}}的創新。","商品貨幣難運送；紙幣要靠印刷技術防偽{{counterfeiting}}；大額交易普及後支票興起。","電子資金移轉優點：成本低、即時完成。支票缺點：處理成本高、清算要時間；但人們想要**紙本收據**{{paper receipt}}，所以支票短期內不會消失。","**電子貨幣**{{e-money}}：**金融卡**{{debit card}}、**儲值卡**{{stored-value card}}、**智慧卡**{{smart card}}都可替代現金；**信用卡**{{credit card}}不是現金替代品（它是借款）。","**貨幣同盟**{{monetary union}}（歐元 euro）：免除貨幣兌換的交易成本。"]},{"h":"貨幣總計數：M1、M2、M3","items":["**M1**＝通貨 ＋ **旅行支票**{{traveler's checks}} ＋ **活期存款**{{demand deposits}} ＋ 其他支票存款（如 **NOW 帳戶**{{NOW accounts}}）。美國貨幣大部分是支票存款。","**M2**＝M1 ＋ **小額定存**{{small-denomination time deposits}} ＋ **儲蓄存款**{{savings deposits}} ＋ **貨幣市場存款帳戶**{{money market deposit accounts, MMDA}} ＋ 非機構**貨幣市場共同基金**{{(noninstitutional) money market mutual fund shares}}。","**M3**＝M2 ＋ **大額定存**{{large-denomination time deposits}}等，範圍最大。儲蓄債券、附買回協議{{repurchase agreements}}不在 M1，儲蓄債券也不在 M2。","資金移動判斷法：兩邊都在 M1 → 都不變；從 M2-only 移到 M1 → M1 增加、M2 不變（M1 increases and M2 stays the same）；從 M2 外（如儲蓄債券）換成現金 → M1、M2 都增加。","金融創新使 Fed **更難定義貨幣**；各**貨幣總計數**{{monetary aggregates}}長期同向但短期可能分歧（1990 年代最明顯）。","Fed 最初公布的數據常被大幅**修正**{{revised}}，不適合判斷**短期變化**{{short-run movements}}，但對長期趨勢仍可靠。"]}],"9":[{"h":"銀行資產負債表","items":["**資產負債表**{{balance sheet}}：**總資產＝總負債＋銀行資本**{{total assets = total liabilities + capital}}。負債是**資金來源**{{sources of funds}}，資產是**資金用途**{{uses of funds}}。從表上看得出是否有**清償能力**{{solvent}}，但看不出是否獲利。","**負債**{{liabilities}}：**支票存款**{{checkable deposits}}、**非交易性存款**{{nontransaction deposits}}（儲蓄、定存、CD）、**借入款**{{borrowings}}（向 Fed 的**貼現放款**{{discount loans}}、聯邦資金）、**銀行資本**{{bank capital}}（列在負債方）。","**資產**{{assets}}：**準備金**{{reserves}}、**托收中現金**{{cash items in process of collection}}、**存放同業**{{deposits at other banks}}、**證券**{{securities}}、**放款**{{loans}}（最大項、收入主要來源、報酬最高但流動性低）、其他資產。","非交易性存款是銀行**最主要**的資金來源；支票存款比重隨時間下降，但通常是**最便宜的資金**{{lowest-cost source of funds}}。","流動性越高利率越低：支票存款 → **存摺儲蓄**{{passbook savings}} → **定期存款**{{time deposits}}，流動性遞減、利率遞增。","準備金＝在 Fed 的存款＋**庫存現金**{{vault cash}}，分為**法定準備**{{required reserves}}與**超額準備**{{excess reserves}}。**次級準備**{{secondary reserves}}＝短期政府證券，可低成本變現。"]},{"h":"銀行的基本運作","items":["**資產轉換**{{asset transformation}}：賣出短期負債、買進長期資產，也就是**借短放長**{{borrow short and lend long}}，賺取利差。","**T 帳戶**{{T-account}}：存入現金 → 存款（負債）與準備金（資產）同額增加。","支票存入他行：開票銀行的存款與準備減少，收票銀行的存款與準備增加。","存入 100 萬、**法定準備率**{{required reserve ratio}} 20%：法定準備 20 萬，可放款 80 萬。"]},{"h":"流動性管理","items":["**存款流出**{{deposit outflow}}時，存款與準備金**等額**減少。超額準備足夠就不必調整。","**可承受的最大流出**＝(準備 − 法定準備率 × 存款) ÷ (1 − 法定準備率)。例：存款 10 萬、率 20%、準備 4 萬 → (4 萬 − 2 萬) ÷ 0.8＝2.5 萬。","**準備不足**{{reserve deficiency}}的補法（成本由低到高）：借聯邦資金 → 賣證券 → 向 Fed 借 → **收回**{{call in}}或**出售放款**{{sell loans}}（成本最高）。","**流動性管理**{{liquidity management}}：超額準備是應付流出的**保險**{{insurance}}；流出成本越高，銀行持有越多超額準備；預期**存款流入**{{deposit inflow}}時可持有較少。"]},{"h":"資產管理與負債管理","items":["**資產管理**{{asset management}}：在控制風險、保留流動性下追求最高報酬——找好借款人、買高報酬低風險證券、**分散**{{diversify}}資產、管理流動性。","**負債管理**{{liability management}}：1960 年代後大銀行主動以**可轉讓定存**{{negotiable CDs}}、聯邦資金取得資金；結果支票存款重要性下降、放款比重上升。"]},{"h":"資本適足管理","items":["**資本適足管理**{{capital adequacy management}}：**無力清償**{{insolvent}}是資產價值低於負債。資本是吸收損失的**緩衝**{{cushion}}，可防止**銀行倒閉**{{bank failure}}。","**ROA**{{return on assets}}＝稅後淨利 ÷ 資產；**ROE**{{return on equity}}＝稅後淨利 ÷ 權益資本；**權益乘數**{{equity multiplier, EM}}＝資產 ÷ 權益資本；**ROE＝ROA × EM**。","取捨：資本越少，ROE 越高，但倒閉風險越大。沒有管制時銀行傾向持有**太少資本**{{too little capital}}，所以需要最低資本要求。","**淨利差**{{net interest margin}}＝(利息收入 − 利息支出) ÷ 資產。","1990–92 **信用緊縮**{{credit crunch}}：房地產跌價造成**放款損失**{{loan losses}}侵蝕資本，加上資本要求提高。","存戶面臨**道德風險**{{moral hazard}}（銀行可能冒過多風險）；銀行靠高資本與分散放款表明利益一致。"]},{"h":"信用風險管理","items":["**信用風險**{{credit risk}}：靠**篩選與監督**{{screening and monitoring}}：**專業放款**{{specialization in lending}}（看似沒分散，但能解決**逆選擇**{{adverse selection}}）、合約寫入**限制性條款**{{restrictive covenants}}。","**長期往來關係**{{long-term customer relationships}}與**放款承諾**{{loan commitments}}：降低資訊成本，處理合約沒寫到的道德風險。","**擔保品**{{collateral}}與**補償性餘額**{{compensating balances}}（借款人須在銀行留最低存款，方便監督）。","**信用配給**{{credit rationing}}：即使願付高利率也不借，或借得比申請的少（貸款越大越有誘因做壞事）。","易錯：**利率交換**{{interest-rate swaps}}管理的是**利率風險**，不是信用風險。"]},{"h":"利率風險管理","items":["**利率風險**{{interest-rate risk}}：**利率敏感**{{rate-sensitive}}負債 ＞ 利率敏感資產 → 利率上升時獲利**減少**；反之亦然。","**缺口分析**{{gap analysis}}：**缺口**{{gap}}＝利率敏感資產 − 利率敏感負債；獲利變動＝缺口 × 利率變動。例：缺口 +2000 萬、利率降 5 個百分點 → 獲利減少 100 萬。","**存續期間分析**{{duration analysis}}：淨值變動 ≈ −(資產存續期間 − 負債存續期間 × L/A) × Δi/(1+i) × 資產。資產 5 年、負債 3 年、利率升 5 點 → 淨值約減資產的 10%。兩者的差叫**存續期間缺口**{{duration gap}}。","預期利率**上升**：買短期債、做短期放款、賣長期 CD 鎖住低成本。預期利率**下降**：買長期債、拉長資產存續期間。","避險工具：利率交換、**金融期貨**{{financial futures}}、**選擇權**{{options}}。"]},{"h":"表外業務與交易風險","items":["**表外業務**{{off-balance-sheet activities}}：**放款出售**{{loan sales}}、外匯交易、金融期貨等手續費業務；可增加獲利、可避險，也可能增加風險。","交易員有**委託代理問題**{{principal-agent problem}}；靠**內部控制**{{internal controls}}（交易與記帳分開）、**風險值**{{value-at-risk}}、**壓力測試**{{stress testing}}管理。","預期呆帳時從盈餘提列**備抵呆帳**{{loan loss reserves}}，報告盈餘減少。"]}],"10":[{"h":"美國銀行體系的歷史","items":["**雙軌銀行制度**{{dual banking system}}：銀行可由**聯邦**（**國家銀行**{{national banks}}，OCC 發照）或**州**（**州立銀行**{{state banks}}）發照監理。","**1863 國家銀行法**{{National Bank Act of 1863}}：建立聯邦發照的國家銀行系統，設**貨幣監理署**{{Office of the Comptroller of the Currency, OCC}}；對州**銀行券**{{bank notes}}課稅後，州銀行改靠**吸收存款**{{deposits}}存活。","**1913 聯邦準備法**{{Federal Reserve Act}}：國家銀行**必須**加入 Fed，州銀行可選擇。","**FDIC**{{Federal Deposit Insurance Corporation}}（1934）：Fed **會員銀行**{{member banks}}必須投保，非會員可選擇；大蕭條後倒閉大減主要歸功於存款保險。","**Glass-Steagall 法**：禁止商業銀行**承銷**{{underwrite}}公司證券，1999 年由 **Gramm-Leach-Bliley 法**廢除。","監理分工：OCC 管國家銀行、Fed 與州機關管會員州銀行、**Fed 單獨監理銀行控股公司**{{bank holding companies}}、FDIC 檢查非會員州銀行。"]},{"h":"金融創新","items":["**金融創新**{{financial innovation}}由需求、供給、法規三方面推動。","**需求面**：1970 年後**利率波動大增**{{increased volatility of interest rates}} → 利率風險升高 → 需要**機動利率房貸**{{adjustable-rate mortgages}}、**金融衍生性商品**{{financial derivatives}}（**期貨契約**{{futures contracts}}）來避險。機動利率房貸在利率下降時對屋主有利、能保護金融機構收入；**固定利率房貸**{{fixed-rate mortgage}}則讓屋主不受利率上升影響。","**供給面**：**電腦與通訊技術**{{information technology}}降低創新成本 → 信用卡、**金融卡**{{debit card}}、**ATM**、**網路銀行**{{virtual banks}}、**垃圾債券**{{junk bonds}}、商業本票市場成長、**證券化**{{securitization}}。","**信用卡**{{credit card}}是借款；金融卡消費時立即從帳戶扣款。","垃圾債券＝新發行的低評等債；**墮落天使**{{fallen angels}}＝被降評到 Baa 以下的舊債。","**規避法規**{{avoidance of regulations}}，又叫**鑽漏洞**{{loophole mining}}：**準備金要求**{{reserve requirements}}像對存款課稅、存款**利率上限**{{interest-rate ceilings}}（**Q 規則**{{Regulation Q}}）→ 催生**貨幣市場共同基金**{{money market mutual funds}}、**自動轉存帳戶**{{sweep accounts}}（讓準備要求失去約束力）。","**脫媒**{{disintermediation}}：市場利率高於存款利率上限時，資金流出銀行。"]},{"h":"傳統銀行業的衰退","items":["**傳統銀行業務**{{traditional banking}}衰退：商業銀行占借款人資金來源比重從約 40% 降到約 30%；支票存款占銀行負債從超過 60% 降到 15% 以下。","**成本優勢下降**{{loss of cost advantages}}：取消 Q 規則上限、貨幣市場基金競爭。","**收入優勢下降**{{loss of income advantages}}：商業本票、垃圾債券市場成長、證券化。","銀行的回應：做更高風險的放款（**商業不動產**{{commercial real estate}}）、擴大**表外業務**{{off-balance-sheet activities}}；結果是倒閉、合併增加。全球都有此趨勢，原因是**解除管制**{{deregulation}}與資訊科技。"]},{"h":"銀行業結構與整併","items":["美國銀行家數特別多，因為過去**限制設分行**{{branching restrictions}}（1927 **麥克法登法**{{McFadden Act}}禁止**跨州**{{interstate}}分行），源自 19 世紀**民粹主義**{{populist sentiment}}、擔心大銀行壟斷，結果是缺乏競爭。","**銀行控股公司**{{bank holding companies}}：規避分行限制，擁有多家銀行並經營相關業務；ATM 等**共用電子設施**{{shared electronic banking facilities}}也降低了分行限制的影響。","**1994 Riegle-Neal 法**{{Riegle-Neal Interstate Banking Act}}開放跨州設分行 → **合併收購**{{mergers and acquisitions}}使銀行家數減少、規模變大；**超區域銀行**{{superregional banks}}出現。","**範疇經濟**{{economies of scope}}，商業上叫**綜效**{{synergies}}：用同一資源提供多種產品。","**全國性銀行**{{nationwide banking}}好處：競爭增加、放款組合跨州分散、倒閉減少；反對者擔心**社區銀行**{{community banks}}消失、小企業貸款減少。"]},{"h":"金融混業與國際銀行業","items":["**綜合銀行**{{universal banking}}（德國式）：單一法人經營銀行、證券、保險。**英式綜合銀行**{{British-style universal banking}}：用子公司經營證券。日本銀行可持有企業股權。","儲貸由 OTS、FDIC、**聯邦住宅貸款銀行體系**{{FHLBS}}等監理；**信用合作社**{{credit unions}}由具**共同關係**{{common bond}}的成員組成。","**國際銀行業**{{international banking}}成長原因：**國際貿易**{{world trade}}與**跨國企業**{{multinational corporations}}成長、美國銀行想擴張。","**歐洲美元**{{Eurodollars}}：存在美國境外銀行的美元存款（**倫敦**為中心），不受準備金要求。","**國際金融業務分行**{{international banking facilities, IBFs}}：在美國境內只收外國人存款、只放款給外國人，不受準備與利率限制。1978 **國際銀行法**{{International Banking Act}}後外國銀行的優勢減少。"]}],"11":[{"h":"為什麼需要政府安全網","items":["**政府安全網**{{government safety net}}存在的原因是**資訊不對稱**{{asymmetric information}}：存戶分辨不出好壞銀行。","**順序服務限制**{{sequential service constraint}}：先到先領 → 危機時存戶搶著提款 → **銀行擠兌**{{bank run}}，甚至**銀行恐慌**{{bank panic}}。","**傳染效應**{{contagion effect}}：一家銀行倒閉引發其他（甚至健全的）銀行被擠兌。","**存款保險**{{deposit insurance}}（FDIC）能阻止擠兌，但也帶來副作用（見下一節）。"]},{"h":"安全網的副作用","items":["**道德風險**{{moral hazard}}：存戶有保障就不監督銀行，銀行**冒更多風險**{{take on greater risks}}。","**逆選擇**{{adverse selection}}：愛冒險的人最想進入受保護的銀行業（像開車技術差的人最搶著買**碰撞險**{{collision insurance}}）。","FDIC 處理倒閉銀行：**清償法**{{payoff method}}只賠保額內存款；**購買與承接法**{{purchase and assumption method}}找健全銀行承接，實際上保障**所有**存款。","**大到不能倒**{{too big to fail}}：大銀行倒閉時用購買與承接法 → 大銀行道德風險**更高**、對小銀行不公平。**金融整併**{{financial consolidation}}讓大到不能倒的銀行變多。","存款保險只在**制度環境**{{institutional environment}}健全（法治、有效監理、政府清廉）的國家運作良好。"]},{"h":"審慎監理的工具","items":["**限制資產持有**{{restrictions on asset holdings}}：不得持有普通股、限制對單一借款人的放款。原因是倒閉的**社會成本**{{social cost}}大於銀行的**私人成本**{{private cost}}。","**資本要求**{{capital requirements}}：**槓桿比率**{{leverage ratio}}＝資本 ÷ 總資產；**風險基礎資本**{{risk-based capital}}涵蓋表外業務；另有**交易業務**{{trading activities}}資本要求。**資本充足**{{well-capitalized}}的銀行倒閉時損失較多，較不願冒險。","**巴塞爾協定**{{Basel Accord}}（1988）：國際統一資本要求，總資本至少為**風險調整後資產**{{risk-adjusted assets}}的 8%；商業本票權數 100%、政府證券 0%。","**監理套利**{{regulatory arbitrage}}：保留高風險資產、移出同權數的低風險資產 → 反而**增加**冒險。","**發照**{{chartering}}主要處理逆選擇；**金融檢查**{{bank examinations}}主要減少道德風險（也間接勸退愛冒險的人）。合稱**審慎監理**{{prudential supervision}}。","現行做法：評估銀行**風險管理**{{risk management}}流程是否健全，不只看資產負債表。","**限制競爭**{{restrictions on competition}}（分行限制、禁止非銀行經營銀行業）：競爭會促使銀行冒險，但也降低效率。"]},{"h":"1980 年代銀行與儲貸危機","items":["**解除管制**{{deregulation}}：1980 **DIDMCA**{{Depository Institutions Deregulation and Monetary Control Act}}（全國開放 NOW 帳戶、逐步取消利率上限、存保額度 4 萬 → **10 萬**）、1982 **Garn-St. Germain 法**（開放 **MMDA**{{money market deposit accounts}}）。","加上金融創新，讓儲貸有更多冒險管道；1979–81 利率急升與 1981–82 衰退重創金融機構。","**監理寬容**{{regulatory forbearance}}：明知儲貸無力清償卻不關閉、等於**降低資本要求**{{lowering capital requirements}} → **殭屍儲貸**{{zombie S&Ls}}孤注一擲冒險，以高利率搶走健全儲貸的存款，損失越滾越大。","監理官為何寬容：**FSLIC** 沒錢、不想承認失敗（**官僚賭博**{{bureaucratic gambling}}）、屈服於收政治獻金的國會議員。1987 **CEBA**{{Competitive Equality Banking Act}}資金不足又要求繼續寬容。","**委託代理問題**{{principal-agent problem}}：選民（委託人 principal）與監理官、政治人物（代理人 agent）目標不一致，是紓困拖延、代價更高的根本原因。"]},{"h":"改革立法","items":["**FIRREA**{{Financial Institutions Reform, Recovery, and Enforcement Act}}（1989）：廢除 **FHLBB**{{Federal Home Loan Bank Board}} 與 FSLIC、設 **OTS**{{Office of Thrift Supervision}} 監理儲貸、FDIC 成為唯一存保機構、成立 **RTC**{{Resolution Trust Corporation}} 處理倒閉儲貸。批評：沒處理存款保險的道德風險根本問題。","**FDICIA**{{FDIC Improvement Act}}（1991）：縮小存保範圍、**限制大到不能倒**、要求 FDIC **及早介入**{{prompt corrective action}}問題銀行、**風險基礎存保費率**{{risk-based insurance premiums}}。"]},{"h":"國際經驗與未來改革","items":["北歐、拉美、日本、俄羅斯、東歐的**銀行危機**{{banking crises}}共同點：**金融自由化**{{financial liberalization}}、銀行缺乏篩選監督專業、監理不足。墨西哥、委內瑞拉的紓困成本占 GDP 比例遠高於美國。","改革方向：**共同保險**{{coinsurance}}（存戶承擔部分損失）、風險基礎保費（降低道德風險、鼓勵多持資本）、**市價會計**{{market-value accounting}}（取代**歷史成本會計**{{historical-cost accounting}}，在淨值歸零前就關閉銀行）。","取消存保未必帶來**市場紀律**{{market discipline}}：存戶沒能力監督銀行，且可能引發擠兌；大到不能倒也讓大銀行缺乏未保險存戶的約束。"]}],"S11":[{"h":"美國銀行體系的歷史（1782–1933）","items":["1782 **北美銀行**{{Bank of North America}}：現代商業銀行起點。1791 **第一合眾國銀行**{{First Bank of the U.S.}}由漢彌爾頓推動，1811 年因州權與農業利益反對未展延。","1816 **第二合眾國銀行**{{Second Bank of the U.S.}}；1832 年傑克森總統否決換約，1836 年結束 → 近三十年沒有央行的**野貓銀行時代**{{wildcat banking era}}，州立銀行濫發**銀行券**{{bank notes}}。","1863 **國家銀行法**{{National Bank Act}}：設 **OCC** 與**國民銀行**{{national banks}}，發行統一國家銀行券；對州銀行券課 10% 重稅 → 州銀行改用**支票存款**{{checking deposits}}存活 → **雙元銀行體系**{{dual banking system}}。","1913 **聯邦準備法**{{Federal Reserve Act}}：Fed 當**最後貸款人**{{lender of last resort}}；國民銀行必須加入，州立銀行自願。","1933 **Glass-Steagall 法**：設 **FDIC**、商業銀行與投資銀行**分離**、授權 **Q 規則**{{Regulation Q}}存款利率上限。"]},{"h":"多頭監理架構","items":["**OCC**：國民銀行（資產占商業銀行一半以上）。","**Fed**：加入 Fed 的州立銀行（與州共同），並**單獨監理銀行控股公司**{{bank holding companies, BHCs}}。","**FDIC**：未加入 Fed 但有投保的州立銀行（與州共同），並運作存款保險基金。","**州主管機關**{{state banking authorities}}：所有州立銀行；未投保 FDIC 的極少數州立銀行完全由州管。"]},{"h":"金融創新與影子銀行","items":["需求面：1970–80 年代三個月國庫券利率從 1%–3.5% 飆到 5%–15%+ → **利率風險**{{interest-rate risk}} → 1975 年加州儲貸首創**機動利率房貸**{{adjustable-rate mortgages, ARMs}}、CBOT 推出**利率期貨**{{interest-rate futures}}。","供給面（資訊科技）：信用卡與**金融卡**{{debit cards}}、ATM、1995 年第一家**網路銀行**{{virtual bank}}、1977 年 Milken 的**垃圾債券**{{junk bonds}}市場、**商業本票**{{commercial paper}}市場。","**證券化**{{securitization}}：把房貸、車貸等小額缺乏流動性的資產打包成可交易證券（MBS/CDO）。**發起後分銷**{{originate-to-distribute model}}：發起者不承擔違約風險 → **道德風險**{{moral hazard}} → 次級房貸授信標準下滑，是 2007–2009 金融海嘯的核心。這套體系稱為**影子銀行**{{shadow banking system}}。","**規避法規**{{loophole mining}}：法定準備等於對存款課**隱含稅**{{implicit tax}}，稅率＝i × r（市場利率 × 準備率）。例：100 萬存款、r＝10%、i＝5% → 準備 10 萬，每年隱含稅 5,000。","**貨幣市場共同基金**{{money market mutual funds, MMMFs}}（1970 Bruce Bent 創設）：不是法律上的存款，不受 Q 規則與準備要求限制。**自動轉存帳戶**{{sweep accounts}}：每晚把企業帳戶超額資金掃進隔夜證券，免提準備、變相付息。","2008 **儲備初級基金**{{Reserve Primary Fund}}持有雷曼商業本票，淨值跌到 97 美分，**跌破面額**{{breaking the buck}} → 貨幣市場基金擠兌，靠 Fed 流動性機制與財政部暫時擔保平息。"]},{"h":"傳統銀行業的式微","items":["商業銀行占非金融部門借款比重：1974 年超過 **40%** → 2020 年約 **20%**（舊版 7 版是降到 30%，注意版本差異）。","低成本支票存款占銀行負債：1960 年代超過 **60%** → 現在約 **14%**。","負債面喪失成本優勢（MMMFs、取消 Q 規則後要付市場利率）；資產面喪失收入優勢（優良企業改發商業本票與垃圾債券、證券化搶走房貸與消費放款）。","銀行的回應：承做高風險放款（商業不動產、**槓桿收購**{{leveraged buyouts, LBOs}}融資）、轉向**表外業務**{{off-balance-sheet activities}}賺手續費。"]},{"h":"銀行業結構與整併","items":["**雙峰結構**{{bimodal structure}}（2020）：資產 10 億美元以下的**社區銀行**{{community banks}}占家數 83.9%、資產只占 7.2%；資產 2,500 億以上僅 13 家，卻占 50.4%。前四大：JPMorgan Chase、Bank of America、Wells Fargo、Citigroup。","1927 **麥克法登法**{{McFadden Act}}禁止跨州設分行，源自 19 世紀**農業民粹主義**{{populist anti-bank sentiment}}。規避方式：**銀行控股公司**（持有 90% 以上存款）、**共用 ATM 網路**{{shared ATM networks}}（法院認定第三方 ATM 不算分行）。","家數：1934–1985 約 **14,000** 家 → 2019 年 **5,000** 家以下，主要是**併購**{{mergers and acquisitions}}而非倒閉。","整併三大引擎：問題銀行淘汰與併購潮、**區域互惠協議**{{regional reciprocal compacts}}（緬因 1975、麻州 1982）催生**超區域銀行**{{superregional banks}}、資訊科技的**規模經濟**{{economies of scale}}與**範疇經濟**{{economies of scope}}（交叉銷售、綜效 synergies）。","1994 **Riegle-Neal 法**{{Riegle-Neal Interstate Banking and Branching Efficiency Act}}推翻麥克法登法，開啟全國性銀行時代（1998 NationsBank 與 Bank of America 合併）。","評價：效率提升、地域風險分散 vs. 中小企業**關係型融資**{{relationship lending}}受損、大到不能倒；經濟學家多數認為**利大於弊**，紐約與加州自由化後社區銀行並未消失。"]},{"h":"銀行業與證券業的分離和瓦解","items":["1987 **第 20 條漏洞**{{Section 20 loophole}}：Fed 准許銀行控股公司以子公司承銷部分證券，營收占比上限 10% → 25%；1990 年 J.P. Morgan 獲准承銷公司債與股票。","1999 **金融服務現代化法**{{Gramm-Leach-Bliley Act, GLBA}}：起因於 1998 Citicorp 與 Travelers 合併；廢除 Glass-Steagall 防火牆，允許**金融控股公司**{{financial holding company, FHC}}。","**功能性監理**{{functional regulation}}：證券子公司歸 SEC、保險子公司歸州保險局、銀行子公司歸 OCC／Fed／FDIC，FHC 由 Fed **傘狀監理**{{umbrella supervision}}。","2008 獨立投資銀行終結：Bear Stearns 被摩根大通收購、Lehman 破產、Merrill Lynch 賣給美國銀行、Goldman Sachs 與 Morgan Stanley 改制為**銀行控股公司**；依賴**批發性融資**{{wholesale funding}}的模式結束。","三種架構：**全能銀行**{{universal banking}}（德、荷、瑞士）、**英式全能銀行**{{British-style universal banking}}（英、加、澳，用子公司）、**法律分業**{{legal separation}}（過去的日本，2006 年起解禁）。"]},{"h":"儲蓄機構與國際銀行業","items":["**儲貸協會**{{savings and loan associations, S&Ls}}：專營房貸，可選聯邦（OCC）或州特許。**互助儲蓄銀行**{{mutual savings banks}}：存戶共同所有，多在美東。**信用合作社**{{credit unions}}：非營利、依職業或社區組成，聯邦特許由 **NCUA** 監理、享免稅。","美資銀行海外擴張三大推力：跨國企業與國際貿易、海外投行與保險利潤、**歐洲美元市場**{{Eurodollar market}}。","歐洲美元：存在美國境外銀行的美元存款，起源於 1950 年代蘇聯怕美元被凍結；免法定準備、無利率上限，倫敦為中心，避稅港常是**空殼分行**{{shell operations}}。","**Edge 法案公司**{{Edge Act corporation}}：專辦國際業務的特許子公司，Riegle-Neal 前就能跨州設點。**國際銀行設施**{{international banking facilities, IBFs}}（1981）：美國境內帳戶，只收外國人定存、只放款給外國實體，免準備與地方稅。","外資銀行約占美國商業銀行資產 20%，型態：**代理處**{{agency office}}、**美國子銀行**{{subsidiary U.S. bank}}、**外國銀行分行**{{branch of a foreign bank}}；1978 **國際銀行法**{{International Banking Act}}讓內外資**公平競爭**{{level playing field}}。","2020 全球前十大銀行：前四名都是中國國有銀行（工行、建行、農行、中行），美國只有摩根大通（第 5）與美國銀行（第 8）。"]}]}</script>
<script>
"use strict";
const QB = JSON.parse(document.getElementById("qb").textContent);
const EXP = JSON.parse(document.getElementById("exp").textContent);
const CHS = [1,2,3,9,10,11,"S11"];
const CL = ch => String(ch).startsWith("S") ? "補充 Ch"+String(ch).slice(1) : "Ch"+ch;
const ZH = {1:"為什麼要學貨幣、銀行與金融市場",2:"金融體系概觀",3:"貨幣是什麼",9:"銀行業務與金融機構管理",10:"銀行業：結構與競爭",11:"銀行監理的經濟分析",S11:"老師上課補充教材：銀行業結構與競爭（13 版）"};
const L = "abcde";
const PER = 20;

/* ---------- 重點名詞 ---------- */
const GL = JSON.parse(document.getElementById("gl").textContent);   // [[ [src,cs]... ], zh, ex]
const ALTS = [];
GL.forEach((g,i) => g[0].forEach(([src,cs]) => {
  try { ALTS.push({ re: new RegExp(`(?<![A-Za-z])(?:${src})(?:e?s)?(?![A-Za-z])`, cs ? "g" : "gi"), i }); } catch {}
}));
let lang = "zh";
try { lang = localStorage.getItem("qb-lang") || "zh"; } catch {}
function findTerms(text){
  const found = [];
  for (const a of ALTS){ a.re.lastIndex = 0; let m; while ((m = a.re.exec(text))){ found.push([m.index, m.index+m[0].length, a.i]); if (!m[0].length) a.re.lastIndex++; } }
  found.sort((x,y) => x[0]-y[0] || (y[1]-y[0])-(x[1]-x[0]));
  const out = []; let end = -1;
  for (const f of found) if (f[0] >= end){ out.push(f); end = f[1]; }
  return out;
}
/* ctx = {seen:Set, list:[]}; first occurrence of each term gets an inline 中文 gloss */
function annotate(text, ctx){
  if (lang !== "zh" || !ctx) return document.createTextNode(text);
  const frag = document.createDocumentFragment(); let pos = 0;
  for (const [s,e,i] of findTerms(text)){
    if (s > pos) frag.append(text.slice(pos,s));
    const span = el("span",{class:"term"}, text.slice(s,e));
    if (!ctx.seen.has(i)){ ctx.seen.add(i); ctx.list.push([text.slice(s,e), i]); span.append(el("span",{class:"gloss",text:GL[i][1]})); }
    frag.append(span); pos = e;
  }
  if (pos < text.length) frag.append(text.slice(pos));
  return frag;
}
function termBox(ctx){
  if (lang !== "zh" || !ctx.list.length) return null;
  return el("div",{class:"terms"},
    el("span",{class:"label",text:"重點名詞"}),
    el("dl",{}, ctx.list.map(([en,i]) => el("div",{},
      el("dt",{}, el("span",{class:"en",text:en}), el("span",{class:"zh",text:GL[i][1]})),
      el("dd",{text:GL[i][2]})))));
}
const newCtx = () => ({ seen:new Set(), list:[] });
let rerender = () => renderHome();
function setLang(v, persist){
  lang = v;
  $("#lang-en").setAttribute("aria-pressed", v==="en"); $("#lang-zh").setAttribute("aria-pressed", v==="zh");
  try { localStorage.setItem("qb-lang", v); } catch {}
  if (persist && db) db.doc(`data/users/${uid}/prefs`).set({ lang: v, pool: poolMode }).catch(()=>{});
  rerender();
}

/* ---------- state ---------- */
let db = null, uid = null, sample = null;
const rec = {};            // rec[ch][n] = {t,c,l,w,f}
CHS.forEach(c => rec[c] = {});
let histList = [];
const expCache = {};       // key "ch-n" -> text
let quiz = null;

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
function el(tag, attrs, ...kids){
  const e = document.createElement(tag);
  if (attrs) for (const [k,v] of Object.entries(attrs)){
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "text") e.textContent = v;
    else if (v !== false && v != null) e.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k.nodeType ? k : document.createTextNode(String(k)));
  return e;
}
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; };
const Q = (ch,n) => QB[ch].qs[n-1];
const KEEP = JSON.parse(document.getElementById("keep").textContent);
let poolMode = "key";
try { poolMode = localStorage.getItem("qb-pool") || "key"; } catch {}
const pool = ch => poolMode === "key" ? KEEP[ch] : QB[ch].qs.map(q => q.n);
const poolSize = () => CHS.reduce((s,c)=>s+pool(c).length,0);
function setPool(v, persist){
  poolMode = v;
  $("#pool-key").setAttribute("aria-pressed", v==="key"); $("#pool-all").setAttribute("aria-pressed", v==="all");
  try { localStorage.setItem("qb-pool", v); } catch {}
  if (persist && typeof db !== "undefined" && db && uid) db.doc(`data/users/${uid}/prefs`).set({ lang, pool: v }).catch(()=>{});
  if (!quiz) renderHome();
}
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
const lsSet = (k,v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const fmtTime = ts => { const d = new Date(ts); return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; };

function stat(ch){
  const ns = pool(ch), total = ns.length, r = rec[ch];
  let done=0, mastered=0, pending=0, review=0, tries=0, correct=0;
  for (const n of ns){ const x=r[n]; if (!x) continue; done++; tries+=x.t; correct+=x.c;
    if (x.w>0 && !x.f) pending++; else if (x.l) mastered++; else review++; }
  return {total, done, mastered, pending, review, acc: tries? correct/tries : null};
}
function cellState(ch,n){ const x = rec[ch][n]; if (!x) return ""; if (x.w>0 && !x.f) return "p"; return x.l ? "m" : "r"; }

/* ---------- persistence ---------- */
const writeChain = {};
const writeTimer = {};
function saveCh(ch){
  if (!db){ lsSet("qb-rec", rec); return; }
  clearTimeout(writeTimer[ch]);
  writeTimer[ch] = setTimeout(() => {
    const data = { r: rec[ch], updated: Date.now() };
    writeChain[ch] = (writeChain[ch] || Promise.resolve()).then(() =>
      db.doc(`data/users/${uid}/chapters/ch${ch}`).set(data)).catch(e => console.warn("save failed", e));
  }, 500);
}
async function saveSession(s){
  histList.unshift(s); histList = histList.slice(0, 10);
  if (!db){ lsSet("qb-hist", histList); return; }
  try { await db.collection(`data/users/${uid}/sessions`).add(s); } catch(e){ console.warn(e); }
}
async function loadAll(){
  if (!db){
    const r = lsGet("qb-rec"); if (r) CHS.forEach(c => rec[c] = r[c] || {});
    histList = lsGet("qb-hist") || [];
    return;
  }
  await Promise.all(CHS.map(async c => {
    try { const s = await db.doc(`data/users/${uid}/chapters/ch${c}`).get(); if (s.exists) rec[c] = (s.data().r) || {}; } catch(e){ console.warn(e); }
  }));
  try {
    const q = await db.collection(`data/users/${uid}/sessions`).orderBy("ts","desc").limit(10).get();
    histList = q.docs.map(d => d.data());
  } catch(e){ console.warn(e); }
}

/* ---------- 中文解析 ---------- */
const expPending = {};
function getExplanation(ch, n, chosen){
  const key = `${ch}-${n}`;
  if (expCache[key]) return Promise.resolve(expCache[key]);
  if (!expPending[key]) expPending[key] = fetchExplanation(ch, n).finally(() => { delete expPending[key]; });
  return expPending[key];
}
async function fetchExplanation(ch, n){
  return EXP[`${ch}-${n}`] || null;
}
function explanationBox(ch, n, chosen){
  const box = el("div", {class:"exp"}, el("span",{class:"label",text:"中文解析"}), el("span",{class:"t muted",text:"載入解析…"}));
  const t = box.querySelector(".t");
  getExplanation(ch,n,chosen).then(text => {
    if (text){ t.textContent = text; t.className = "t"; }
    else { t.textContent = `正解是 (${L[Q(ch,n).a]})。中文解析需要允許此頁面「詢問 Claude」才能產生，可在頁面的權限選單開啟。`; }
  }).catch(e => {
    t.textContent = e && e.code === "rate_limited" ? "解析請求太頻繁，稍等一下再重新整理這題。" : `正解是 (${L[Q(ch,n).a]})。這次解析沒有產生成功，稍後在訂正本再看一次。`;
  });
  return box;
}

/* ---------- quiz ---------- */
function pick(ch, mode){
  const all = pool(ch);
  if (mode === "fix") return shuffle(all.filter(n => cellState(ch,n)==="p")).slice(0,PER).map(n=>({ch,n}));
  if (mode === "new"){
    const fresh = shuffle(all.filter(n => !rec[ch][n]));
    const rest = all.filter(n => rec[ch][n]).sort((a,b)=> (rec[ch][a].c/rec[ch][a].t) - (rec[ch][b].c/rec[ch][b].t) || Math.random()-.5);
    return fresh.concat(rest).slice(0,PER).map(n=>({ch,n}));
  }
  return shuffle(all).slice(0,PER).map(n=>({ch,n}));
}
function pickAllFix(){
  const out = []; CHS.forEach(ch => QB[ch].qs.forEach(q => { if (cellState(ch,q.n)==="p") out.push({ch,n:q.n}); }));
  return shuffle(out).slice(0,PER);
}
function startQuiz(items, mode, label){
  if (!items.length) return;
  quiz = { items, i:0, answers:[], mode, label, start: Date.now() };
  renderQuestion(); window.scrollTo(0,0);
}
function answer(choice){
  const it = quiz.items[quiz.i], q = Q(it.ch,it.n), ok = choice === q.a;
  const r = rec[it.ch][it.n] || {t:0,c:0,l:0,w:0,f:0};
  r.t++; if (ok){ r.c++; r.l=1; if (r.w>0) r.f=1; } else { r.l=0; r.w++; r.f=0; }
  rec[it.ch][it.n] = r;
  quiz.answers[quiz.i] = { ...it, choice, ok };
  saveCh(it.ch);
  renderQuestion(true);
}
function renderQuestion(answered){
  rerender = () => renderQuestion(answered);
  const it = quiz.items[quiz.i], q = Q(it.ch,it.n), a = quiz.answers[quiz.i];
  const ctx = newCtx();
  const stem = el("div",{class:"stem"}, annotate(q.q, ctx));
  const opts = el("div",{class:"opts"}, q.o.map((o,i) => {
    let cls = "opt";
    if (answered){ if (i===q.a) cls+=" right"; else if (i===a.choice) cls+=" wrong"; }
    return el("button",{class:cls, id:`opt-${i}`, disabled: answered || null, onclick:()=>answer(i)}, el("span",{class:"k",text:`(${L[i]})`}), el("span",{}, annotate(o, ctx)));
  }));
  const last = quiz.i === quiz.items.length-1;
  const panel = el("section",{class:"panel"},
    el("div",{class:"qmeta"},
      el("span",{class:"label",text:`${quiz.label} · ${CL(it.ch)} Q${it.n}`}),
      el("span",{class:"num small",text:`${quiz.i+1} / ${quiz.items.length}`})),
    el("div",{class:"progress"}, el("i",{style:`width:${(quiz.i+(answered?1:0))/quiz.items.length*100}%`})),
    stem,
    opts,
    termBox(ctx),
    answered ? el("div",{class:"verdict "+(a.ok?"ok":"no"), text: a.ok ? (quiz.mode==="fix" ? "答對了，這題訂正完成。" : "答對了。") : `答錯了，正解是 (${L[q.a]})。已加入訂正本。`}) : null,
    answered && !a.ok ? explanationBox(it.ch,it.n,a.choice) : null,
    el("div",{class:"actions"},
      answered ? el("button",{class:"primary", id:"next", onclick:()=>{ if(last) finish(); else { quiz.i++; renderQuestion(); window.scrollTo(0,0);} }, text: last ? "看成績" : "下一題"}) : null,
      el("button",{class:"ghost", onclick:()=>{ if (quiz.answers.filter(Boolean).length) finish(); else { quiz=null; renderHome(); } }, text: "結束作答"}))
  );
  $("#view").replaceChildren(panel);
  if (answered) $("#next")?.focus();
}
async function finish(){
  const done = quiz.answers.filter(Boolean), right = done.filter(a=>a.ok).length;
  const s = { ts: Date.now(), label: quiz.label, mode: quiz.mode, total: done.length, right };
  saveSession(s);
  renderResult(quiz, done, right);
}
function renderResult(qz, done, right){
  rerender = () => { const y = window.scrollY; renderResult(qz, done, right); window.scrollTo(0,y); };
  const wrong = done.filter(a=>!a.ok);
  const pct = done.length ? Math.round(right/done.length*100) : 0;
  const view = el("div",{class:"wrap", style:"padding:0"},
    el("section",{class:"panel"},
      el("span",{class:"label",text:qz.label+" · 成績"}),
      el("div",{class:"score"},
        el("div",{class:"big"}, `${right}/${done.length}`),
        el("div",{}, el("div",{text:`正確率 ${pct}%`}), el("div",{class:"muted small",text: wrong.length ? `${wrong.length} 題錯題已放進訂正本，下面附中文解析。` : "全對，這組沒有需要訂正的題目。"}))),
      el("div",{class:"actions"},
        wrong.length ? el("button",{class:"primary", onclick:()=>startQuiz(shuffle(wrong.map(w=>({ch:w.ch,n:w.n}))),"fix","立即訂正")}, `立即訂正這 ${wrong.length} 題`) : null,
        qz.mode !== "fix" && qz.items[0] ? el("button",{onclick:()=>startQuiz(pick(qz.items[0].ch, qz.mode), qz.mode, qz.label), text:"再來 20 題"}) : null,
        el("button",{class:"ghost", onclick:()=>{quiz=null;renderHome();}, text:"回章節總覽"}))),
    wrong.length ? el("section",{class:"sheet"}, el("h2",{text:"錯題與解析"}), wrong.map(w => wrongItem(w.ch,w.n,w.choice))) : null,
    el("section",{class:"sheet"}, el("h2",{text:"答題卡"}),
      el("div",{class:"grid"}, done.map((a,i)=> el("span",{class:"cell "+(a.ok?"m":"p"), title:`${CL(a.ch)} Q${a.n}`, text:i+1}))))
  );
  $("#view").replaceChildren(view); window.scrollTo(0,0);
}
function wrongItem(ch,n,choice,lazy){
  const q = Q(ch,n);
  const ctx = newCtx();
  const stemNode = annotate(q.q, ctx);
  const optNodes = q.o.map(o => annotate(o, ctx));
  const body = el("div",{class:"item"},
    el("div",{class:"qmeta"}, el("span",{class:"tag bad",text:`${CL(ch)} Q${n}`}), choice!=null ? el("span",{class:"small muted",text:`你選 (${L[choice]})`}) : el("span",{class:"small muted",text:`答錯 ${rec[ch][n]?.w||0} 次`})),
    el("div",{}, stemNode),
    el("div",{class:"ans"}, q.o.map((o,i)=> el("div",{class: i===q.a ? "" : "muted"}, el("span",{class:"mono",text:`(${L[i]}) `}), optNodes[i], i===q.a ? el("span",{class:"tag ok",style:"margin-left:6px",text:"正解"}) : null))),
    termBox(ctx)
  );
  if (lazy){
    const btn = el("button",{class:"ghost", text:"看中文解析", onclick:()=>{ btn.replaceWith(explanationBox(ch,n,choice)); }});
    body.append(btn);
  } else body.append(explanationBox(ch,n,choice));
  return body;
}

/* ---------- views ---------- */
function bar(s){
  const w = x => (x/s.total*100).toFixed(2)+"%";
  return el("div",{class:"bar", role:"img", "aria-label":`已掌握 ${s.mastered}、待訂正 ${s.pending}、待加強 ${s.review}、未作答 ${s.total-s.done}`},
    el("i",{class:"m",style:`width:${w(s.mastered)}`}), el("i",{class:"r",style:`width:${w(s.review)}`}), el("i",{class:"p",style:`width:${w(s.pending)}`}));
}
function renderHome(){
  rerender = renderHome;
  let T={total:0,done:0,pending:0,c:0,t:0};
  CHS.forEach(c=>{const s=stat(c);T.total+=s.total;T.done+=s.done;T.pending+=s.pending;for(const n of pool(c)){const x=rec[c][n];if(x){T.c+=x.c;T.t+=x.t;}}});
  const summary = el("section",{class:"summary"},
    el("div",{}, el("span",{class:"label",text:"完成度"}), el("span",{class:"num",text:`${(T.done/T.total*100).toFixed(1)}%`}), el("span",{class:"small muted num",text:`${T.done} / ${T.total} 題`})),
    el("div",{}, el("span",{class:"label",text:"正確率"}), el("span",{class:"num",text: T.t ? `${Math.round(T.c/T.t*100)}%` : "—"}), el("span",{class:"small muted num",text:`共作答 ${T.t} 次`})),
    el("div",{}, el("span",{class:"label",text:"待訂正"}), el("span",{class:"num",style:"color:var(--bad)",text:T.pending}), el("span",{class:"small muted",text:"答錯且還沒答對"})),
    el("div",{}, el("span",{class:"label",text:"練習次數"}), el("span",{class:"num",text:histList.length >= 10 ? "10+" : histList.length}), el("span",{class:"small muted",text:"每次 20 題"})));
  const legend = el("div",{class:"legend"},
    el("span",{}, el("i",{class:"sw",style:"background:var(--ok)"}),"已掌握"),
    el("span",{}, el("i",{class:"sw",style:"background:var(--warn)"}),"最近一次答錯（已訂正過）"),
    el("span",{}, el("i",{class:"sw",style:"background:var(--bad)"}),"待訂正"),
    el("span",{}, el("i",{class:"sw",style:"background:var(--sunk);border:1px solid var(--line)"}),"未作答"));
  const chs = el("section",{class:"chapters"}, CHS.map(ch => {
    const s = stat(ch);
    const mapBox = el("div",{class:"grid", hidden:true});
    const card = el("article",{class:"ch"},
      el("div",{class:"ch-head"},
        el("div",{}, el("h3",{text:`${CL(ch)} ${ZH[ch]}`}), el("div",{class:"ch-en",text:QB[ch].title})),
        el("span",{class:"num small"}, `${s.done}/${s.total}`, el("span",{class:"muted",text:` · ${(s.done/s.total*100).toFixed(0)}%`}))),
      bar(s),
      el("div",{class:"small muted num", text:`已掌握 ${s.mastered} · 待訂正 ${s.pending} · 正確率 ${s.acc==null?"—":Math.round(s.acc*100)+"%"}`}),
      el("div",{class:"actions"},
        el("button",{class:"primary", onclick:()=>{ if (!s.done && !seenReview(ch)) renderReview(ch); else startQuiz(pick(ch,"new"),"new",`${CL(ch)} 新題優先`); }, text: s.done < s.total ? "新題 20 題" : "弱點 20 題"}),
        el("button",{onclick:()=>renderReview(ch), text:"重點複習"}),
        el("button",{onclick:()=>startQuiz(pick(ch,"random"),"random",`${CL(ch)} 隨機`), text:"隨機 20 題"}),
        el("button",{disabled: !s.pending || null, onclick:()=>startQuiz(pick(ch,"fix"),"fix",`${CL(ch)} 訂正`)}, `訂正 ${s.pending}`),
        el("button",{class:"ghost", onclick:(e)=>{ if (mapBox.hidden){ fillMap(ch,mapBox); mapBox.hidden=false; e.target.textContent="收起題目地圖"; } else { mapBox.hidden=true; e.target.textContent="題目地圖"; } }, text:"題目地圖"})),
      mapBox);
    return card;
  }));
  const pendAll = T.pending;
  const tools = el("section",{class:"actions"},
    el("button",{class:"primary", disabled: !pendAll || null, onclick:()=>startQuiz(pickAllFix(),"fix","全章訂正")}, `全部章節錯題訂正（${Math.min(pendAll,PER)} 題）`),
    el("button",{disabled: !pendAll || null, onclick:renderBook, text:"打開訂正本"}));
  const hist = el("section",{class:"panel"}, el("h2",{text:"最近作答"}),
    histList.length ? el("div",{class:"hist"}, histList.slice(0,8).map(h => el("div",{}, el("span",{text:h.label}), el("span",{class:"num muted",text:`${h.right}/${h.total} · ${fmtTime(h.ts)}`})))) : el("div",{class:"empty",text:"還沒有作答紀錄。挑一章按「新題 20 題」開始，完成後成績會記在這裡。"}));
  $("#view").replaceChildren(el("div",{class:"wrap",style:"padding:0"}, summary, legend, tools, chs, hist, changelogBox()));
}
const CHANGELOG = [
  ["2026-11-01","v8","新增「補充 Ch11 老師上課補充教材」：依翁銘章老師的 13 版第 11 章簡報出 20 題（附中文解析與重點複習）。"],
  ["2026-10-30","v7","重點複習的關鍵名詞全部附上英文原文（和題目用詞一致）；首頁新增「更新紀錄」。"],
  ["2026-10-30","v6","每章新增「重點複習」，第一次練習該章時會先顯示。"],
  ["2026-10-30","v5","觀念相同的題目只保留一題，整理出核心 321 題（預設模式）。"],
  ["2026-10-30","v4","刪除重複題（同題型換數字、同題幹換選項），新增「核心／全部」切換。"],
  ["2026-10-28","v3","942 題中文解析全部寫好；推出離線版，可匯出／匯入答題紀錄。"],
  ["2026-10-28","v2","題目與選項標出重點名詞並附中文；新增「全英文／附重點翻譯」切換。"],
  ["2026-10-28","v1","題庫上線：Ch1–3、Ch9–11 共 942 題，一次 20 題，章節完成度、題目地圖、訂正本。"],
];
function changelogBox(){
  const [d0,v0,t0] = CHANGELOG[0];
  return el("details",{class:"panel changelog"},
    el("summary",{}, el("span",{class:"label",text:"更新紀錄"}), el("span",{class:"small"}, el("b",{text:`${v0} · ${d0}　`}), t0)),
    el("ol",{class:"cl"}, CHANGELOG.map(([d,v,t]) => el("li",{}, el("span",{class:"num cl-v",text:v}), el("span",{class:"num muted small cl-d",text:d}), el("span",{text:t})))));
}
const REVIEW = JSON.parse(document.getElementById("review").textContent);
function seenReview(ch){ try { return !!localStorage.getItem("qb-rv-"+ch); } catch { return false; } }
function richText(s){
  const frag = document.createDocumentFragment();
  s.split(/(\*\*[^*]+\*\*|\{\{[^}]+\}\})/).forEach(part => {
    if (part.startsWith("**") && part.endsWith("**")) frag.append(el("strong",{text:part.slice(2,-2)}));
    else if (part.startsWith("{{") && part.endsWith("}}")) frag.append(el("span",{class:"rv-en",lang:"en",text:part.slice(2,-2)}));
    else if (part) frag.append(part);
  });
  return frag;
}
function renderReview(ch){
  rerender = () => { const y = window.scrollY; renderReview(ch); window.scrollTo(0,y); };
  try { localStorage.setItem("qb-rv-"+ch, "1"); } catch {}
  const s = stat(ch);
  const go = () => startQuiz(pick(ch,"new"),"new",`${CL(ch)} 新題優先`);
  $("#view").replaceChildren(el("div",{class:"wrap",style:"padding:0"},
    el("div",{class:"actions"}, el("button",{class:"ghost", onclick:renderHome, text:"← 回章節總覽"})),
    el("div",{}, el("span",{class:"label",text:`${CL(ch)} · 重點複習`}), el("h2",{text:`${CL(ch)} ${ZH[ch]}`}), el("div",{class:"ch-en",text:QB[ch].title})),
    REVIEW[ch].map((sec,i) => el("section",{class:"rv"},
      el("h3",{}, el("span",{class:"rv-n num",text:String(i+1).padStart(2,"0")}), sec.h),
      el("ul",{}, sec.items.map(x => el("li",{}, richText(x)))))),
    el("section",{class:"panel"},
      el("div",{text:`複習完了？這章${poolMode==="key"?"核心題":""}共 ${s.total} 題，已作答 ${s.done} 題。`}),
      el("div",{class:"actions"},
        el("button",{class:"primary", onclick:go, text: s.done < s.total ? "開始練習 20 題" : "弱點 20 題"}),
        el("button",{class:"ghost", onclick:renderHome, text:"回章節總覽"})))
  ));
  window.scrollTo(0,0);
}
function fillMap(ch, box){
  box.replaceChildren(...pool(ch).map(n => Q(ch,n)).map(q => {
    const st = cellState(ch,q.n);
    return el("button",{class:"cell "+st, title:`Q${q.n}`, "aria-label":`第 ${q.n} 題`, text:q.n, onclick:()=>startQuiz([{ch,n:q.n}],"single",`${CL(ch)} 單題`)});
  }));
}
function renderBook(){
  rerender = () => { const y = window.scrollY; renderBook(); window.scrollTo(0,y); };
  const groups = CHS.map(ch => ({ch, ns: QB[ch].qs.filter(q=>cellState(ch,q.n)==="p").map(q=>q.n)})).filter(g=>g.ns.length);
  $("#view").replaceChildren(el("div",{class:"wrap",style:"padding:0"},
    el("div",{class:"actions"}, el("button",{class:"ghost", onclick:renderHome, text:"← 回章節總覽"})),
    el("h2",{text:"訂正本"}),
    el("p",{class:"muted small",style:"margin:0",text:"答錯且還沒答對的題目都在這裡。重新答對一次就算訂正完成，會從訂正本移除。"}),
    groups.length ? groups.map(g => el("section",{class:"sheet"},
      el("div",{class:"ch-head"}, el("h3",{text:`${CL(g.ch)} ${ZH[g.ch]}`}), el("button",{onclick:()=>startQuiz(pick(g.ch,"fix"),"fix",`${CL(g.ch)} 訂正`)}, `訂正這章 ${Math.min(g.ns.length,PER)} 題`)),
      g.ns.map(n => wrongItem(g.ch,n,null,true)))) : el("div",{class:"empty",text:"訂正本是空的。"})
  ));
  window.scrollTo(0,0);
}

/* ---------- boot ---------- */
function flash(t){ const m=$("#msg"); m.textContent=t; m.hidden=false; clearTimeout(flash.t); flash.t=setTimeout(()=>{m.hidden=true;},6000); }
function exportRecords(){
  const data = { app:"mishkin-qb", v:1, exported: Date.now(), rec, hist: histList, lang };
  const blob = new Blob([JSON.stringify(data)], {type:"application/json"});
  const a = document.createElement("a"); const d = new Date();
  a.href = URL.createObjectURL(blob); a.download = `貨銀題庫紀錄-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}.json`;
  document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  flash("已匯出紀錄檔。到另一台裝置打開這個網頁，按「匯入紀錄」選這個檔案就能接著寫。");
}
function importRecords(file){
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (d.app !== "mishkin-qb" || !d.rec) throw 0;
      CHS.forEach(c => rec[c] = d.rec[c] || {});
      histList = Array.isArray(d.hist) ? d.hist : [];
      lsSet("qb-rec", rec); lsSet("qb-hist", histList);
      quiz = null; renderHome(); flash("已匯入紀錄，章節完成度與訂正本都更新了。");
    } catch { flash("這個檔案不是題庫的紀錄檔，請選「匯出紀錄」產生的 .json 檔。"); }
  };
  r.readAsText(file);
}
async function boot(){
  $("#lang-en").addEventListener("click", () => setLang("en", true));
  $("#lang-zh").addEventListener("click", () => setLang("zh", true));
  $("#pool-key").addEventListener("click", () => setPool("key", true));
  $("#pool-all").addEventListener("click", () => setPool("all", true));
  $("#pool-key").textContent = `核心 ${CHS.reduce((s,c)=>s+KEEP[c].length,0)} 題`;
  $("#pool-all").textContent = `全部 ${CHS.reduce((s,c)=>s+QB[c].qs.length,0)} 題`;
  setPool(poolMode, false);
  $("#exp-btn").addEventListener("click", exportRecords);
  $("#imp-btn").addEventListener("click", () => $("#imp-file").click());
  $("#imp-file").addEventListener("change", e => { const f = e.target.files[0]; if (f) importRecords(f); e.target.value = ""; });
  await loadAll();
  setLang(lang, false);
}
boot();
</script>
