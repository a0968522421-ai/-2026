<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>貨銀題庫練習</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>
/* Layout: single study column; chapter ledger on home, one question per screen in quiz, answer sheet on results */
:root{
  --bg:#F1F4F2;--surface:#FFFFFF;--sunk:#E7ECE9;--ink:#17201C;--muted:#5C6963;--line:#D5DDD8;
  --accent:#1E5A7A;--accent-ink:#FFFFFF;--accent-soft:#DCE9F0;
  --ok:#2E7A4D;--ok-soft:#DDEFE3;--bad:#B0412D;--bad-soft:#F6E0DA;--warn:#A9781F;--warn-soft:#F4E9D2;
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1412;--surface:#18201C;--sunk:#212A26;--ink:#E4EBE7;--muted:#97A69F;--line:#2C3732;
  --accent:#73B4D6;--accent-ink:#0C1A22;--accent-soft:#1D3340;
  --ok:#62B985;--ok-soft:#1C3326;--bad:#E58069;--bad-soft:#3A221C;--warn:#DDAA4E;--warn-soft:#352B17;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1412;--surface:#18201C;--sunk:#212A26;--ink:#E4EBE7;--muted:#97A69F;--line:#2C3732;
  --accent:#73B4D6;--accent-ink:#0C1A22;--accent-soft:#1D3340;
  --ok:#62B985;--ok-soft:#1C3326;--bad:#E58069;--bad-soft:#3A221C;--warn:#DDAA4E;--warn-soft:#352B17;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.65 var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 48px;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:1.65rem}h2{font-size:1.2rem}h3{font-size:1.02rem}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.label{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-family:var(--f-mono)}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;min-height:40px}
button:hover:not(:disabled){border-color:var(--accent)}
button:focus-visible,.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:6px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.acct{display:flex;align-items:center;gap:8px;font-size:.82rem;padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);min-width:0;max-width:100%}
.backup{display:flex;gap:4px}
.backup .ghost{min-height:32px;font-size:.84rem}
.acct b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.on{background:var(--ok)}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.summary>div{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.summary .num{font-size:1.4rem;font-weight:600}
@media (max-width:560px){.summary{grid-template-columns:repeat(2,1fr)}}
.chapters{display:flex;flex-direction:column;gap:12px}
.ch{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px}
.ch-head{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.ch-head>div{min-width:0}
.ch-en{font-size:.8rem;color:var(--muted)}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--sunk)}
.bar i{display:block;height:100%}
.bar .m{background:var(--ok)}.bar .p{background:var(--bad)}.bar .r{background:var(--warn)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:2px;display:inline-block}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(22px,1fr));gap:3px}
.cell{aspect-ratio:1;border-radius:3px;background:var(--sunk);font:600 .58rem/1 var(--f-mono);display:flex;align-items:center;justify-content:center;color:var(--muted);border:0;padding:0;min-height:0}
.cell.m{background:var(--ok);color:var(--surface)}.cell.p{background:var(--bad);color:var(--surface)}.cell.r{background:var(--warn);color:var(--surface)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:14px}
.qmeta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.progress{height:4px;background:var(--sunk);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .25s}
.stem{white-space:pre-line;font-size:1.06rem;line-height:1.7}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;text-align:left;align-items:flex-start;padding:10px 12px;line-height:1.55;width:100%}
.opt .k{font-family:var(--f-mono);font-weight:600;color:var(--muted);flex:none}
.opt:disabled{opacity:1;cursor:default}
.opt:disabled:not(.right):not(.wrong){color:var(--muted)}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.right .k{color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt.wrong .k{color:var(--bad)}
.verdict{font-weight:700}
.verdict.ok{color:var(--ok)}.verdict.no{color:var(--bad)}
.exp{border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:0 8px 8px 0;white-space:pre-wrap;font-size:.94rem;line-height:1.75}
.exp .label{display:block;margin-bottom:4px;color:var(--accent)}
.score{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.score .big{font:600 2.6rem/1 var(--f-mono)}
.sheet{display:flex;flex-direction:column;gap:12px}
.item{border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.item .ans{font-size:.88rem}
.tag{display:inline-block;font:600 .72rem/1.6 var(--f-mono);padding:0 7px;border-radius:4px;background:var(--sunk);color:var(--muted)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}.tag.ok{background:var(--ok-soft);color:var(--ok)}
.hist{display:flex;flex-direction:column}
.hist div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:.86rem}
.hist div:last-child{border-bottom:0}
.notice{font-size:.84rem;padding:10px 12px;border-radius:8px;background:var(--warn-soft);color:var(--ink)}
.empty{color:var(--muted);font-size:.9rem;padding:8px 0}
.top-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px;min-width:0;max-width:100%}
@media (max-width:560px){.top-right{align-items:flex-start}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;border-radius:0;min-height:34px;padding:4px 12px;font-size:.84rem;background:transparent;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.term{text-decoration:underline dotted var(--accent);text-underline-offset:3px;text-decoration-thickness:1.5px}
.gloss{font-size:.78em;color:var(--accent);margin-left:2px;white-space:nowrap}
.gloss::before{content:"〔"}.gloss::after{content:"〕"}
.opt.right .gloss,.opt.wrong .gloss{color:inherit;opacity:.8}
.terms{background:var(--sunk);border-radius:8px;padding:10px 14px;display:flex;flex-direction:column;gap:6px}
.terms dl{margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px 18px}
.terms dl>div{min-width:0}
.terms dt{display:flex;flex-wrap:wrap;gap:0 8px;align-items:baseline}
.terms .en{font-family:var(--f-mono);font-size:.82rem;font-weight:600}
.terms .zh{font-weight:700;color:var(--accent)}
.terms dd{margin:0;font-size:.84rem;color:var(--muted);line-height:1.55}
.rv{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.rv h3{display:flex;align-items:baseline;gap:10px}
.rv-n{font-size:.78rem;color:var(--accent);font-weight:600}
.rv ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:8px}
.rv li{line-height:1.75;max-width:68ch}
.rv li::marker{color:var(--muted)}
.rv strong{color:var(--accent);font-weight:700}
.rv-en{font-family:var(--f-mono);font-size:.82em;color:var(--muted);margin:0 3px;white-space:normal}
.rv-en::before{content:"("}.rv-en::after{content:")"}
.changelog summary{cursor:pointer;display:flex;flex-direction:column;gap:4px;list-style-position:outside}
.cl{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.cl li{display:grid;grid-template-columns:auto auto 1fr;gap:4px 10px;align-items:baseline;font-size:.88rem;line-height:1.6}
.cl-v{font-weight:600;color:var(--accent)}
@media (max-width:520px){.cl li{grid-template-columns:auto 1fr}.cl li>span:last-child{grid-column:1/-1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>

<div class="wrap" id="app">
  <header class="top">
    <div>
      <div class="label">Mishkin 7e · Test Bank</div>
      <h1>貨幣銀行學題庫練習</h1>
    </div>
    <div class="top-right">
      <div class="acct" id="acct"><span class="dot on"></span><b>紀錄存在這台裝置</b></div>
      <div class="backup">
        <button type="button" class="ghost" id="exp-btn">匯出紀錄</button>
        <button type="button" class="ghost" id="imp-btn">匯入紀錄</button>
        <input type="file" id="imp-file" accept=".json,application/json" hidden>
      </div>
      <div class="seg" role="group" aria-label="題目顯示語言">
        <button id="lang-en" type="button" aria-pressed="false">全英文</button>
        <button id="lang-zh" type="button" aria-pressed="true">附重點翻譯</button>
      </div>
      <div class="seg" role="group" aria-label="題目範圍">
        <button id="pool-key" type="button" aria-pressed="true">核心題</button>
        <button id="pool-all" type="button" aria-pressed="false">全部題</button>
      </div>
    </div>
  </header>
  <div class="notice" id="msg" hidden></div>
  <main id="view"></main>
</div>

r time.","Congress encouraged, and thrift regulators acceded to, a policy of regulatory forbearance.","of all of the above.","of only (a) and (b) of the above."],"a":3},{"n":105,"q":"The bailout of the savings and loan industry was much delayed and, therefore, much more costly to taxpayers because","o":["of regulators’ initial attempts to downplay the seriousness of problems within the thrift industry.","politicians who received generous campaign contributions from the savings and loan industry, like regulators, hoped that the problems in the industry would ease over time.","Congress did not wait long enough for many of the problems in the thrift industry to correct themselves.","of all of the above.","of only (a) and (b) of the above."],"a":4},{"n":106,"q":"Prior to August 1989, the agency that regulated the nation’s savings and loan associations was the","o":["Federal Home Loan Bank Board.","Office of Thrift Supervision.","Resolution Trust Corporation.","Comptroller of the Currency."],"a":0},{"n":107,"q":"The Federal Home Loan Bank Board and the FSLIC, both of which failed in their regulatory tasks, were abolished by the","o":["Competitive Equality Banking Act of 1987.","Financial Institutions Reform, Recovery and Enforcement Act of 1989.","Office of Thrift Supervision.","Office of the Comptroller of the Currency."],"a":1},{"n":108,"q":"The major provisions of the Financial Institutions Reform, Recovery and Enforcement Act of 1989 include","o":["the abolishment of the Federal Home Loan Bank Board and the FSLIC.","transferring the regulatory role of the Federal Home Loan Bank Board to the Office of Thrift Supervision, a bureau within the U.S. Treasury Department.","expanding the responsibilities of the FDIC, which is now the sole administrator of the federal deposit insurance system.","all of the above.","only (a) and (b) of the above."],"a":3},{"n":109,"q":"The major provisions of the Financial Institutions Reform, Recovery and Enforcement Act of 1989 include","o":["the abolishment of the Federal Home Loan Bank Board and the FSLIC.","transferring the regulatory role of the Federal Home Loan Bank Board to the Office of Thrift Supervision, a bureau within the U.S. Treasury Department.","the establishment of the Resolution Trust Corporation to manage and resolve insolvent thrifts placed in conservatorship or receivership.","all of the above.","only (a) and (b) of the above."],"a":3},{"n":110,"q":"The major provisions of the Financial Institutions Reform, Recovery and Enforcement Act of 1989 include","o":["transferring the regulatory role of the Federal Home Loan Bank Board to the Office of Thrift Supervision, a bureau within the U.S. Treasury Department.","expanding the responsibilities of the FDIC, which is now the sole administrator of the federal deposit insurance system.","the establishment of the Resolution Trust Corporation to manage and resolve insolvent thrifts placed in conservatorship or receivership.","all of the above.","only (a) and (b) of the above."],"a":3},{"n":111,"q":"The major provisions of the Financial Institutions Reform, Recovery and Enforcement Act of 1989 include","o":["expanding the responsibilities of the FDIC, which is now the sole administrator of the federal deposit insurance system.","the establishment of the Resolution Trust Corporation to manage and resolve insolvent thrifts placed in conservatorship or receivership.","directing the Federal Home Loan Bank Board to continue to pursue regulatory forbearance.","all of the above.","only (a) and (b) of the above."],"a":4},{"n":112,"q":"The major provisions of the Financial Institutions Reform, Recovery and Enforcement Act of 1989 include","o":["reducing the regulatory responsibilities of the FDIC.","the establishment of the Resolution Trust Corporation to manage and resolve insolvent thrifts placed in conservatorship or receivership.","directing the Federal Home Loan Bank Board to continue to pursue regulatory forbearance.","all of the above.","only (a) and (b) of the above."],"a":1},{"n":113,"q":"The 1989 Financial Institutions Reform, Recovery and Enforcement Act","o":["transferred the regulatory role of the Office of Thrift Supervision to the Federal Home Loan Bank Board.","significantly reduced the responsibilities of the FDIC, which no longer administers the federal deposit insurance system.","established the Resolution Trust Corporation to manage and resolve insolvent thrifts placed into conservatorship or receivership.","all of the above.","both (a) and (b) of the above."],"a":2},{"n":114,"q":"Many economists are mildly critical of FIRREA because","o":["it reduces the efficiency of financial intermediation in the United States.","it does little to deal with the underlying adverse selection and moral hazard problems created by deposit insurance.","it significantly reduces the powers of thrift regulators and makes it more difficult to remove incompetent thrift managers.","of all of the above.","of only (a) and (b) of the above."],"a":1},{"n":115,"q":"The Federal Deposit Insurance Corporation Improvement Act of 1991","o":["increased the FDIC’s ability to borrow from the Treasury to deal with failed banks.","reduced the scope of deposit insurance in several ways.","eliminated governmentally-administered deposit insurance.","did only (a) and (b) of the above."],"a":3},{"n":116,"q":"The Federal Deposit Insurance Corporation Improvement Act of 1991","o":["reduced the scope of deposit insurance in several ways.","eliminated restrictions on nationwide banking.","allowed well-capitalized banks to have to do some securities underwriting.","did only (a) and (b) of the above.","did only (a) and (c) of the above."],"a":4},{"n":117,"q":"The Federal Deposit Insurance Corporation Improvement Act of 1991","o":["reduced the scope of deposit insurance in several ways.","limited the FDIC’s ability to use the “too-big-to-fail” policy.","requires the FDIC to intervene earlier when a bank gets into trouble.","did all of the above."],"a":3},{"n":118,"q":"The Federal Deposit Insurance Corporation Improvement Act of 1991","o":["instructed the FDIC to come up with risk-based deposit insurance premiums.","expanded the FDIC’s ability to use the “too-big-to-fail” policy.","instructed the FDIC to wait longer before intervening when a bank gets into trouble.","did all of the above."],"a":0},{"n":119,"q":"An examination of banking crises in the Scandinavian countries Norway, Sweden, and Finland indicates that, as in the U.S., an important factor in the crises was the","o":["decline in real interest rates that occurred in the 1980s.","financial liberalization that occurred in the 1980s.","high inflation that occurred in the 1980s.","sluggish economic growth that occurred in the 1980s."],"a":1},{"n":120,"q":"As in the United States, an important factor in the banking crises in Norway, Sweden, and Finland was the","o":["financial liberalization that occurred in the 1980s.","decline in real interest rates that occurred in the 1980s.","high inflation that occurred in the 1980s.","sluggish economic growth that occurred in the 1980s."],"a":0},{"n":121,"q":"As in the United States, an important factor in the banking crises in Latin America was the","o":["financial liberalization that occurred in the 1980s.","decline in real interest rates that occurred in the 1980s.","high inflation that occurred in the 1980s.","sluggish economic growth that occurred in the 1980s."],"a":0},{"n":122,"q":"When comparing the banking crisis in the United States to the crises in Mexico and Venezuela, the cost to the taxpayers of the government bailouts was","o":["higher in Mexico and the United States than in Venezuela.","higher in Mexico and Venezuela than in the United States.","higher in Venezuela and the United States than in Mexico.","higher in the United States than in Mexico and Venezuela."],"a":1},{"n":123,"q":"In the recent banking crises in Venezuela, the cost to the taxpayers of the government bailouts could exceed ______ percent of GDP.","o":["50","30","10","5"],"a":0},{"n":124,"q":"Common to all the recent banking crises in the United States, Scandinavia, Latin America, Japan, Russia, and Eastern Europe was the","o":["the financial liberalization that occurred in the 1980s.","the banks’ lack of expertise in screening borrowers and monitoring loans.","the regulators’ lack of expertise in monitoring banking activities.","all of the above.","only (a) and (b) of the above."],"a":3},{"n":125,"q":"The evidence from banking crises in other countries indicates that","o":["deposit insurance is to blame in each country.","a government safety net for depositors need not increase moral hazard.","expertise in screening borrowers cannot prevent loan losses.","deregulation combined with poor regulatory supervision raises moral hazard incentives.","regulatory forbearance never leads to problems."],"a":3},{"n":126,"q":"A system of coinsurance would","o":["eliminate deposit insurance.","reduce deposit insurance to $40,000.","Increase deposit insurance to $130,000.","provide 100% deposit insurance for all deposits.","limit deposit insurance to only a percentage of a deposit."],"a":4},{"n":127,"q":"Eliminating or reducing deposit insurance may fail to provide the desired discipline because","o":["depositors may be incapable of monitoring banks.","banks would be subject to runs and a large number of failures.","such an action increases banks’ incentives to assume high risk.","all of the above.","both (a) and (b) of the above."],"a":4},{"n":128,"q":"Big banks are not subject to enough discipline from uninsured depositors because of","o":["regulatory forbearance.","bureaucratic gambling.","the too-big-to-fail policy.","the principal-agent problem.","prudential supervision."],"a":2},{"n":129,"q":"Risk-based deposit insurance premiums","o":["reduce moral hazard incentives.","encourage banks to hold more capital.","reduce the adverse selection problem for regulators.","all of the above.","both (a) and (b) of the above."],"a":4},{"n":130,"q":"Market-value accounting has a number of advantages over historical-cost accounting, including","o":["giving regulators the ability to close a bank before its net worth falls to zero.","reducing the incidence in the number of banks that “bet-the-bank” by taking excessive risks in hopes of staying in operation.","making it more difficult for bank officials to hide insolvencies.","making it more difficult for regulators and politicians to hide insolvencies.","all of the above"],"a":4}]},"S11":{"title":"Supplement: Banking Industry — Structure and Competition (Mishkin 13e, Ch. 11)","qs":[{"n":1,"q":"After President Andrew Jackson vetoed the recharter of the Second Bank of the United States in 1832, which best describes what followed?","o":["The Federal Reserve was created immediately to replace it as the lender of last resort.","The FDIC was founded to stop the resulting bank panics.","The U.S. went almost 30 years without a central bank, a period of loosely regulated state banks known as the wildcat banking era.","National banks issuing a uniform national currency were created right away under the OCC."],"a":2},{"n":2,"q":"Which statement correctly compares an Edge Act corporation with an international banking facility (IBF)?","o":["An Edge Act corporation may lend only to U.S. residents, while an IBF may lend only to U.S. corporations.","Both are offshore branches located in London that accept deposits from U.S. residents.","An IBF must hold reserves on its deposits, while an Edge Act corporation is exempt from all U.S. regulation.","An Edge Act corporation is a special U.S. subsidiary that can do international banking across state lines; an IBF is a set of books inside the U.S. that may accept time deposits only from foreigners and is exempt from reserve requirements."],"a":3},{"n":3,"q":"In 1987 the Federal Reserve used the 'Section 20 loophole' in the Glass-Steagall Act. What did this allow?","o":["Banks could open branches in other states.","Bank holding companies could set up subsidiaries to underwrite certain securities, as long as that business stayed below a revenue cap (first 10%, later 25%).","Investment banks could accept FDIC-insured deposits.","Commercial banks themselves could take deposits and underwrite any security without limit."],"a":1},{"n":4,"q":"Which of the following describe the Federal Reserve Act of 1913?\n(a) It created the Fed to act as a lender of last resort.\n(b) It required all national banks to become members of the Federal Reserve System.\n(c) It required all state banks to become members of the Federal Reserve System.","o":["(a) only","(a) and (b) only","(a) and (c) only","(a), (b) and (c)"],"a":1},{"n":5,"q":"The Banking Act of 1933 (Glass-Steagall) responded to the failure of more than 9,000 banks during 1930–1933. Which of the following were part of it?\n(a) Creation of the FDIC\n(b) Separation of commercial banking from investment banking\n(c) Authority for the Fed to set ceilings on deposit interest rates (Regulation Q)","o":["(a) only","(a) and (b) only","(b) and (c) only","(a), (b) and (c)"],"a":3},{"n":6,"q":"A state-chartered bank has FDIC deposit insurance but is NOT a member of the Federal Reserve System. Who is primarily responsible for supervising it?","o":["The Federal Reserve together with the OCC","The Office of the Comptroller of the Currency (OCC) alone","The FDIC together with the state banking authorities","Only the state banking authorities, with no federal supervisor"],"a":2},{"n":7,"q":"When the three-month Treasury bill rate swung between 5% and over 15% in the 1970s–1980s, many S&Ls began offering adjustable-rate mortgages (ARMs). How did ARMs affect the lenders?","o":["Beneficial to lenders, because their loan income now rises when market interest rates rise, reducing the interest-rate risk of borrowing short and lending long.","No effect on lenders, because only homeowners bear interest-rate changes under any mortgage.","Beneficial to lenders, because ARMs eliminate default risk.","Harmful to lenders, because ARMs lock in a fixed interest rate for 30 years."],"a":0},{"n":8,"q":"Under the 'originate-to-distribute' business model of securitization that grew before the 2007–2009 financial crisis, why did lending standards for subprime mortgages fall?","o":["Because investment banks were required by law to buy every mortgage originated.","Because FICO credit scores were banned, so lenders could not measure risk.","Because mortgage rates were capped by Regulation Q.","Because the mortgage originator sold the loan off and did not bear the default risk, creating a moral hazard problem."],"a":3},{"n":9,"q":"A bank holds $1,000,000 of checkable deposits. The required reserve ratio is 10% and the market interest rate is 5%. Reserves earn no interest. How large are the required reserves, and what is the bank's annual 'implicit tax' from the reserve requirement?","o":["$50,000 of reserves; implicit tax of $5,000 per year","$100,000 of reserves; implicit tax of $5,000 per year","$10,000 of reserves; implicit tax of $500 per year","$100,000 of reserves; implicit tax of $50,000 per year"],"a":1},{"n":10,"q":"Why did banks develop sweep accounts for their business customers?","o":["To meet higher reserve requirements on corporate deposits.","To comply with a regulation requiring businesses to hold savings accounts.","Because funds above a set amount are swept each night into overnight interest-bearing securities, which are not subject to reserve requirements, so banks avoid the implicit tax and effectively pay interest to businesses.","To make it easier for the Fed to measure M1."],"a":2},{"n":11,"q":"In September 2008 the Reserve Primary Fund, a money market mutual fund, 'broke the buck.' Which description is correct?","o":["Its share value fell below $1 (to 97 cents) because it held Lehman Brothers commercial paper that became worthless; this set off a run on money market funds that was stopped by a Fed liquidity facility and a temporary Treasury guarantee.","It failed because Regulation Q capped the interest it could pay.","Its share value rose above $1 because it held only Treasury bills, causing investors to rush in.","It was protected by FDIC deposit insurance, so no investor lost money and no run occurred."],"a":0},{"n":12,"q":"According to Mishkin (13th ed.), how did commercial banks' share of total nonfinancial borrowing change, and how did checkable deposits' share of bank liabilities change?","o":["Share of borrowing: from about 20% to over 40%; checkable deposits: from about 14% to over 60%","Share of borrowing: from over 40% to about 30%; checkable deposits: from over 60% to about 50%","Share of borrowing: from over 60% to about 14%; checkable deposits: from over 40% to about 20%","Share of borrowing: from over 40% (1974) to about 20% (2020); checkable deposits: from over 60% (1960s) to about 14% today"],"a":3},{"n":13,"q":"As traditional banking declined, how did banks try to maintain their profits?\n(a) By making riskier loans such as commercial real estate loans and financing for leveraged buyouts (LBOs)\n(b) By expanding off-balance-sheet activities that earn fee income, such as underwriting, advisory services and derivatives\n(c) By lowering the interest rates they pay on deposits back to the old Regulation Q ceilings","o":["(a) only","(b) only","(a) and (b) only","(a), (b) and (c)"],"a":2},{"n":14,"q":"Based on FDIC data for March 2020, which statement best describes the structure of the U.S. commercial banking industry?","o":["A few hundred banks exist, as in Japan and Europe, because branching has always been unrestricted.","It is bimodal: banks with under $1 billion in assets are about 84% of all banks but hold only about 7% of assets, while 13 banks with over $250 billion hold about half of all assets.","Banks are evenly distributed across size classes, each holding about a quarter of assets.","Small community banks hold the majority of banking assets."],"a":1},{"n":15,"q":"How did shared ATM networks (such as Cirrus or NYCE) help banks get around branching restrictions?","o":["Courts ruled that ATMs owned by a third party or rented on a per-transaction basis are not branches, so banks could reach customers across geographic borders.","ATMs were classified as bank holding companies.","ATMs allowed banks to avoid deposit insurance premiums.","Federal law required every state to treat ATMs as full branches."],"a":0},{"n":16,"q":"Superregional banks, such as Bank of America in Charlotte, North Carolina, and Banc One in Ohio, grew up outside the traditional money centers. What made this possible?","o":["The Glass-Steagall Act required banks to merge with securities firms.","The FDIC forced failed money center banks to move their headquarters.","Regional reciprocal compacts, starting with Maine (1975) and Massachusetts (1982), allowed out-of-state bank holding companies to acquire banks in their states.","The McFadden Act of 1927 required large banks to locate outside New York."],"a":2},{"n":17,"q":"From 1934 to 2019, how did the number of U.S. commercial banks change, and what was the main cause of the decline?","o":["About 15,000 falling to about 8,500, mainly because of new chartering restrictions","About 14,000 until the mid-1980s, falling below 5,000 by 2019, mainly because of mergers and acquisitions rather than bank failures","About 14,000 until the mid-1980s, falling below 5,000 by 2019, mainly because of bank failures","About 5,000 rising to 14,000, mainly because of the Riegle-Neal Act"],"a":1},{"n":18,"q":"What is most economists' overall assessment of the move toward nationwide banking?","o":["Favorable, because it raises efficiency through economies of scale and scope and diversifies loan portfolios across regions, while community banks have survived in states such as New York and California that liberalized earlier.","Unfavorable, because community banks disappeared completely after New York and California liberalized branching.","Neutral, because consolidation has no effect on efficiency or risk.","Unfavorable, because geographic diversification makes regional bank failures more likely."],"a":0},{"n":19,"q":"Under the 'functional regulation' set up by the Gramm-Leach-Bliley Act of 1999, which pairing of regulators is correct?","o":["Banking subsidiary: SEC; insurance subsidiary: Federal Reserve","Securities subsidiary: Federal Reserve; financial holding company: SEC","Insurance subsidiary: FDIC; securities subsidiary: OCC","Insurance subsidiary: state insurance commissions; financial holding company as a whole: Federal Reserve (umbrella supervision)"],"a":3},{"n":20,"q":"During the 2008 financial crisis, what happened to the five largest independent investment banks? Choose the correct pairing for Bear Stearns and Goldman Sachs.","o":["Bear Stearns: converted into a bank holding company; Goldman Sachs: declared bankruptcy","Bear Stearns: declared bankruptcy; Goldman Sachs: acquired by Bank of America","Bear Stearns: acquired by JPMorgan Chase with Fed assistance; Goldman Sachs: converted into a bank holding company to gain access to FDIC-insured deposits and Fed supervision","Bear Stearns: acquired by Bank of America; Goldman Sachs: acquired by JPMorgan Chase"],"a":2}]}}</script>
