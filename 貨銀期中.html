<script type="application/json" id="exp">{"1-1":"題意：金融市場與機構的影響範圍。正解：以上皆是，它們牽動龐大資金流動、影響企業利潤，也影響經濟生產哪些商品與勞務。","1-2":"題意：同上，但把「企業利潤」換成「企業所在地」。正解：只有 (a)(c)。金融市場移動大量資金並影響生產內容，但課本沒有說它決定企業設在哪裡。","1-3":"題意：美國的貨幣與金融體系會影響什麼？正解：以上皆是。美國金融情勢會波及他國經濟、影響生產內容，連選舉結果都可能受景氣影響。","1-4":"題意：資金從有剩餘者轉到資金不足者的市場叫什麼？正解：金融市場（financial markets）。商品市場、衍生性商品市場都不是這個定義。","1-5":"題意：儲蓄者不直接買借款人的證券，而是透過他人把資金轉給借款人。正解：金融中介（financial intermediation），即間接融資。","1-6":"題意：金融市場怎麼提升經濟效率？正解：把資金從儲蓄者導向有生產性投資機會的投資者。(a) 方向寫反了，其他選項都是負面結果。","1-7":"題意：運作良好的金融市場會促進什麼？正解：經濟成長。良好的資金配置讓好的投資計畫拿得到錢。","1-8":"題意：運作不良的金融市場可能造成什麼？正解：貧窮。資金配置失靈會拖累成長，課本以此說明部分國家貧窮的原因。","1-9":"題意：債券市場為什麼重要？正解：利率在債券市場決定。最受關注的是股市、匯率在外匯市場決定，所以 (a)(b) 錯。","1-10":"題意：同上。正解：債券市場是利率決定的地方。多數借款人的資金來自金融中介（銀行貸款），最受關注的是股市，所以其他選項錯。","1-11":"題意：借入資金的「租金」，通常以每年百分比表示。正解：利率（interest rate）。","1-12":"題意：和長期公債相比，哪種利率波動較大、平均較低？正解：三個月期國庫券。短期利率比長期利率更容易波動，且通常較低。","1-13":"題意：三個月國庫券利率相對長期公債，波動＿、平均＿？正解：波動較大；平均較低。","1-14":"題意：Baa 中等品質公司債利率平均較＿，1970 年代起利差變＿？正解：較高；變大。違約風險較高所以利率高，且利差在 70 年代後擴大。","1-15":"題意：利率下降對住宅支出的影響。正解：上升。房貸成本變低，買房意願增加。","1-16":"題意：學貸利率上升。正解：增加念大學的成本，因為借錢讀書的利息支出變多。","1-17":"題意：利率影響哪些對象？正解：以上皆是：個人（儲蓄、借款）、企業（投資）、整體經濟。","1-18":"題意：道瓊單日跌超過 500 點、跌幅 22% 的「黑色星期一」是哪一年？正解：1987 年（10 月 19 日）。","1-19":"題意：股市為什麼重要？正解：它是美國最受關注的金融市場。利率在債券市場決定，匯率在外匯市場決定。","1-20":"題意：1950 年代以來的股價走勢。正解：極度波動，有大漲也有崩盤，並非穩定趨勢。","1-21":"題意：股價指數上漲的影響。正解：(b)(c)：財富增加，可能提高消費意願；企業發行新股可以募到更多資金。(a) 說不會增加支出是錯的。","1-22":"題意：同上。正解：(a)(b) 都對，同時增加財富與支出意願、也讓企業發新股募得更多；(c) 方向相反。","1-23":"題意：同上，但沒有「企業募資增加」的正確選項。正解：只有 (b)：財富增加並可能提高消費意願。(c) 說募資減少是錯的。","1-24":"題意：股價指數下跌的影響。正解：只有 (a)：財富減少，可能降低消費意願。(b)(c) 方向都寫反。","1-25":"題意：同上。正解：(a)(c)：財富減少、消費意願可能下降；企業發新股能募到的資金也變少。","1-26":"題意：股價變動的特性。正解：以上皆是：影響財富與支出、影響企業發股融資投資的決策，而且波動很大。","1-27":"題意：擔心大衰退使股價下跌，接著消費支出會？正解：減少。股價下跌使財富縮水（財富效果），消費跟著減少。","1-28":"題意：普通股是對公司什麼的請求權？正解：盈餘與資產。股東是公司所有者，分享淨所得與資產。","1-29":"題意：2000–2002 年股價下跌的影響。正解：降低個人支出意願，因為財富縮水。","1-30":"題意：一國貨幣以另一國貨幣表示的價格。正解：匯率（exchange rate）。","1-31":"題意：美元走強（升值）時，其他不變。正解：去英國度假變便宜，因為一美元能換更多英鎊。外國商品對美國人都變便宜，所以 (a)(c)(d) 錯。","1-32":"題意：美元走強時。正解：以上皆非。美國人會買「更多」外國貨；美國出口品在國外變「貴」、外國人買得少；對美國也不一定只有好處。","1-33":"題意：美元走強最可能的結果。正解：美國出口品在國外變貴，外國人買得少。","1-34":"題意：匯率變動如何直接影響美國人？正解：以上皆是：進口品價格、出口品對外價格、美國人出國旅費、外國人來美的花費都會變。","1-35":"題意：美元走強會傷害哪些產業？正解：以上皆是。紡織、小麥、汽車都是出口產業，美元強使產品在國外變貴，出口減少。","1-36":"題意：美元走弱會傷害哪些產業？正解：以上皆非。美元弱使出口品在國外變便宜，這些出口產業反而受益。","1-37":"題意：美元走強，誰受益、誰受害？正解：美國消費者受益（進口品便宜），美國企業受害（出口變難、進口競爭變強）。","1-38":"題意：美元走弱，誰受益、誰受害？正解：美國企業受益，美國消費者受害（進口品變貴）。","1-39":"題意：1980 到 1985 年初美元升值，誰受益、誰受害？正解：美國消費者受益，美國企業受害。","1-40":"題意：1980–1985 美元＿，誰受益？正解：升值；美國消費者受益。","1-41":"題意：1980–1985 美元對英鎊升值，相較 1980 年。正解：(a)(b)：更多美國人去英國旅遊、進口更多英國毛衣。英國人買美國酒會變少，(c) 錯。","1-42":"題意：同上。正解：美國人進口更多英國毛衣。英國人來美旅遊、買加州酒都會變少。","1-43":"題意：同上，選項都是英國人買美國的東西或美國出口。正解：以上皆非，美元升值後這些都會減少。","1-44":"題意：同上。正解：到美國旅遊的英國人變少，因為對英國人來說美國變貴了。","1-45":"題意：1980 年 £1＝$2.40，£50 的毛衣要 $120；美元走強後。正解：低於 $120。一英鎊換的美元變少，同樣 £50 用更少美元就買得到。","1-46":"題意：1985 年 £1＝$1.30，£100 的毛衣要 $130；美元走弱後。正解：高於 $130。一英鎊要用更多美元換。","1-47":"題意：毛衣原本 $120，美元走強後。正解：低於 $120。","1-48":"題意：毛衣原本 $130，美元走弱後。正解：高於 $130。","1-49":"題意：美元對所有外幣貶值，美國人買外國貨的價格？正解：上升。","1-50":"題意：1 歐元從 $1.00 漲到 $1.10。正解：去歐洲度假變貴，因為要用更多美元換歐元。","1-51":"題意：愛喝法國酒的美國人最希望什麼？正解：歐元的美元價格下跌（美元相對升值），法國酒換算成美元變便宜。","1-52":"題意：賣牛肉到歐洲的美國農民最希望什麼？正解：歐元的美元價格上漲（美元貶值），美國牛肉在歐洲變便宜，賣得更多。","1-53":"題意：銀行為什麼重要？正解：以上皆是：連結儲蓄者與投資者、帶動金融創新、持有大量個人財富。","1-54":"題意：同上，但 (c) 說銀行是「唯一」重要的金融機構。正解：只有 (a)(b)。還有保險公司、基金等其他重要中介，所以 (c) 錯。","1-55":"題意：金融中介機構的特性。正解：(a)(c)：扮演中間人把儲蓄借給他人、促進經濟效率。(b) 說不產生價值是錯的。","1-56":"題意：同上，(b) 改成「持有大量個人財富」。正解：以上皆是。","1-57":"題意：銀行、儲貸協會、互助儲蓄銀行、信用合作社的特性。正解：以上皆是：連結儲蓄與投資、持有大量財富、善於因應法規變化創新。","1-58":"題意：同上。正解：只有 (c)：善於因應法規環境創新。它們仍是重要中介，也不是只服務小額存戶。","1-59":"題意：金融中介對經濟表現的影響。正解：可以改善經濟表現。(d) 寫成「向投資者借、借給儲蓄者」，方向反了。","1-60":"題意：貨幣的定義。正解：購買商品勞務或償還債務時普遍被接受的任何東西。","1-61":"題意：同上。正解：普遍被接受作為支付或還債工具的任何東西。","1-62":"題意：經濟學家為何重視貨幣？正解：以上皆是：貨幣與物價同步、與利率有關、景氣衰退前貨幣成長率會下降。","1-63":"題意：貨幣對什麼有重大影響？正解：以上皆是：通膨、景氣循環、利率。","1-64":"題意：貨幣成長率下降常導致什麼？正解：衰退。","1-65":"題意：美國與其他國家的證據顯示什麼？正解：長期而言，通膨率與貨幣成長率有強烈正相關。(c) 方向寫反，(b)(d) 和證據矛盾。","1-66":"題意：景氣持續向下的走勢叫什麼？正解：衰退（recessions）。","1-67":"題意：1900 年以來每次衰退前都會下降的是什麼？正解：貨幣存量的「成長率」，而不是貨幣存量本身。","1-68":"題意：同上。正解：貨幣存量的成長率。股市與貨幣存量本身並非每次都下降。","1-69":"題意：同上（干擾選項是裙長、太陽黑子）。正解：貨幣成長率。","1-70":"題意：同上。正解：貨幣成長率。","1-71":"題意：美國景氣循環的證據顯示什麼？正解：衰退前貨幣成長率下降。兩者是正向關係，(a) 說負向是錯的。","1-72":"題意：同上。正解：衰退前貨幣成長率下降。","1-73":"題意：貨幣供給成長率下降，之後可能出現什麼？正解：衰退。","1-74":"題意：貨幣供給成長率大幅上升，之後可能出現什麼？正解：通貨膨脹。","1-75":"題意：通貨膨脹的定義。正解：物價水準「持續」上升。(a) 是貨幣增加，不是通膨本身。","1-76":"題意：貨幣快速成長導致什麼？正解：通貨膨脹。","1-77":"題意：美國負責貨幣政策的機構。正解：聯邦準備體系（Fed）。財政部負責財政，貨幣監理署負責銀行監理。","1-78":"題意：哪些敘述正確？正解：以上皆是：貨幣的定義、通膨是物價持續上升、通膨率是物價水準的變動率。","1-79":"題意：同上。正解：只有 (b)：平均物價稱為總體物價水準。貨幣不只是 Fed 紙鈔，通膨率也不是赤字的變動率。","1-80":"題意：同上，(c) 說物價一上升就是通膨。正解：只有 (a)(b)。通膨要物價「持續」上升，所以 (c) 錯。","1-81":"題意：同上。正解：只有 (a)(b)。(c) 把總體物價水準與通膨率的關係講反了。","1-82":"題意：同上。正解：只有 (a)。平均物價是總體物價水準，不是通膨率；(c) 定義也顛倒。","1-83":"題意：同上，(a) 說通膨最高的國家貨幣成長也最高。正解：以上皆是。","1-84":"題意：同上。正解：只有 (a)。平均物價不等於通膨率；物價上升時通膨率不一定上升（物價可能以較慢速度上升）。","1-85":"題意：十年前同樣的東西便宜很多，可以推論什麼？正解：以上皆是：物價水準上升、平均通膨為正、平均貨幣成長也可能為正。","1-86":"題意：十年前同樣的東西貴很多，可以推論什麼？正解：物價水準下降。這代表通膨為負，所以 (b)(c) 不成立。","1-87":"題意：許多拉丁美洲國家高通膨的原因。正解：貨幣供給成長快速。","1-88":"題意：傅利曼名言：「通膨無論何時何地都是一種＿現象。」正解：貨幣（monetary）。","1-89":"題意：哪一句是傅利曼的原話？正解：「Inflation is always and everywhere a monetary phenomenon.」其他是改寫的干擾選項。","1-90":"題意：極高通膨國家的共同特徵。正解：貨幣供給快速成長。","1-91":"題意：預算赤字為何令人擔心？正解：以上皆是：最終可能推升通膨、使貨幣成長變快、推高利率。","1-92":"題意：同上，但 (c) 說貨幣成長變「慢」。正解：只有 (a)(b)。","1-93":"題意：預算赤字為何受貨幣當局關注？正解：以上皆是：赤字融資方式會影響貨幣政策；赤字推高利率，迫使 Fed 增加貨幣供給來壓低利率。","1-94":"題意：預算赤字為何重要？正解：可能使貨幣成長率提高。赤字不會造成銀行倒閉，也不是一定讓物價或利率下降。","1-95":"題意：預算赤字可能導致什麼？正解：金融危機。赤字會推高利率、壓低債券價格，所以 (b)(c) 錯。","1-96":"題意：1950–1980 年美國利率上升期間，同時發生什麼？正解：貨幣成長率上升。","1-97":"題意：同上。正解：以上皆是：貨幣成長率上升、赤字占 GNP 比率上升、物價持續上漲。","1-98":"題意：同上。正解：只有 (b)：赤字占 GNP 比率上升。貨幣成長是上升、物價是上升，(a)(c) 方向錯。","1-99":"題意：同上。正解：只有 (a)(b)。物價是上升不是下降，(c) 錯。","1-100":"題意：最全面的總產出衡量指標。正解：國內生產毛額（GDP）。","1-101":"題意：以當期價格計算最終商品與勞務總值。正解：名目 GDP。","1-102":"題意：以固定價格計算的 GDP。正解：實質 GDP。","1-103":"題意：t−1 到 t 期的通膨率公式。正解：πₜ＝(Pₜ − Pₜ₋₁)/Pₜ₋₁，也就是本期比上期物價的變動率，分母是上期物價。","1-104":"題意：GDP 包含哪些購買？正解：新生產的商品與勞務。股債買賣、二手車屋、古董名畫都不是當期生產，不算。","1-105":"題意：GDP 的定義。正解：一年內一國生產的所有「最終」商品與勞務的市場價值，不含中間財。","1-106":"題意：總產出 20 兆，總所得是多少？正解：20 兆。總產出必然等於總所得。","1-107":"題意：1996 年名目所得 5 萬，到 2002 年物價翻倍，要維持相同實質所得需多少？正解：10 萬（5 萬 × 2）。","1-108":"題意：1990 年名目所得 5 萬，物價上漲 50%，要維持實質所得需多少？正解：7.5 萬（5 萬 × 1.5）。","1-109":"題意：名目 GDP 9 兆、以 1996 年價格計的實質 GDP 6 兆，GDP 平減指數是多少？正解：150（9 ÷ 6 × 100）。","1-110":"題意：物價水準從 200 漲到 220，通膨率是多少？正解：10%（20 ÷ 200）。","1-111":"題意：實質 GDP 從 10 兆增加到 10.5 兆，成長率是多少？正解：5%（0.5 ÷ 10）。","1-112":"題意：實質 GDP 從 10 兆降到 9.5 兆，成長率是多少？正解：−5%。","1-113":"題意：CPI 從 120 升到 180，物價上漲多少？正解：50%（60 ÷ 120），不是 60%。","1-114":"題意：CPI 從 200 降到 180，通膨率是多少？正解：−10%（−20 ÷ 200）。","2-1":"題意：所有金融市場的共同特徵。正解：把資金從貸方-儲蓄者導向借方-支出者。不是每個市場都決定利率或交易股票。","2-2":"題意：金融市場的基本功能。正解：讓有錢可借的人和想借錢的人相遇。","2-3":"題意：金融市場為何提升經濟福利？正解：(a)(b)：資金流向有生產性投資機會的人；讓消費者更能安排購買時點。淘汰無效率企業不是課本列的理由。","2-4":"題意：運作良好的金融市場會帶來什麼？正解：有效率的資本配置。","2-5":"題意：金融市場崩解可能導致什麼？正解：政治不穩定。其他選項都是金融市場正常運作的結果。","2-6":"題意：哪一項是直接融資？正解：向朋友借 $2500。房貸來自銀行、退休基金與共同基金都是中介，屬間接融資。","2-7":"題意：借 $2000、年利率 10%，專案每年至少要賺多少才划算？正解：$201。利息是 $200，收益要超過利息才有賺。","2-8":"題意：借 $5000、專案年收益 $251，最高能接受的利率？正解：5%。利息 $250 小於收益 $251，仍增加所得；10% 就要付 $500。","2-9":"題意：哪一項是直接融資？正解：公司購買另一家公司發行的短期證券，資金直接從出資者到發行者。","2-10":"題意：哪一項是直接融資？正解：公司發行新股，投資人直接把錢交給公司。次級市場轉手不是融資。","2-11":"題意：同上。正解：(a)(b)：發行新股、直接買他公司發行的短期證券。次級市場買商業本票不算。","2-12":"題意：同上。正解：以上皆是：透過投資銀行發新股（投資銀行只是承銷）、買他公司短期證券、在初級市場買商業本票。","2-13":"題意：同上。正解：保險公司在「初級市場」買股票，資金直接進入發行公司。","2-14":"題意：同上，選項都是次級市場交易或透過中介。正解：以上皆非。","2-15":"題意：同上。正解：(b)(c)：都是直接向發行公司買證券。店頭市場轉手股票不算。","2-16":"題意：同上。正解：以上皆是：發新股、買他公司發行的短期證券、直接向發行公司買短期證券。","2-17":"題意：哪一項是間接融資？正解：把錢存進銀行，銀行再把錢借出去。","2-18":"題意：哪一項是間接融資？正解：(a)(b)：公司向銀行借款、民眾買共同基金。","2-19":"題意：同上。正解：(b)(c)：買共同基金；退休基金（中介機構）在次級市場買公司證券。","2-20":"題意：同上。正解：退休基金經理人在次級市場買公司短期證券，資金經過退休基金這個中介。","2-21":"題意：同上。正解：銀行（中介）向存戶買國庫券。","2-22":"題意：同上。正解：以上皆是。","2-23":"題意：同上。正解：(a)(b)：買共同基金、退休基金經理人買證券。","2-24":"題意：同上。正解：題庫答 (a) 股票在店頭市場交易。此題答案和前後題邏輯不太一致，考試以老師說法為準。","2-25":"題意：同上。正解：銀行向存戶買國庫券。","2-26":"題意：同上。正解：你向「銀行」買國庫券，銀行是中介。直接向財政部買是直接融資。","2-27":"題意：哪些是證券？正解：以上皆是：公司債、普通股、國庫券都是證券。","2-28":"題意：債與股的敘述，哪一個「不正確」？正解：兩者都可以是短期工具。股票沒有到期日，屬長期工具，所以這句錯。","2-29":"題意：債與股的正確敘述。正解：(a)(c)：都可以是長期工具；都是對發行者所得的請求權。","2-30":"題意：同上。正解：以上皆是：都可為長期工具、都對發行者所得有請求權、都能幫公司募資。","2-31":"題意：同上。正解：只有 (a)。股票不可能是短期；(c) 把債與股的請求權說錯。","2-32":"題意：金融市場與證券的正確敘述。正解：以上皆是：債券定義、到期期限定義、一年以下為短期。","2-33":"題意：同上。正解：題庫答 (a)(c)。但 (a) 說債券付「股利」給剩餘請求者其實不正確，疑為題庫誤植；(c) 到期期限的定義正確。長期是十年以上，(b) 也對，考試以老師說法為準。","2-34":"題意：債與股的正確敘述。正解：兩者都可以是長期工具。股東才是剩餘請求者，股票收益較不穩定，股票才發股利。","2-35":"題意：同上。正解：題庫答 (a)(d)，(a) 同 Q33 有誤植疑慮；(d) 到期期限定義正確。一年以下是短期，所以 (b) 錯。","2-36":"題意：同上。正解：(a)(b)：債券定義；股票常配股利、沒有到期日屬長期。短期是一年以下，(c) 錯。","2-37":"題意：同上。正解：只有 (b)。短期是一年以下、長期是十年以上，(a)(c) 錯。","2-38":"題意：證券對買方是＿，對發行者是＿？正解：資產；負債。","2-39":"題意：約 40 家交易商隨時報價買賣而形成市場的是什麼？正解：美國政府債券（店頭市場）。","2-40":"題意：哪些是初級市場？正解：以上皆非。紐約證交所、公債市場、店頭市場、選擇權市場都是次級市場。","2-41":"題意：哪些是次級市場？正解：以上皆是。","2-42":"題意：次級市場的重要功能。正解：讓人更容易把金融工具賣掉換現金（提供流動性）。替公司募資是初級市場的功能。","2-43":"題意：次級市場讓金融工具變得更＿？正解：具流動性（liquid）。","2-44":"題意：證券在次級市場價格越高，會怎樣？正解：公司在初級市場發新證券能募到越多資金。","2-45":"題意：協助證券在初級市場首次出售的機構。正解：投資銀行。","2-46":"題意：公司何時才拿到新資金？正解：由投資銀行在初級市場出售時。","2-47":"題意：同上。正解：在初級市場由投資銀行出售。","2-48":"題意：只在店頭市場交易的資產。正解：國庫債券（公債）。股票與商品都有交易所。","2-49":"題意：哪些市場有時以店頭市場形式運作？正解：以上皆是：股票、債券、外匯、聯邦資金市場。","2-50":"題意：正確敘述。正解：以上皆是：很多股票在店頭交易；公司只有在初級市場首次出售才拿到資金；貨幣市場證券交易較廣、流動性較高。","2-51":"題意：同上。正解：只有 (a)。公司不會分到經紀商佣金；短期證券才比較具流動性。","2-52":"題意：同上。正解：只有 (b)。很多股票在店頭交易，(a) 錯；(c) 的比較也錯。","2-53":"題意：同上。正解：(a)(c)：很多股票在店頭交易；貨幣市場工具期限短，價格波動不大。","2-54":"題意：在外國發行、以「當地貨幣」計價的債券。正解：外國債券（foreign bonds）。","2-55":"題意：在外國發行、以「非當地貨幣」計價的債券。正解：歐洲債券（Eurobonds）。","2-56":"題意：透過金融中介機構進行間接融資的過程叫什麼？正解：金融中介（financial intermediation）。脫媒是資金離開中介。","2-57":"題意：美國企業融資中，＿的貸款比證券市場＿重要？正解：金融中介；更。","2-58":"題意：把成本分攤給大量客戶。正解：規模經濟。","2-59":"題意：規模經濟讓金融機構可以做到什麼？正解：降低交易成本。","2-60":"題意：金融服務中規模經濟的例子。正解：把撰寫標準化合約的成本分攤給許多借款人。","2-61":"題意：存戶既能賺利息又能隨時提領，原因是？正解：金融中介降低了交易成本。","2-62":"題意：中介機構創造並賣出低風險資產，再用所得買高風險資產。正解：風險分攤（risk sharing）。","2-63":"題意：風險分攤又稱為？正解：資產轉換（asset transformation）。","2-64":"題意：買進報酬不同步的資產以降低風險。正解：分散投資（diversification）。","2-65":"題意：哪句話表達分散投資？正解：別把所有雞蛋放在同一個籃子裡。","2-66":"題意：資產轉換指什麼？正解：把風險資產轉換成對投資人較安全的資產。","2-67":"題意：風險分攤為什麼對金融機構有利可圖？正解：交易成本低。","2-68":"題意：風險分攤對客戶的好處。正解：降低風險。","2-69":"題意：交易成本的存在部分解釋了什麼？正解：金融中介與間接融資在金融市場中扮演重要角色。","2-70":"題意：金融中介機構的特性。正解：以上皆是：因資訊與交易成本存在而出現、幫助小額儲蓄者、參與間接融資。","2-71":"題意：金融中介如何提升效率與財富？正解：以上皆是：降低交易成本、緩解資訊不對稱、降低投資人風險。","2-72":"題意：借款人比貸方更了解投資報酬與風險，稱為＿，會造成＿問題？正解：資訊不對稱；逆選擇。","2-73":"題意：借款人比貸方更了解自己的投資計畫。正解：資訊不對稱。","2-74":"題意：信用差的人最積極借款並借到錢。正解：逆選擇。","2-75":"題意：交易「前」的問題叫＿，交易「後」的問題叫＿？正解：逆選擇；道德風險。","2-76":"題意：什麼導致逆選擇與道德風險？正解：資訊不對稱。","2-77":"題意：逆選擇的來源。正解：貸方不了解借款人的潛在報酬與風險。","2-78":"題意：逆選擇可以解釋什麼？正解：(a)(b)：哪些公司較可能向中介借錢；為何間接融資比直接融資重要。","2-79":"題意：只有大型知名企業能進入證券市場。正解：(a)(b)：解釋了間接融資為何重要；可用逆選擇解釋。並沒有法規禁止小公司發證券。","2-80":"題意：貸方對投資計畫資訊較少。正解：資訊不對稱。","2-81":"題意：職棒合約禁止球員滑雪，是為了防什麼？正解：道德風險。簽約後球員可能做出高風險行為。","2-82":"題意：公司用增資款請全體員工搭郵輪。正解：道德風險。拿到錢之後把錢用在對出資者不利的地方。","2-83":"題意：買二手車，看到的選擇大多是爛車。正解：逆選擇（檸檬問題）。","2-84":"題意：奧克拉荷馬某銀行輕易借錢給探油者，多數沒還。正解：沒有處理逆選擇。最想借的是高風險借款人，銀行卻沒篩選。","2-85":"題意：美國企業的外部資金主要來自？正解：銀行貸款。","2-86":"題意：同上。正解：銀行貸款。","2-87":"題意：主要已開發國家的研究顯示？正解：企業外部融資以金融中介為主。","2-88":"題意：美國與哪國證券市場最發達、也最常使用？正解：加拿大。","2-89":"題意：最少使用證券市場的兩國？正解：德國、日本。","2-90":"題意：德、日兩國中介融資約是證券市場的幾倍？正解：約十倍。","2-91":"題意：各國都是＿優於＿，但股債比重差異大？正解：金融中介；證券市場。","2-92":"題意：企業找資金通常從哪裡取得？正解：金融中介。","2-93":"題意：哪一個不是存款機構？正解：財務公司。它靠發商業本票、股債籌資，不收存款。","2-94":"題意：哪一個是契約型儲蓄機構？正解：壽險公司。依保單契約定期收保費。","2-95":"題意：契約型儲蓄機構包括？正解：壽險公司。","2-96":"題意：哪一個不是契約型儲蓄機構？正解：信用合作社，它是存款機構。","2-97":"題意：哪些不是存款機構？正解：(a)(b)：財務公司、退休基金。儲貸協會是存款機構。","2-98":"題意：哪一個不是契約型儲蓄機構？正解：共同基金，它是投資型中介。","2-99":"題意：哪一個是投資型中介？正解：共同基金。其他都是契約型儲蓄機構。","2-100":"題意：哪些是存款機構？正解：(a)(b)：儲貸協會、商業銀行。貨幣市場基金是投資型中介。","2-101":"題意：哪一個是存款機構？正解：信用合作社。","2-102":"題意：哪些是存款機構？正解：(a)(b)：互助儲蓄銀行、信用合作社。共同基金不是。","2-103":"題意：哪一個是存款機構？正解：互助儲蓄銀行。","2-104":"題意：哪一個不是契約型儲蓄機構？正解：儲貸協會，它是存款機構。","2-105":"題意：哪些不是投資型中介？正解：(a)(b)：壽險公司、退休基金，它們屬契約型儲蓄機構。","2-106":"題意：哪些是投資型中介？正解：(a)(b)：財務公司、共同基金。退休基金是契約型。","2-107":"題意：互助儲蓄銀行的主要資產。正解：房貸。","2-108":"題意：信用合作社的主要負債。正解：存款。","2-109":"題意：退休基金的主要資產。正解：公司債與股票。","2-110":"題意：儲貸協會的主要資產。正解：房貸。","2-111":"題意：信用合作社的主要資產。正解：消費者貸款。","2-112":"題意：財務公司的主要資產。正解：消費者貸款與企業貸款。","2-113":"題意：商業銀行的主要資產。正解：以上皆是：房貸、消費與企業貸款、美國政府證券。","2-114":"題意：產物（火災意外）保險公司的主要資產。正解：(a)(b)：市政債券、公司股票與債券。","2-115":"題意：產險公司的主要資金來源。正解：保單的保費。","2-116":"題意：商業銀行的主要負債。正解：存款。","2-117":"題意：存款機構的主要負債。正解：存款。","2-118":"題意：貨幣市場共同基金的主要資產。正解：貨幣市場工具（短期債務工具）。","2-119":"題意：貨幣市場基金的股份功能像什麼？正解：會付利息的支票帳戶。","2-120":"題意：貨幣市場基金股份的重要特色。正解：可以憑持股開支票。它沒有存款保險。","2-121":"題意：儲蓄機構（thrift）包括哪些？正解：儲貸協會、互助儲蓄銀行、信用合作社。","2-122":"題意：哪一個不是金融監理的目標？正解：確保投資人永不虧損。監理是降低資訊問題與維持穩定，不保證不賠錢。","2-123":"題意：FDIC 監理哪些機構？正解：(a)(b)：儲貸協會、互助儲蓄銀行。信用合作社由 NCUA 監理。","2-124":"題意：儲貸協會由誰監理？正解：儲蓄機構監理局（OTS）。","2-125":"題意：哪些機構監理至少一部分商業銀行？正解：以上皆是：OCC、FDIC、Fed。","2-126":"題意：哪些機構會檢查存款機構的帳冊？正解：以上皆是：OCC、Fed、NCUA、州銀行與保險委員會。","2-127":"題意：哪一個不發執照？正解：聯準會。它監理會員銀行但不核發執照。","2-128":"題意：防範金融恐慌的監理措施。正解：以上皆是：限制進入、資訊揭露、存款保險、限制資產與業務。","2-129":"題意：1930–1933 銀行恐慌後為保護存戶成立的機構。正解：聯邦存款保險公司（FDIC）。","2-130":"題意：1999 年廢除的重要限制。正解：商業銀行與證券業分離（Glass-Steagall）。","2-131":"題意：SEC 的目標是減少什麼問題？正解：資訊不對稱，靠要求揭露資訊達成。","2-132":"題意：資訊不對稱是普遍問題，這代表什麼？正解：工業國家的金融監理都很相似。","2-133":"題意：SEC 揭露規定的目的。正解：增加投資人能取得的資訊。不保證投資人不虧損。","2-134":"題意：存款保險的主要目的。正解：防止銀行恐慌（擠兌）。","2-135":"題意：為降低風險，銀行等金融機構被禁止做什麼？正解：持有普通股。","2-136":"題意：美國國庫券的特性。正解：以上皆是：最安全、沒有利息而折價發行、流動性最高的貨幣市場工具。","2-137":"題意：國庫券的發行期限。正解：3、6、12 個月（課本版本）。","2-138":"題意：國庫券，(a) 寫有 9 個月。正解：(b)(c)：折價發行、流動性最高。期限沒有 9 個月。","2-139":"題意：國庫券，(a) 寫 3、6、12 個月。正解：以上皆是。","2-140":"題意：銀行賣給存戶、每年付固定利息、到期還本的債務工具。正解：可轉讓定期存單（NCD）。","2-141":"題意：聯邦資金是什麼？正解：銀行彼此之間的借貸（通常隔夜）。","2-142":"題意：哪些是短期金融工具？正解：以上皆是：NCD、銀行承兌匯票、六個月貸款、國庫券。","2-143":"題意：同上，(c) 換成國庫債券。正解：(a)(b)。國庫債券（T-bond）是長期工具。","2-144":"題意：同上。正解：銀行承兌匯票。股票是長期，四年期國庫票據是中期。","2-145":"題意：哪個在貨幣市場交易？正解：國庫券。州地方政府債、公司債都在資本市場。","2-146":"題意：同上。正解：銀行承兌匯票。商業放款與房貸不是貨幣市場工具。","2-147":"題意：哪一個「不」在貨幣市場交易？正解：以上皆非，四種都是貨幣市場工具。","2-148":"題意：同上，(e) 換成住宅房貸。正解：住宅房貸，它是資本市場工具。","2-149":"題意：哪些是長期金融工具？正解：以上皆非，四個都是短期工具。","2-150":"題意：同上。正解：美國國庫債券。","2-151":"題意：哪一個在資本市場交易？正解：美國政府機構證券。其他都是貨幣市場工具。","2-152":"題意：同上。正解：(a)(b)：政府機構證券、州與地方政府債券。附買回協議是貨幣市場工具。","2-153":"題意：同上。正解：公司債。","3-1":"題意：為什麼沒有單一精確的貨幣衡量？正解：很難判斷什麼東西「普遍被接受」作為支付工具。政府有公布貨幣統計，通貨當然算貨幣。","3-2":"題意：為什麼找不到完全令人滿意的貨幣衡量方式？正解：資產的「貨幣性」或流動性是程度問題，很難劃一條線。","3-3":"題意：通貨（currency）包括什麼？正解：紙幣與硬幣。支票與儲蓄存款不算通貨。","3-4":"題意：貨幣與所得的差別。正解：貨幣是存量（某一時點的數量），所得是流量（每段時間的收入）。","3-5":"題意：哪一句正確？正解：所得是流量，財富是存量。","3-6":"題意：說比爾蓋茲「有很多錢」，日常用語指的是什麼？正解：以上皆是：可能指支票存款多、很有財富、所得很高。這正是日常用語把貨幣和財富、所得混用。","3-7":"題意：一個人的年薪是她的什麼？正解：所得。","3-8":"題意：一個人的房子是她的什麼？正解：財富。房子不是貨幣，也不是所得。","3-9":"題意：一個人的支票存款是她的什麼？正解：(a)(c)：是貨幣，也是財富的一部分；不是所得。","3-10":"題意：一套一分錢硬幣收藏是什麼？正解：(a)(c)：硬幣仍是貨幣，也是財富。","3-11":"題意：關於貨幣的敘述。正解：以上皆是：貨幣是普遍被接受的支付工具；常被誤當成財富的同義詞；日常說的貨幣包含紙幣、硬幣與支票。","3-12":"題意：同上，(c) 說貨幣是每段時間的收入流量。正解：(a)(b)。每段時間的收入流量是所得，不是貨幣。","3-13":"題意：哪些敘述正確？正解：以上皆是：財富是可儲值財產的總和；貨幣常被誤當成所得；所得是每段時間的收入流量。","3-14":"題意：同上。正解：以上皆是：財富的定義；貨幣是存量；所得是流量。","3-15":"題意：同上。正解：只有 (a)。貨幣是存量不是流量，所得是流量不是存量。","3-16":"題意：貨幣三大功能中，哪一個讓它有別於其他資產？正解：交易媒介。股票、房子也能儲存價值，但不能直接拿來付款。","3-17":"題意：歷史上貨幣出現過哪些形式？正解：以上皆是：菸草、香菸、貝殼串珠都曾當貨幣。","3-18":"題意：如果花生同時是交易媒介、計價單位和價值儲存，花生就是什麼？正解：貨幣。","3-19":"題意：經濟學家說「物物交換不可能」，真正意思是？正解：物物交換的成本很高，不是真的做不到。","3-20":"題意：物物交換的問題。正解：需要「欲望的雙重巧合」，雙方剛好都想要對方的東西。","3-21":"題意：怎樣避免欲望的雙重巧合問題？正解：使用貨幣來進行交換。","3-22":"題意：從物物交換改用貨幣，如何提升效率？正解：降低交易成本。","3-23":"題意：同上。正解：降低交易成本而提升效率。用貨幣並不會減少交換或分工的需要。","3-24":"題意：哪些敘述正確？正解：以上皆是：降低交換成本、降低想專業分工者的成本、降低交易成本。","3-25":"題意：同上，(a)(b) 寫成「提高成本」。正解：只有 (c)：降低交易成本。","3-26":"題意：同上。正解：只有 (b)：降低想專業分工者的成本。(a) 寫提高成本，(c) 說不提升效率，都錯。","3-27":"題意：和貨幣經濟相比，物物交換的缺點。正解：以上皆是：需要欲望的雙重巧合、提高跨時交換的成本、提高專業分工者的交換成本。","3-28":"題意：同上，(b)(c) 寫成「降低成本」。正解：只有 (a)：需要欲望的雙重巧合。","3-29":"題意：貨幣作為交易媒介的好處。正解：以上皆是：消除欲望雙重巧合的需要、鼓勵專業分工、降低交易成本。","3-30":"題意：同上，(c) 說貨幣不准賺利息。正解：(a)(b)。很多貨幣（如付息支票存款）可以有利息。","3-31":"題意：同上，(a) 說「阻礙」分工。正解：只有 (b)：降低交易成本。","3-32":"題意：同上。正解：消除欲望雙重巧合的需要。貨幣可以付息、不一定是通貨、也可以是耐久資產。","3-33":"題意：說貨幣能提升效率，意思是？正解：(a)(b)：降低交易成本、鼓勵專業分工。","3-34":"題意：同上，(a) 說「增加」交易成本。正解：只有 (b)：鼓勵專業分工。","3-35":"題意：貨幣如何提升經濟效率？正解：鼓勵專業分工。貨幣不是零成本，也不是增加交易成本。","3-36":"題意：哪些敘述正確？正解：(a)(b)：貨幣降低交換成本，因而促進效率。所得是流量，(c) 錯。","3-37":"題意：商品要有效當貨幣，需要具備什麼？正解：以上皆是：容易標準化、被廣泛接受、可分割成小單位。","3-38":"題意：同上，(c) 說要「很快損壞」。正解：(a)(b)。貨幣應該不易損壞。","3-39":"題意：被普遍接受作為交易媒介的東西是什麼？正解：就是貨幣。不一定要是商品或貴金屬。","3-40":"題意：除最原始的社會外都使用貨幣，代表什麼？正解：(a)(b)：用貨幣有效率、物物交換沒效率。並不代表物物交換在家庭外完全行不通。","3-41":"題意：社會用什麼當貨幣，決定性特徵是什麼？正解：必須被普遍接受作為支付或還債工具。","3-42":"題意：貨幣一定要具備什麼？正解：被普遍接受。不必有黃金支撐，也不必有非貨幣用途的價值。","3-43":"題意：同上。正解：被普遍接受。","3-44":"題意：找買賣對象、談價格所花的資源叫什麼？正解：交易成本。","3-45":"題意：貨幣讓交換變方便，但交換仍有成本，這叫什麼？正解：交易成本。","3-46":"題意：交換商品勞務所花的時間與資源叫什麼？正解：交易成本。","3-47":"題意：經濟學家說貨幣有生產力，因為它降低了什麼？正解：交易成本。","3-48":"題意：和有交易媒介的經濟相比，物物交換經濟的特徵？正解：交易成本較高。","3-49":"題意：貨幣降低交易成本，讓人專注做最擅長的事，因此促進什麼？正解：(b)(c)：效率與分工。","3-50":"題意：同上。正解：分工。(b) 寫無效率，錯。","3-51":"題意：貨幣降低交易成本，因此？正解：(a)(b)：促進效率與分工。並非偏好生產勝過交換。","3-52":"題意：同上。正解：只有 (b)：促進分工。","3-53":"題意：同上。正解：改善經濟效率。","3-54":"題意：同上。正解：改善經濟效率。貨幣增加而非減少專業分工。","3-55":"題意：同上。正解：(b)(c)：改善效率、鼓勵專業分工與交換。","3-56":"題意：為什麼能確定貨幣促進效率？正解：(a)(b)：幾乎所有社會都使用貨幣；人們在交換時偏好用貨幣。","3-57":"題意：用貨幣價格來比較價值，這是什麼功能？正解：計價單位。","3-58":"題意：貨幣作為計價單位的好處。正解：(a)(b)：降低交易成本、減少需要計算的價格數目。","3-59":"題意：同上，(a) 說「增加」交易成本。正解：只有 (b)：減少需要計算的價格數目。","3-60":"題意：商品很多時物物交換的問題。正解：每種商品都有很多個價格（以其他各種商品表示）。","3-61":"題意：物物交換經濟中 N 種商品要幾個價格？正解：N(N−1)/2，也就是任兩種商品之間各一個價格。","3-62":"題意：10 種商品的物物交換經濟需要幾個價格？正解：45 個（10×9÷2）。","3-63":"題意：同上，10 種商品。正解：45 個。","3-64":"題意：4 種商品需要幾個價格？正解：6 個（4×3÷2）。","3-65":"題意：4 種商品需要幾個價格？正解：6 個。","3-66":"題意：6 種商品需要幾個價格？正解：15 個（6×5÷2）。","3-67":"題意：6 種商品需要幾個價格？正解：15 個。","3-68":"題意：5 種商品需要幾個價格？正解：10 個（5×4÷2）。","3-69":"題意：5 種商品需要幾個價格？正解：10 個。","3-70":"題意：哪些資產可以作為價值儲存？正解：以上皆是：貨幣、股債、房子。","3-71":"題意：貨幣作為價值儲存，代表什麼？正解：以上皆非。貨幣可以付息、可以是耐久資產、不一定是通貨。","3-72":"題意：貨幣不是唯一的價值儲存工具，為何人們仍覺得方便？正解：它是流動性最高的資產。物價上漲時貨幣價值會下降。","3-73":"題意：賣出資產的交易成本提高，資產會變得？正解：流動性較低。","3-74":"題意：哪一個資產流動性最高？正解：旅行支票，可直接當支付工具。其他需先變現。","3-75":"題意：哪一個資產流動性最低？正解：房子，賣掉要花很多時間和成本。","3-76":"題意：流動性由高到低的正確排序。正解：通貨、儲蓄債券、房子。","3-77":"題意：流動性由高到低的正確排序。正解：儲蓄存款、公司債、游泳池。","3-78":"題意：債券、股票、藝術品、土地、車子、房子都能儲存價值，但？正解：它們不被普遍接受作為支付工具。它們可能產生收益，也算財富。","3-79":"題意：支票存款為什麼算貨幣？正解：因為它具備貨幣的功能（可以拿來付款），不是因為法規規定。","3-80":"題意：通膨期間其他資產較能保值，人們為何仍持有貨幣？正解：貨幣流動性極高。","3-81":"題意：物價水準翻倍，貨幣價值會？正解：下降 50%。同樣一塊錢只能買一半的東西。","3-82":"題意：物價水準下跌 50%，貨幣價值會？正解：加倍。","3-83":"題意：物價水準下跌對貨幣價值的影響。正解：貨幣價值上升。","3-84":"題意：惡性通膨期間會發生什麼？正解：貨幣不再是好的價值儲存工具，人們可能大量改用物物交換。貨幣價值是快速下降，中產階級儲蓄者受害。","3-85":"題意：同上。正解：以上皆是：貨幣價值快速下跌、物物交換增加、債務人因實質債務下降而受益。","3-86":"題意：物價快速上漲時，貨幣失去哪個功能？正解：價值儲存。","3-87":"題意：貨幣交易減少、物物交換增加，可推論什麼？正解：以上皆是：通膨惡化成惡性通膨、貨幣不再能儲存價值、用貨幣也不再明顯降低交易成本。","3-88":"題意：一國物價極快速上漲，稱為什麼？正解：惡性通貨膨脹。","3-89":"題意：1990 年尼加拉瓜通膨超過 13,000%，代表什麼？正解：惡性通貨膨脹。","3-90":"題意：商人寧可關門讓商品爛掉也不收一文不值的貨幣，代表？正解：惡性通貨膨脹。","3-91":"題意：人民覺得本國貨幣一文不值，代表？正解：惡性通貨膨脹。","3-92":"題意：同 Q90 情境，可知該國貨幣？正解：是很差的價值儲存工具。","3-93":"題意：和支票相比，紙幣與硬幣的缺點。正解：(a)(b)：容易被偷；大量時體積大、運送成本高。通貨是流動性最高的資產，(c) 錯。","3-94":"題意：從商品貨幣走向紙幣的條件。正解：以上皆是：貿易範圍擴大使運送商品貨幣太貴；印刷技術足以防偽；買車買房等大額交易變普遍。","3-95":"題意：付款制度從物物交換演進到貨幣制度。正解：(a)(b)：商品貨幣先於紙幣出現；交易成本下降。需要計算的價格數目是減少，(c) 錯。","3-96":"題意：同上，(c) 改成價格數目減少。正解：以上皆是。","3-97":"題意：付款制度從物物交換、貴金屬、法定貨幣到支票的演進，最好怎麼理解？正解：一連串降低交換成本的創新。","3-98":"題意：同上。正解：降低交換商品勞務成本的創新。","3-99":"題意：同上。正解：貴金屬很難攜帶和運送，所以被紙幣取代。","3-100":"題意：關於付款制度演進的敘述。正解：以上皆是：演進是降低交易成本的創新；貴金屬被接受、可分割、耐久但難運送；法定貨幣較輕，但大量時仍難運送。","3-101":"題意：付款制度演進的正確順序。正解：物物交換 → 貴金屬硬幣 → 紙幣 → 支票 → 電子資金移轉。","3-102":"題意：如何解釋貨幣的演進？正解：新的貨幣形式出現是為了降低交易成本。","3-103":"題意：電子轉帳普及後，支票為何短期內不會消失？正解：(a)(b)：人們想要紙本收據；支票較能降低詐騙。","3-104":"題意：過去二十年付款制度的重要特徵。正解：電子資金移轉的使用快速增加。","3-105":"題意：和支票相比，電子資金移轉的優點。正解：(a)(b)：轉帳成本較低、可以立即完成。法律責任未必較明確。","3-106":"題意：和電子轉帳相比，支票的主要缺點。正解：(a)(b)：處理成本較高；處理時間較長，存款人要等幾天才拿到錢。","3-107":"題意：以支票為主的付款制度有哪些缺點？正解：以上皆是：處理成本高、運送成本高、清算需要時間。","3-108":"題意：智慧卡相當於什麼？正解：現金。","3-109":"題意：哪些電子貨幣可替代現金？正解：以上皆是：金融卡（簽帳卡）、儲值卡、智慧卡。","3-110":"題意：哪一種「不是」現金的替代品？正解：信用卡。信用卡是借款，不是直接付出現金。","3-111":"題意：1991 年馬斯垂克條約下，1999 年加入貨幣同盟國家的匯率怎麼處理？正解：永久固定於歐元。","3-112":"題意：支持歐洲貨幣同盟的人強調單一貨幣的好處。正解：免除貨幣兌換的交易成本。","3-113":"題意：1990 年東西德統一貨幣的好處。正解：(a)(b)：免除兌換成本、加速兩地經濟整合。","3-114":"題意：同上，(b) 寫成「放慢整合」。正解：只有 (a)：免除兌換交易成本。","3-115":"題意：近年的金融創新讓 Fed 的貨幣政策工作變得？正解：更困難，因為 Fed 不再確定該把什麼算成貨幣。","3-116":"題意：金融創新越快，定義貨幣就越＿？正解：更困難；越快。","3-117":"題意：Fed 公布最窄的貨幣衡量是？正解：M1。","3-118":"題意：今天美國的貨幣大部分是什麼形式？正解：支票存款。","3-119":"題意：哪一個不包含在 M1？正解：附買回協議。NOW 帳戶、活期存款、通貨都在 M1。","3-120":"題意：哪一個不包含在 M1？正解：財政部發行的金幣。","3-121":"題意：M1 的組成是活期與支票存款再加上？正解：通貨＋旅行支票。","3-122":"題意：M1 包含哪一項？正解：活期存款。其他三項屬 M2 但不在 M1。","3-123":"題意：M1 包含哪一項？正解：旅行支票。","3-124":"題意：M1 包含哪一項？正解：通貨。","3-125":"題意：哪一個不在 M2？正解：儲蓄債券。","3-126":"題意：哪一個在 M2 但不在 M1？正解：（非機構）貨幣市場共同基金股份。","3-127":"題意：哪一個在 M2 但不在 M1？正解：貨幣市場存款帳戶。","3-128":"題意：哪一個在 M1 但不在 M2？正解：以上皆非。M2 包含 M1 的全部項目。","3-129":"題意：哪一個不在 M2 但在 M1？正解：以上皆非，原因同上。","3-130":"題意：哪一個不在 M2 但在 M1？正解：以上皆非。","3-131":"題意：哪一個不在 M1 但在 M2？正解：小額定期存款。","3-132":"題意：哪一個不在 M1 但在 M2？正解：儲蓄存款。","3-133":"題意：哪一個同時在 M1 和 M2？正解：通貨。其他只在 M2 或都不在。","3-134":"題意：下列何者最大？正解：M3，範圍最廣。","3-135":"題意：把美國儲蓄債券贖回成現金。正解：M1 和 M2 都增加。儲蓄債券不在 M2，換成通貨後兩者都多了。","3-136":"題意：把錢從小額定存移到活期存款。正解：M1 增加，M2 不變（兩者都在 M2 內）。","3-137":"題意：把錢從活期存款移到小額定存。正解：M1 減少，M2 不變。","3-138":"題意：從小額定存移到貨幣市場存款帳戶。正解：M1、M2 都不變，兩者都只在 M2。","3-139":"題意：從活期存款移到貨幣市場存款帳戶。正解：M1 減少，M2 不變。","3-140":"題意：從小額定存移到儲蓄存款。正解：M1、M2 都不變。","3-141":"題意：從儲蓄存款移到貨幣市場存款帳戶。正解：M1、M2 都不變。","3-142":"題意：從貨幣市場存款帳戶移到活期存款。正解：M1 增加，M2 不變。","3-143":"題意：從（非機構）貨幣市場基金移到儲蓄存款。正解：M1、M2 都不變。","3-144":"題意：從通貨移到貨幣市場存款帳戶。正解：M1 減少，M2 不變。","3-145":"題意：從通貨移到活期存款。正解：M1、M2 都不變，兩者都在 M1。","3-146":"題意：從（非機構）貨幣市場基金移到大額定存。正解：M2 減少，M3 不變。大額定存不在 M2 但在 M3。","3-147":"題意：從貨幣市場存款帳戶提領成通貨。正解：M1 增加，M2 不變。","3-148":"題意：從（非機構）貨幣市場基金移到貨幣市場存款帳戶。正解：M2、M3 都不變。","3-149":"題意：各貨幣總計數成長率的關係。正解：長期大致同向，但短期可能分歧。","3-150":"題意：哪個年代各貨幣總計數成長率分歧最大？正解：1990 年代。","3-151":"題意：Fed 最初公布的貨幣數據。正解：(a)(b)：不是可靠的短期指標，但對長期走勢仍可靠。","3-152":"題意：比較修正後與最初的貨幣數據，可知？正解：最初數據不是短期貨幣變動的好指標。","3-153":"題意：Fed 為何會大幅修正貨幣總計數？正解：以上皆非。修正原因是小型機構不常申報、季節調整需要更多資料，不是這三個選項。","3-154":"題意：同上。正解：(a)(b)：小型存款機構不常申報存款；季節調整要等更多資料才精確。","3-155":"題意：關於 M1、M2、M3 的正確敘述。正解：三者走勢不一致，決策者不能互相替代使用。","3-156":"題意：同上。正解：以上皆是：M1 最窄；最初估計不能可靠反映短期變化；三者走勢不同。","3-157":"題意：同上。正解：只有 (c)。最窄的是 M1，最初估計也不可靠，(a)(b) 錯。","9-1":"題意：銀行資產負債表顯示什麼？正解：(a)(b)：資產＝負債＋權益資本；列出資金來源與用途。資產負債表看不出有沒有賺錢，那是損益表。","9-2":"題意：同上，(c) 換成「是否有清償能力」。正解：以上皆是。資產是否大於負債，從資產負債表就看得出來。","9-3":"題意：哪一句正確？正解：資產負債表顯示總資產＝總負債＋權益資本。資產是資金用途、負債是資金來源，(a)(b) 寫反了。","9-4":"題意：同上。正解：以上皆是：資產是資金用途、負債是資金來源、總資產＝負債＋權益資本。","9-5":"題意：哪一句正確？正解：銀行的資產是資金的用途。","9-6":"題意：哪一句「錯誤」？正解：銀行資本是資產。資本列在負債與權益那一邊，是資金來源。","9-7":"題意：哪一項是銀行的負債？正解：支票存款。準備金、放款、存放同業都是資產。","9-8":"題意：哪些是負債？正解：(a)(b)：向 Fed 借的貼現放款、支票存款。國庫證券是資產。","9-9":"題意：哪一項是負債？正解：小額定期存款。","9-10":"題意：哪些列在負債方？正解：(a)(b)：非交易性存款、銀行資本。放款是資產。","9-11":"題意：哪一項是負債？正解：貼現放款（銀行向 Fed 借的錢）。托收中現金與州政府證券是資產。","9-12":"題意：哪一項列在負債方？正解：銀行資本。放款與準備金是資產。","9-13":"題意：支票存款占銀行負債的比重如何變化？正解：隨時間縮小。","9-14":"題意：支票存款與貨幣市場存款帳戶。正解：(a)(b)：可隨時提領、是銀行的負債。","9-15":"題意：哪一句「錯誤」？正解：支票存款是銀行主要資金來源。其實主要來源是非交易性存款（儲蓄與定存）。","9-16":"題意：存款利息占營業費用約＿，服務帳戶的成本約占＿？正解：約 30%；約 50%。","9-17":"題意：存款利息約占營業費用多少？正解：約 30%。","9-18":"題意：服務存款帳戶的成本約占營業費用多少？正解：約 50%。","9-19":"題意：哪一句「錯誤」？正解：服務帳戶的費用超過營運成本的一半。課本說約 50%，不是超過一半。","9-20":"題意：哪些正確？正解：以上皆是：支票存款通常是最便宜的資金、可隨時提領、包含 NOW 帳戶。","9-21":"題意：同上，(c) 說支票存款是主要資金來源。正解：(a)(b)。主要來源是非交易性存款。","9-22":"題意：哪些正確？正解：以上皆是：非交易性存款是主要資金來源；活期存款不付息；儲蓄存款技術上不是隨時可提領。","9-23":"題意：同上。正解：只有 (b)：活期存款是不付息的支票存款。","9-24":"題意：哪一項是交易性存款？正解：NOW 帳戶，可開支票。","9-25":"題意：哪一項「不是」非交易性存款？正解：NOW 帳戶，它屬交易性存款。","9-26":"題意：哪些是非交易性存款？正解：以上皆是：儲蓄、小額定存、定期存單。","9-27":"題意：同上。正解：(a)(b)：儲蓄存款、小額定存。NOW 帳戶是交易性。","9-28":"題意：大額 CD 是＿的，可以像債券一樣在＿市場轉賣？正解：可轉讓的；次級市場。","9-29":"題意：支票存款對存款人流動性＿，所以利率＿？正解：較高；較低。","9-30":"題意：存摺儲蓄流動性比支票存款＿，所以利率＿？正解：較低；較高。","9-31":"題意：＿流動性比＿低，所以利率較高？正解：存摺儲蓄；支票存款。","9-32":"題意：定期存款流動性比存摺儲蓄＿，所以利率＿？正解：較低；較高。","9-33":"題意：＿流動性比＿低，所以利率較高？正解：定期存款；存摺儲蓄。","9-34":"題意：銀行資本列在哪一邊？代表資金的什麼？正解：負債方；資金來源。","9-35":"題意：銀行從哪裡取得資金？正解：(a)(b)：支票存款、儲蓄帳戶。準備金是資金用途。","9-36":"題意：同上。正解：銀行資本。托收中現金與準備金都是資產。","9-37":"題意：用來買生息資產的資金來源。正解：(a)(b)：支票存款、儲蓄帳戶。","9-38":"題意：同上。正解：銀行資本。","9-39":"題意：銀行向 Fed 借的錢叫＿，是資金的＿？正解：貼現放款；來源。","9-40":"題意：關於銀行準備金。正解：可分成法定準備與超額準備。準備金還包括庫存現金，不只 Fed 存款，也不含政府證券。","9-41":"題意：準備金包括什麼？正解：(a)(b)：在 Fed 的存款、庫存現金。","9-42":"題意：同上。正解：庫存現金與在 Fed 的存款。","9-43":"題意：法規要求銀行持有的支票存款比例。正解：法定準備。","9-44":"題意：準備金、托收中現金、存放同業合稱？正解：現金項目（cash items）。","9-45":"題意：哪些列在資產方？正解：(a)(b)：美國國庫證券、放款。向 Fed 的貼現放款是負債。","9-46":"題意：同上。正解：放款。貼現放款與借入款是負債。","9-47":"題意：同上。正解：(a)(b)：托收中現金、放款。","9-48":"題意：同上。正解：托收中現金項目。","9-49":"題意：同上。正解：(a)(b)：托收中現金、存放同業。","9-50":"題意：同上。正解：以上皆是：國庫證券、準備金、放款。","9-51":"題意：同上。正解：(b)(c)：放款、準備金。貼現放款是負債。","9-52":"題意：同上。正解：準備金。","9-53":"題意：同上。正解：準備金。","9-54":"題意：同上。正解：以上皆是：托收中現金、存放同業、國庫證券。","9-55":"題意：哪一項「不是」資產？正解：支票存款，它是負債。","9-56":"題意：哪一項「不是」資產？正解：借入款。","9-57":"題意：哪一項「不是」資產？正解：向 Fed 借的貼現放款。","9-58":"題意：哪些「不是」資產？正解：(a)(b)：借入款、儲蓄存款。","9-59":"題意：大銀行透過通匯業務替小銀行提供什麼？正解：(a)(b)：支票托收、外匯交易。不包括替小銀行發行股票。","9-60":"題意：同上，(c) 換成協助買證券。正解：以上皆是。","9-61":"題意：銀行持有的證券主要是？正解：國庫證券與政府機構證券。","9-62":"題意：哪一項資產流動性最高？正解：準備金。","9-63":"題意：哪一項流動性最高？正解：美國政府證券。","9-64":"題意：銀行資產中最重要的一類。正解：以上皆非。最重要的是放款，沒有出現在選項中。","9-65":"題意：同上。正解：放款。","9-66":"題意：哪一項流動性「最低」？正解：次級準備。其他三項都是現金項目。","9-67":"題意：次級準備包括？正解：短期國庫證券。","9-68":"題意：短期政府證券因為流動性＿，被稱為次級準備？正解：高；短期。","9-69":"題意：為什麼叫次級準備？正解：可以用很低的交易成本變成現金。","9-70":"題意：同 Q61。正解：國庫證券與政府機構證券。","9-71":"題意：銀行為何持有州與地方政府證券？正解：(a)(b)：利息免繳聯邦所得稅；有助吸引州與地方政府的帳戶。Fed 並沒有規定要買。","9-72":"題意：放款的特性。正解：以上皆是：最大類資產、收入主要來源、報酬最高。","9-73":"題意：放款帶給銀行什麼好處？正解：高報酬。放款流動性低、風險也較高。","9-74":"題意：銀行賣出具吸引力組合的＿，再用所得買不同特性的＿？正解：負債；資產。","9-75":"題意：銀行通常賣＿負債、買＿資產來賺錢？正解：短期；較長期。","9-76":"題意：資產轉換可以描述為？正解：借短放長。","9-77":"題意：新存戶開支票帳戶，銀行資產＿、負債＿？正解：增加；增加。","9-78":"題意：Jane 開 $100 支票給外州的姪子，她的銀行資產＿、負債＿？正解：減少；減少。存款減少，準備金也被扣走。","9-79":"題意：存 $50 現鈔到銀行。正解：以上皆是：負債增加 $50（存款）、資產增加 $50、準備金增加 $50。","9-80":"題意：同上，(a) 寫負債減少。正解：(b)(c)：資產與準備金增加 $50。","9-81":"題意：同上。正解：只有 (b)：資產增加 $50。準備金是增加不是減少。","9-82":"題意：同上。正解：以上皆是：資產、準備金、負債都增加 $50。","9-83":"題意：同上。正解：只有 (a)：資產增加 $50。準備金也是增加 $50，不會因準備率而少加。","9-84":"題意：同上。正解：只有 (c)：負債增加 $50。","9-85":"題意：其他不變，銀行收到存入支票的款項時。正解：托收中現金項目減少該金額（同時準備金增加），總資產不變。","9-86":"題意：同上。正解：以上皆是：托收中現金減少、總資產不變（只是換成準備金）、負債不變。","9-87":"題意：同上，(c) 說負債減少。正解：(a)(b)。","9-88":"題意：開在 First National 的 $10 支票存入 Citibank。正解：以上皆非。First National 負債與準備各減 $10，Citibank 負債與資產各增 $10。","9-89":"題意：同上。正解：Citibank 的負債增加 $10。","9-90":"題意：同上。正解：First National 的負債減少 $10。","9-91":"題意：同上。正解：(a)(b)：First National 負債減少、Citibank 負債增加。First National 準備是減少。","9-92":"題意：同上，(c) 改成準備金減少。正解：以上皆是。","9-93":"題意：存 $50 到 First National，又有一張 $100 支票在 Chemical Bank 兌現。正解：First National 準備金淨減 $50（＋50−100）。","9-94":"題意：同上。正解：(a)(b)：First National 負債淨減 $50、準備淨減 $50。Chemical 負債是增加 $100。","9-95":"題意：同上，(c) 改成 $100。正解：以上皆是。","9-96":"題意：同上。正解：只有 (a)：First National 負債減少 $50。","9-97":"題意：存入 $1,000,000、準備率 20%、不留超額準備全拿去放款。最後？正解：準備金增加 $200,000。資產與負債都增加 $1,000,000。","9-98":"題意：同上。正解：以上皆是：資產＋100 萬（準備 20 萬＋放款 80 萬）、負債＋100 萬、準備＋20 萬。","9-99":"題意：同上。正解：負債增加 100 萬。資產也是增加 100 萬，準備增加 20 萬。","9-100":"題意：存入 100 萬、準備率 20%、全部留作準備不放款。正解：(a)(b)：資產、負債各增加 100 萬。準備金增加的是 100 萬而不是 20 萬。","9-101":"題意：同上，(c) 改成「法定準備」增加 20 萬。正解：以上皆是。超額準備則增加 80 萬。","9-102":"題意：銀行經理人關心什麼？正解：以上皆是：低成本取得資金、分散資產降低風險、有足夠現金應付提領、維持適足資本。","9-103":"題意：銀行經理人的主要考量。正解：以上皆是：持有足夠準備應付流出、借給付高利率但信用好的人、以低成本取得資金。","9-104":"題意：存款 10 萬、準備率 20%、持有準備 3 萬，可承受多少存款流出？正解：$11,000 或 $5,000。流出 X 後須 3 萬−X ≥ 0.2(10 萬−X)，所以 X 最多 12,500。","9-105":"題意：同上，不必調整資產負債表的流出金額。正解：$8,000 或 $5,000，都在 12,500 以內。","9-106":"題意：存款 100 萬、準備率 20%、準備 30 萬，不必調整的流出金額。正解：5 萬或 10 萬。最多 (30−20)/0.8＝12.5 萬，15 萬超過。","9-107":"題意：同上。正解：5 萬或 7.5 萬。","9-108":"題意：存款 10 萬、準備率 20%、準備 4 萬，最多可承受多少流出？正解：$25,000。(4 萬 − 2 萬) ÷ 0.8。","9-109":"題意：存款 20 萬、準備率 20%、準備 8 萬，最多可承受多少流出？正解：$50,000。(8 萬 − 4 萬) ÷ 0.8。","9-110":"題意：存款 1000 萬、準備率 10%、準備 200 萬，哪一個流出會不夠？正解：120 萬。最多可承受 (200−100)/0.9≈111 萬。","9-111":"題意：超額準備大於存款流出時，流出的結果。正解：存款與準備金等額減少。","9-112":"題意：500 萬存款流出的立即效果。正解：存款與準備金各減少 500 萬。","9-113":"題意：流出後準備不足 300 萬，怎麼補足？正解：賣掉 300 萬證券換成準備金。增加放款或還 Fed 錢都會讓準備更少。","9-114":"題意：銀行如何保護自己不受存款流出干擾？正解：以上皆是：持有超額準備、賣證券、收回放款。","9-115":"題意：準備不足時，銀行通常先做什麼？正解：向其他銀行借款（聯邦資金市場），成本最低。","9-116":"題意：銀行怎麼減少放款總額？正解：(a)(b)：到期不續貸（收回放款）、把放款賣給其他銀行。不能賣給 Fed。","9-117":"題意：銀行應付存款流出，比較喜歡＿而不是＿？正解：向 Fed 借錢；賣放款。賣放款的成本很高。","9-118":"題意：決定超額準備、次級準備、向 Fed 與同業借款的最適組合，屬於？正解：流動性管理。","9-119":"題意：銀行持有超額與次級準備是為了？正解：以上皆是：避免倒閉、應付存款流出、符合準備要求。","9-120":"題意：同上，(c) 換成保證金要求。正解：(a)(b)。","9-121":"題意：同上，(a) 換成符合客戶期望。正解：(a)(b)。","9-122":"題意：銀行在什麼情況下會想持有更多超額準備？正解：以上皆非。預期存款流入、賣債或賣放款成本下降，都會讓銀行持有「較少」超額準備。","9-123":"題意：銀行在什麼情況下會持有較少超額準備？正解：預期近期有存款流入。賣債或賣放款成本上升反而要多持有。","9-124":"題意：銀行在什麼情況下會持有更多超額準備？正解：賣債的經紀佣金上升，臨時變現變貴，所以平時多留準備。","9-125":"題意：銀行持有什麼作為存款流出的保險？正解：以上皆是：超額準備、次級準備、權益資本。","9-126":"題意：存款流出的成本越＿，銀行想持有的超額準備越＿？正解：高；多。","9-127":"題意：超額準備、次級準備和＿都能防範最嚴重的流出後果（倒閉）？正解：銀行資本。","9-128":"題意：哪一項不能作為防止倒閉的保險？正解：房貸，流動性很低。","9-129":"題意：準備不足的銀行怎麼補足？正解：以上皆是：借聯邦資金、向 Fed 借、賣次級準備。","9-130":"題意：同上。正解：以上皆是：借聯邦資金、向他行借款、賣次級準備。","9-131":"題意：準備不足的銀行怎麼增加準備金？正解：收回放款。借出聯邦資金或買證券會讓準備更少。","9-132":"題意：First National 何時增加準備？正解：(a)(b)：別家銀行的支票存進來；向 Fed 借到貼現放款。償還 Fed 會減少準備。","9-133":"題意：資產管理的任務。正解：在控制風險、保留足夠流動性的前提下，追求最高報酬。","9-134":"題意：First National 何時增加準備？正解：(a)(b)：別行支票存入；向他行借入聯邦資金。借出資金會減少準備。","9-135":"題意：資產管理的目標。正解：買進高報酬、低風險的證券。","9-136":"題意：1980 年代虧損嚴重的銀行犯了什麼錯？正解：放款組合沒有分散，集中在特定產業或地區。","9-137":"題意：哪一項「不是」主動負債管理的結果？正解：銀行增加持有現金項目。負債管理讓銀行能少持有現金、多放款。","9-138":"題意：主動負債管理帶來哪些結果？正解：以上皆是：支票存款重要性下降、放款增加、更常使用聯邦資金市場。","9-139":"題意：關於現代負債管理的正確敘述。正解：(a)(b)：資產中放款比重提高；新工具讓銀行能快速取得資金。CD 並沒有大幅減少同業借款。","9-140":"題意：主動管理負債的銀行最可能如何補準備缺口？正解：借聯邦資金。","9-141":"題意：現代負債管理的結果。正解：更多發行定期存單（CD）來籌資。","9-142":"題意：銀行何時無力清償？正解：負債超過資產。","9-143":"題意：銀行的＿超過＿時，就是＿？正解：負債；資產；無力清償。","9-144":"題意：銀行＿的價值低於＿時會倒閉？正解：資產；負債。","9-145":"題意：銀行何時倒閉？正解：資產價值低於負債，變成無力清償。","9-146":"題意：銀行倒閉的定義。正解：無法履行對存戶的支付義務，也無法持有足夠準備滿足規定。","9-147":"題意：大量資本為什麼能防止倒閉？正解：資本可以吸收存款流出（或放款損失）造成的損失。","9-148":"題意：什麼情況下銀行較不容易倒？正解：持有更多超額準備。","9-149":"題意：什麼情況下銀行較容易倒？正解：以上皆是：政府證券少、大量存款流出、權益資本少。","9-150":"題意：什麼會提高倒閉機率？正解：大量存款流出。其他選項都會降低倒閉機率。","9-151":"題意：銀行資本的作用。正解：以上皆是：資產價值下跌時的緩衝；讓未受保存戶安心；讓借款客戶相信銀行不會因少數壞帳倒閉。","9-152":"題意：存戶希望銀行淨值＿，避免銀行在蒐集借款人資訊上＿？正解：高；投入不足。","9-153":"題意：和高淨值銀行相比，低淨值銀行較沒有誘因做能＿獲利的事？正解：較少；提升。淨值低時失去的少，較願冒險。","9-154":"題意：和＿淨值銀行相比，＿淨值銀行較沒有誘因確保獲利？正解：高；低。","9-155":"題意：存戶只拿固定報酬、銀行拿走超額利潤，存戶面臨什麼問題？正解：道德風險；銀行可能承擔過多風險。","9-156":"題意：銀行如何讓存戶相信它沒冒太多風險？正解：分散放款組合。","9-157":"題意：同上。正解：(a)(b)：分散放款、增加權益資本。","9-158":"題意：銀行如何表明它和存戶利益一致？正解：(a)(b)：維持高權益資本、分散放款。","9-159":"題意：如果沒有管制，銀行可能持有？正解：太少資本。資本少時股東報酬率較高。","9-160":"題意：支持最低資本要求的理由。正解：資本太少的銀行較容易倒，會把成本加在其他銀行（如擠兌傳染）。","9-161":"題意：稅後淨利 ÷ 權益資本。正解：股東權益報酬率（ROE）。","9-162":"題意：稅後淨利 ÷ 資產。正解：資產報酬率（ROA）。","9-163":"題意：每一元權益資本對應的資產金額。正解：權益乘數（EM），ROE＝ROA × EM。","9-164":"題意：在＿報酬率固定下，資本越＿，股東報酬越＿？正解：資產；高；少。","9-165":"題意：ROA 固定時。正解：資本越少，股東報酬（ROE）越高。","9-166":"題意：ROA 固定時。正解：(a)(b)：資本越少，股東報酬越高，但股東承擔的風險也越高。","9-167":"題意：1990–92 信用緊縮的原因。正解：(a)(b)：房地產跌價造成放款損失、侵蝕資本；監理提高資本要求。利率下跌不會提高利率風險。","9-168":"題意：同上，(a) 改成權益乘數下降。正解：只有 (b)：資本要求提高。資本因虧損下降時，權益乘數是上升而非下降。","9-169":"題意：信用差的人最想借錢，銀行面臨什麼問題？正解：逆選擇。","9-170":"題意：最高風險的借款人比最安全的更積極找銀行借錢。正解：逆選擇。","9-171":"題意：借款人拿到錢後更可能投資高風險計畫。正解：道德風險。","9-172":"題意：為解決逆選擇與道德風險而形成的放款原則。正解：以上皆是：篩選與監督、擔保品與補償性餘額、信用配給。","9-173":"題意：銀行如何篩選好壞借款人？正解：以上皆是：專精特定產業或地區、合約寫入限制性條款、蒐集正確的信用紀錄。","9-174":"題意：哪一件事看似奇怪，因為銀行沒有分散放款而增加風險？正解：專業放款（集中特定產業）。","9-175":"題意：從＿角度看專業放款很奇怪，但考慮＿問題就合理？正解：分散；逆選擇。專精才看得懂借款人。","9-176":"題意：貸款合約中禁止借款人從事特定高風險活動的條款。正解：限制性條款。","9-177":"題意：銀行承諾在一段期間內，以連動市場利率的利率提供一定額度貸款。正解：放款承諾。","9-178":"題意：長期往來關係與放款承諾的好處。正解：以上皆是：降低資訊蒐集成本、容易篩選好壞借款人、處理合約沒寫到的道德風險。","9-179":"題意：同上，(a) 改成「提高」資訊成本。正解：(b)(c)。","9-180":"題意：同 Q177。正解：放款承諾。","9-181":"題意：補償性餘額的意義。正解：以上皆是：是一種擔保品；借款人須留在銀行支票帳戶的最低金額；銀行可藉此觀察借款人付款情況。","9-182":"題意：想監督商業借款人付款行為以防道德風險，銀行會要求什麼？正解：在銀行的支票帳戶留補償性餘額。","9-183":"題意：哪一種降低道德風險的方法在美國不合法？正解：要求企業讓銀行人員擔任其董事。","9-184":"題意：借款人願付現行或更高利率，銀行仍拒絕貸款。正解：信用配給。","9-185":"題意：同上，但選項沒有「信用配給」。正解：以上皆非。","9-186":"題意：信用配給的情形。正解：兩種都是：即使願付高利率也不借，或借得比申請的少。","9-187":"題意：1991 年商業不動產低迷，許多銀行乾脆停止放款。正解：信用配給。","9-188":"題意：貸款越大，借款人越有誘因做壞事，所以銀行會？正解：給比申請金額小的貸款（信用配給）。","9-189":"題意：銀行給的貸款比借款人要的少。正解：信用配給。","9-190":"題意：信用風險管理工具。正解：以上皆是：補償性餘額、擔保品、限制性條款。","9-191":"題意：同上，(c) 換成利率交換。正解：(a)(b)。利率交換管理的是利率風險，不是信用風險。","9-192":"題意：和利率變動不確定性有關的風險。正解：利率風險。","9-193":"題意：利率敏感負債多於資產，利率＿會＿獲利？正解：上升；減少。付出的利息增加得比收到的多。","9-194":"題意：同上。正解：利率上升；減少獲利。","9-195":"題意：利率敏感資產多於負債，利率＿會＿獲利？正解：上升；增加。","9-196":"題意：利率敏感資產＿於負債時，利率＿會增加獲利？正解：多；上升。","9-197":"題意：利率敏感負債＿於資產時，利率＿減少獲利、利率＿增加獲利？正解：多；上升；下降。","9-198":"題意：利率敏感資產＿於負債時，利率＿減少獲利、利率＿增加獲利？正解：多；下降；上升。","9-199":"題意：利率敏感資產與負債的差額叫什麼？正解：缺口（gap）。","9-200":"題意：缺口＋2000 萬，利率下降 5 個百分點，獲利如何？正解：減少 100 萬（2000 萬 × 5%）。","9-201":"題意：缺口＋2000 萬，利率上升 5 個百分點。正解：增加 100 萬。","9-202":"題意：缺口−3000 萬，利率上升 5 個百分點。正解：減少 150 萬。","9-203":"題意：用缺口 × 利率變動衡量獲利敏感度。正解：基本缺口分析。","9-204":"題意：把缺口分成幾個期間各自乘利率變動。正解：到期期間籃子法（maturity bucket approach）。","9-205":"題意：利率敏感資產 2000 萬、負債 5000 萬，利率升 5 個百分點。正解：減少 150 萬。缺口−3000 萬 × 5%。","9-206":"題意：資產存續期間 5 年、負債 3 年，利率升 5 個百分點，淨值變化？正解：減少相當於資產的 10%。資產跌 25%、負債跌 15%（資產負債皆 1 億）。","9-207":"題意：利率敏感資產 4000 萬、負債 5000 萬，利率升 5 個百分點。正解：減少 50 萬。缺口−1000 萬 × 5%。","9-208":"題意：資產存續期間 4 年、負債 3 年，利率升 5 個百分點。正解：淨值減少相當於資產的 5%（−20% ＋ 15%）。","9-209":"題意：存續期間分析比較什麼？正解：資產的平均存續期間與負債的平均存續期間。","9-210":"題意：預期利率上升，銀行會？正解：(a)(b)：做短期放款、買短期債券，到期後能以更高利率再投資。","9-211":"題意：預期利率下降，銀行會？正解：買長期債券，鎖住目前較高的利率。","9-212":"題意：同上。正解：買長期債券。","9-213":"題意：預期利率上升，銀行會？正解：買短期債券。長期資產在利率上升時跌價較多。","9-214":"題意：預期利率上升，現在最好做什麼？正解：賣長期定期存單，把負債成本鎖在目前較低利率。","9-215":"題意：預期利率下降，現在最好做什麼？正解：拉長資產的存續期間，鎖住現在的高收益。","9-216":"題意：怎麼降低利率風險？正解：縮短資產存續期間（提高利率敏感度），或拉長負債存續期間。","9-217":"題意：同上。正解：縮短資產的存續期間，或拉長負債的存續期間。","9-218":"題意：哪些工具幫助降低利率風險？正解：以上皆是：利率交換、金融期貨、債務工具的選擇權。","9-219":"題意：表外業務的例子。正解：以上皆是：放款出售、外匯交易、金融期貨交易。","9-220":"題意：表外業務的例子。正解：放款出售。放款與同業借款都會列在資產負債表上。","9-221":"題意：銀行賣出放款的現金流。正解：(a)(c)：把放款移出資產負債表，通常以略高於本金的價格賣出、有獲利。","9-222":"題意：從事表外業務的銀行可能？正解：以上皆是：增加獲利、降低風險（避險），也可能增加風險（投機）。","9-223":"題意：銀行的交易員面臨什麼問題？正解：委託代理問題。交易員可能為自己利益冒過大風險。","9-224":"題意：銀行交易部門試圖猜中市場走勢。正解：投機。","9-225":"題意：違規交易員讓銀行破產的原因。正解：沒有維持適當的內部控制。","9-226":"題意：怎麼降低交易業務的委託代理問題？正解：建立內控，把交易與記帳分開。","9-227":"題意：用統計模型計算某期間最大損失。正解：風險值（value-at-risk）法。","9-228":"題意：資產 2 億、存續期間 2.5；負債 1.9 億、存續期間 1.05；利率從 5% 升到 6%。正解：題庫答 480 萬。依公式 −(2.5×200 − 1.05×190)×1%/1.05 ≈ 286 萬，題庫答案有疑義，考試以老師說法為準。","9-229":"題意：同上，存續期間缺口是多少？正解：1.5 年。2.5 − (190/200)×1.05 ≈ 1.5。","9-230":"題意：存續期間缺口 2 年，利率從 9% 升到 10%，淨值減少多少？正解：約資產的 1.8%。−2 × 1% ÷ 1.09 ≈ −1.8%。","9-231":"題意：銀行懷疑 100 萬放款會變呆帳。正解：(a)(b)：可從盈餘提列 100 萬備抵呆帳，報告的盈餘也跟著減少。資產不會立刻減少。","9-232":"題意：ROA 與 ROE 的關係。正解：ROE 大於 ROA，因為權益資本小於資產。","9-233":"題意：（利息收入 − 利息支出）÷ 資產。正解：淨利差（net interest margin）。","10-1":"題意：美國現代商業銀行體系始於哪一家銀行？正解：1782 年在費城設立的北美銀行（Bank of North America）。","10-2":"題意：早期銀行業的主要爭議。正解：應由聯邦政府還是州政府核發銀行執照。","10-3":"題意：負責整體經濟貨幣與信用總量的政府機構。正解：中央銀行。","10-4":"題意：因州立銀行弊端與 1812 年戰爭籌款需要，國會成立了什麼？正解：1816 年的第二合眾國銀行。","10-5":"題意：誰拒絕讓第二合眾國銀行續發執照？正解：安德魯．傑克森總統。","10-6":"題意：為消除州立銀行弊端，＿建立了聯邦發照的銀行系統，由＿監理？正解：1863 年國家銀行法；貨幣監理署（OCC）。","10-7":"題意：國家銀行法對州銀行券課重稅，州銀行怎麼存活下來？正解：改以吸收存款取得資金，不再靠發行銀行券。","10-8":"題意：認為銀行倒閉常因詐欺或資本不足，促成了哪項立法？正解：1863 年國家銀行法。","10-9":"題意：1863 年以前的情況。正解：(a)(b)：銀行靠發行銀行券取得資金；由州政府發照。當時沒有聯邦銀行享有監理優勢。","10-10":"題意：1863 年以前。正解：銀行靠發行銀行券取得資金。","10-11":"題意：1863 年以前。正解：以上皆非。Fed 1913 年才成立，OCC 也是 1863 年後才有。","10-12":"題意：1863 年國家銀行法及其修正案做了什麼？正解：(a)(b)：建立聯邦發照的銀行系統、設立貨幣監理署。Fed 那時還不存在。","10-13":"題意：銀行可在州、聯邦或兩者層級受監理的制度。正解：雙軌銀行制度（dual banking system）。","10-14":"題意：雙軌制度中，受＿和＿監理的銀行並存？正解：聯邦政府；州政府。","10-15":"題意：美國銀行體系為何稱為雙軌？正解：同時受州與聯邦政府監理。","10-16":"題意：1913 年聯邦準備法規定什麼？正解：國家銀行必須加入聯邦準備體系。","10-17":"題意：哪個機構單獨監理銀行控股公司？正解：聯準會（Fed）。","10-18":"題意：非 Fed 會員的州銀行，最可能由誰檢查？正解：FDIC。","10-19":"題意：聯邦準備法要求所有＿銀行加入 Fed，＿銀行可自行選擇？正解：國家銀行；州銀行。","10-20":"題意：大蕭條後銀行倒閉大幅減少，最主要原因是？正解：成立 FDIC，存款保險阻止了擠兌。","10-21":"題意：哪個機構核發國家銀行執照？正解：貨幣監理署（OCC）。","10-22":"題意：銀行監理機關包括？正解：以上皆是：OCC、Fed、FDIC。","10-23":"題意：FDIC 成立時，Fed 會員銀行＿買存保，非會員銀行＿買？正解：必須；可以選擇。","10-24":"題意：同上的完整敘述。正解：會員銀行必須投保，非會員商業銀行可以選擇投保。","10-25":"題意：1999 年廢除前，Glass-Steagall 法禁止什麼？正解：商業銀行承銷與買賣公司證券。","10-26":"題意：同上。正解：(a)(b)：商業銀行不得承銷公司證券；投資銀行不得經營商業銀行業務。銀行可以賣新發行的政府證券。","10-27":"題意：分離投資銀行與商業銀行、1999 年廢除的法律。正解：Glass-Steagall 法。","10-28":"題意：關於美國銀行監理的正確敘述。正解：以上皆是：OCC 主管約 4000 家國家銀行；Fed 與州監理機關共同負責約 1000 家 Fed 會員州銀行；Fed 單獨監理銀行控股公司。","10-29":"題意：同上。正解：只有 (b)。OCC 主管的是國家銀行，銀行控股公司歸 Fed。","10-30":"題意：影響金融創新程度與時機的因素。正解：以上皆是：技術、市場狀況、法規的變化。","10-31":"題意：繁重法規、利率與通膨上升可以解釋什麼？正解：1960、70 年代銀行業金融創新的快速發展。","10-32":"題意：利率風險升高對金融創新的影響。正解：增加對金融創新的需求（需要避險工具）。","10-33":"題意：1970 年以來金融市場最重大的變化。正解：利率波動大幅增加。","10-34":"題意：1970 年以來改變金融商品需求最重要的環境變化。正解：利率波動大幅增加。","10-35":"題意：1950 年代三個月國庫券利率在 1%–3.5%，1980 年代在＿到＿？正解：5% 到 15%。","10-36":"題意：1970 年代在＿到＿？正解：4% 到 11.5%。","10-37":"題意：利率大幅波動造成什麼？正解：以上皆是：證券持有人大賺大賠、投資報酬更不確定、利率風險更高。","10-38":"題意：機動利率房貸的特性。正解：利率下降時對屋主有利。利率上升時屋主月付會增加。","10-39":"題意：同上。正解：以上皆非。利率上升時屋主月付增加；利率下降時金融機構收入下降；仍有很多人選固定利率房貸。","10-40":"題意：同上。正解：(a)(b)：利率下降時屋主受益；降低金融機構的利率風險。屋主反而承擔利率上升風險。","10-41":"題意：同上。正解：(a)(b)：利率上升時保護金融機構收入；利率下降時屋主受益。","10-42":"題意：首購族什麼情況會偏好固定利率房貸？正解：以上皆是：收入有限怕利率上升時付不出、不想承擔利率風險、預期利率會上升並維持高檔。","10-43":"題意：約定在特定日期以特定未來價格交付標準化商品的協議。正解：期貨契約。","10-44":"題意：幫助投資人與機構規避利率風險的工具。正解：金融衍生性商品。","10-45":"題意：新電腦技術對金融創新的影響。正解：降低金融創新的成本（供給面）。","10-46":"題意：刺激金融創新的供給條件變化，最重要來源是？正解：電腦與通訊技術進步。","10-47":"題意：信用卡最早出現在什麼時候？正解：第二次世界大戰之前。","10-48":"題意：發卡機構的收入來源。正解：(a)(b)：對持卡人放款的利息、商店支付的手續費。","10-49":"題意：AT&T、GM 進入信用卡業，顯示什麼？正解：信用卡業務的獲利提高。","10-50":"題意：金融卡（debit card）和信用卡的差別。正解：信用卡是借款；金融卡消費時立刻從帳戶扣款。","10-51":"題意：電子銀行設施的優點。正解：以上皆是：降低銀行成本、方便客戶、在國外容易取得外幣。","10-52":"題意：ATM 的優點。正解：以上皆是：比櫃員便宜、據點比分行多、24 小時營業、出國容易提領外幣。","10-53":"題意：ATM 的成本。正解：比櫃員便宜，所以銀行可能對使用 ATM 收較低費用以鼓勵使用。","10-54":"題意：電腦技術成本下降促成了什麼？正解：(a)(b)：家庭銀行與網路銀行。","10-55":"題意：電腦成本下降讓什麼成為現實？正解：網路（虛擬）銀行。","10-56":"題意：因新電腦技術而變得可行的金融服務。正解：(a)(b)：信用卡、電子銀行。支票帳戶早就存在。","10-57":"題意：客戶怎麼看網路銀行？正解：容易出現較多技術問題。","10-58":"題意：網路銀行的缺點。正解：客戶擔心線上交易的安全性。","10-59":"題意：墮落天使與垃圾債券的差別。正解：(a)(b)：垃圾債券指新發行的低評等債；墮落天使指原本投資級、後被降到 Baa 以下的債券。","10-60":"題意：同上。正解：垃圾債券是新發行的低評等債券。(a)(b) 把兩者定義對調了。","10-61":"題意：同上。正解：垃圾債券是新發行的低評等債；墮落天使是被降評到 Baa 以下的舊債。","10-62":"題意：新發行、評等低於投資級的高收益債。正解：垃圾債券。","10-63":"題意：1977 年開創為非投資級公司公開發行垃圾債券的人。正解：Michael Milken。","10-64":"題意：1970 年以來商業本票市場快速成長的原因。正解：資訊科技進步，更容易篩選信用風險。商業本票有違約風險，也沒有 FDIC 保險。","10-65":"題意：同上。正解：(a)(b)：資訊科技進步、貨幣市場基金成長（它們大量購買商業本票）。","10-66":"題意：把缺乏流動性的金融資產轉成可交易資本市場工具。正解：證券化。","10-67":"題意：同上。正解：證券化。","10-68":"題意：把一組房貸或車貸包裝成可交易工具。正解：證券化。","10-69":"題意：房貸與車貸證券化的推動力。正解：電腦技術進步。","10-70":"題意：Edward Kane 認為銀行業是最＿的產業之一，所以特別容易出現＿？正解：受管制；鑽漏洞（loophole mining）。","10-71":"題意：鑽漏洞指什麼？正解：為規避法規而進行的金融創新。","10-72":"題意：銀行經理人怎麼看準備金要求？正解：一種對存款課的稅。","10-73":"題意：持有準備金對銀行的成本。正解：放款利率 × 準備金金額，也就是準備金沒拿去放款的機會成本。","10-74":"題意：規避準備要求可以讓銀行？正解：(a)(c)：增加利息收入、增加利潤。","10-75":"題意：人們把錢從金融機構領出、追求更高利率。正解：脫媒（disintermediation）。","10-76":"題意：貨幣市場共同基金的特性。正解：功能像付息的支票帳戶。法律上不是存款，不受準備要求。","10-77":"題意：每天結束把企業支票帳戶超過某金額的部分轉投隔夜證券。正解：自動轉存帳戶（sweep account）。","10-78":"題意：準備要求對許多銀行不再有約束力，原因是？正解：自動轉存帳戶的發展。","10-79":"題意：自動轉存帳戶的影響。正解：讓準備金要求對許多銀行不再有約束力。","10-80":"題意：1974 年以來商業銀行作為非金融借款人資金來源的地位。正解：大幅縮小，從約 40% 降到 1999 年的約 30%。","10-81":"題意：同上，數字題。正解：約 40% 降到約 30%。","10-82":"題意：同上。正解：題庫答「縮小；40%；20%」。和前兩題的 30% 不一致，屬不同版本數據，考試以老師說法為準。","10-83":"題意：儲蓄機構作為資金來源的地位。正解：從 1970 年代末的 20% 以上降到 1999 年的 10% 以下。","10-84":"題意：同上，數字題。正解：20% 以上降到 10% 以下。","10-85":"題意：1980 年以來的銀行獲利。正解：銀行以表外業務收入彌補傳統業務獲利下滑。","10-86":"題意：金融創新對銀行的影響。正解：銀行的成本優勢與收入優勢同時下降。","10-87":"題意：脫媒的成因。正解：存款利率上限加上通膨推高市場利率，資金流向其他工具。","10-88":"題意：銀行脫媒經驗說明了什麼？正解：市場會發明替代品來規避高成本的管制。","10-89":"題意：脫媒的影響。正解：降低銀行的成本優勢（低成本存款流失）。","10-90":"題意：銀行如何回應脫媒？正解：支持取消利率管制，才能和其他工具競爭資金。","10-91":"題意：1960、70 年代市場利率上升加上存款利率上限。正解：以上皆是：短期讓房貸機構有低成本資金；最終造成存款流出；引發規避利率上限的創新。","10-92":"題意：支票存款占銀行資金來源比重，從超過＿降到＿以下？正解：60%；15%。","10-93":"題意：同上。正解：支票存款從超過負債的 60% 降到 15% 以下。","10-94":"題意：過去三十年降低銀行「成本優勢」的發展。正解：(a)(b)：取消 Q 規則上限、貨幣市場基金的競爭。證券化影響的是收入優勢。","10-95":"題意：同上。正解：(a)(b)。垃圾債券影響的是收入優勢。","10-96":"題意：同上。正解：只有 (b)：貨幣市場基金的競爭。垃圾債券與證券化影響的是收入優勢。","10-97":"題意：降低銀行「收入優勢」的發展。正解：(b)(c)：垃圾債券市場成長、證券化。貨幣市場基金影響的是成本面。","10-98":"題意：同上。正解：(a)(b)：商業本票市場、垃圾債券市場成長。取消 Q 規則影響的是成本面。","10-99":"題意：商業本票相對於工商業貸款的規模，從＿增加到超過＿？正解：5%；20%。","10-100":"題意：銀行怎麼維持獲利？正解：(a)(b)：做風險更高的放款（如商業不動產）、拓展表外業務。","10-101":"題意：傳統銀行業務獲利下降的結果。正解：以上皆是：銀行倒閉、合併收購、冒更多險、增加表外業務。","10-102":"題意：全球傳統銀行業務衰退的原因。正解：(a)(b)：解除管制、資訊科技進步。","10-103":"題意：美國銀行家數這麼多的主因。正解：過去限制開設分行的法規。","10-104":"題意：1927 年麥克法登法的內容。正解：實質上禁止銀行跨州設立分行。","10-105":"題意：禁止跨州設分行、要求國家銀行遵守所在州分行規定的法律。正解：麥克法登法。","10-106":"題意：限制性法規導致美國？正解：銀行數量比其他工業國家多太多。","10-107":"題意：美國銀行數量多代表什麼？正解：銀行業缺乏競爭（法規保護小銀行）。","10-108":"題意：美國銀行業缺乏競爭的原因。正解：19 世紀的民粹主義情緒，擔心大銀行壟斷。","10-109":"題意：成立銀行控股公司的好處。正解：以上皆是：在禁止設分行時擁有多家銀行、提供投資顧問、在他州承作放款服務。","10-110":"題意：關於銀行控股公司的正確敘述。正解：以上皆是：擁有幾乎所有大銀行、過去三十年大幅成長、超過 90% 的商業銀行存款在其旗下。","10-111":"題意：銀行控股公司的優勢。正解：以上皆是：規避分行限制、從事信用卡等相關業務、提供資料處理與租賃服務。","10-112":"題意：同上，(a) 說擁有的大銀行很少。正解：只有 (b)：過去三十年大幅成長。","10-113":"題意：同上，(a) 說擁有幾乎所有大銀行。正解：(a)(b)。麥克法登法並未阻止控股公司擁有多家銀行。","10-114":"題意：共用電子銀行設施的影響。正解：分行限制的阻礙變小。","10-115":"題意：關於共用電子設施的敘述。正解：(a)(b)：多數法院認為技術上受分行限制；以交易手續費方式付費就不算分行。銀行自有的設施仍受限制。","10-116":"題意：1980 年代與 90 年代初的倒閉與合併，讓商業銀行從約＿家減到約＿家？正解：15,000；8,500。","10-117":"題意：近年銀行家數減少的主因。正解：合併與收購。","10-118":"題意：規模可比貨幣中心銀行、但不在貨幣中心城市的銀行控股公司。正解：超區域銀行。","10-119":"題意：用同一資源提供不同產品與服務的能力。正解：範疇經濟。","10-120":"題意：範疇經濟的商業用語。正解：綜效（synergies）。","10-121":"題意：推翻跨州銀行禁令的近期立法。正解：1994 年 Riegle-Neal 法。","10-122":"題意：唯一沒有真正全國性分行銀行體系的國家。正解：美國。","10-123":"題意：日本人口約美國一半，銀行家數是美國的多少？正解：約 1%。","10-124":"題意：專家預測美國銀行業未來結構。正解：仍會有數千家銀行，不會只剩幾百或十家。","10-125":"題意：銀行整併可能帶來什麼？正解：競爭增加（大銀行跨入原本受保護的地方市場）。","10-126":"題意：反對全國性銀行的人擔心什麼？正解：(a)(b)：社區銀行消失、對小企業放款減少。","10-127":"題意：全國性銀行的好處。正解：以上皆是：競爭增加、放款組合更分散、倒閉減少。","10-128":"題意：全國性銀行為何能減少倒閉？正解：放款組合可以跨州分散。","10-129":"題意：銀行整併的結果。正解：銀行規模變大。","10-130":"題意：銀行體系演變的預期。正解：大型銀行的數量與重要性增加。","10-131":"題意：推翻 Glass-Steagall 法的立法。正解：1999 年 Gramm-Leach-Bliley 法。","10-132":"題意：近年商業銀行被允許做什麼？正解：以上皆是：投資不動產、進入部分保險市場、承銷股票。","10-133":"題意：商業銀行在單一法人內提供銀行、證券、保險全套服務。正解：綜合銀行制度（universal banking）。","10-134":"題意：商業銀行承銷證券但由子公司分別經營，銀行與保險通常不合辦。正解：英式綜合銀行。","10-135":"題意：日本證券法第 65 條逐步放寬後，日本銀行越來越像？正解：英式綜合銀行（英國、加拿大、澳洲）。","10-136":"題意：美日銀行體系的主要差異。正解：日本銀行可大量持有企業股權，美國銀行不行。","10-137":"題意：同上。正解：(b)(c)：日本銀行可持有企業股權；銀行控股公司在日本（當時）不合法。","10-138":"題意：監理儲貸協會的機構。正解：聯邦住宅貸款銀行體系（FHLBS）。","10-139":"題意：監理儲貸協會的機構包括。正解：以上皆是：OTS、FDIC、FHLBS。","10-140":"題意：和銀行不同，自 1980 年起可在全州設分行的是？正解：聯邦發照的儲貸協會。","10-141":"題意：儲蓄機構包括。正解：互助儲蓄銀行。","10-142":"題意：信用合作社的基本特性。正解：由具共同關係（如同公司、同學校）的成員組成。","10-143":"題意：國際銀行業快速成長的原因。正解：世界貿易快速成長。","10-144":"題意：國際銀行業驚人成長的原因。正解：(a)(b)：國際貿易成長、美國銀行想擴張。不是課本列的逃避國內法規。","10-145":"題意：哪一個「不是」國際銀行業擴張的原因？正解：以上皆非，三者都是原因。","10-146":"題意：哪一個是原因？正解：以上皆是：國際貿易成長、跨國企業成長、美國銀行想擴張。","10-147":"題意：歐洲美元市場的誕生歸功於哪國？正解：蘇聯，它把美元存在倫敦以免被美國凍結。","10-148":"題意：歐洲銀行裡以美元計價、用於國際交易的存款。正解：歐洲美元。","10-149":"題意：歐洲美元市場的主要中心。正解：倫敦。","10-150":"題意：歐洲美元是什麼？正解：存在美國境外銀行的美元存款。","10-151":"題意：持有歐洲美元的理由。正解：美元在國際交易中被廣泛使用。歐洲美元沒有 FDIC 保險、最低交易額很大、管制很少。","10-152":"題意：美國銀行設海外分行的好處。正解：境外的歐洲美元存款不受準備金要求。","10-153":"題意：美國銀行的海外分行主要在哪裡？正解：拉丁美洲、遠東、加勒比海與倫敦。","10-154":"題意：在美國經營的國際金融業務分行（IBF）。正解：以上皆是：收外國人定存、不受準備與利率限制；只放款給外國人；在政府鼓勵下快速成長。","10-155":"題意：1978 年國際銀行法通過後，外國銀行的競爭優勢。正解：減少了，因為外國銀行開始受同樣規範。","11-1":"題意：FDIC 是為防止倒閉而設，但它的存在會鼓勵銀行怎麼做？正解：承擔過多風險（道德風險），因為存戶有保障就不監督銀行。","11-2":"題意：1920 年代景氣好的時候，銀行倒閉的情形。正解：很常見，平均每年約 600 家。","11-3":"題意：銀行在「順序服務限制」下運作，代表什麼？正解：最先來提領的存戶最有機會拿回錢。","11-4":"題意：危機時存戶為何搶著先提款？正解：銀行依順序服務限制運作，先到先領。","11-5":"題意：存戶分辨不出好銀行與壞銀行。正解：資訊不對稱問題。","11-6":"題意：因資訊不對稱，一家銀行倒閉引發其他銀行擠兌。正解：傳染效應。","11-7":"題意：傳染效應指什麼？正解：一家銀行倒閉會加速其他銀行倒閉，連健全銀行也可能被擠兌。","11-8":"題意：存款保險制度會造成什麼？正解：(a)(b)：吸引愛冒險的人進入銀行業（逆選擇）、鼓勵經理人冒更多險（道德風險）。存戶監督誘因是「降低」。","11-9":"題意：「清償法」與「購買與承接法」的主要差別。正解：用購買與承接法時，FDIC 實際上保障所有存款，不只 10 萬美元以內。","11-10":"題意：同上。正解：(b)(c)：購買與承接法保障全部存款；銀行規模大、怕存戶損失引發連鎖倒閉時，FDIC 較不會用清償法。","11-11":"題意：同上。正解：(a)(b)：購買與承接法保障全部存款；大銀行倒閉時較常用購買與承接法。","11-12":"題意：交易一方有誘因做出對另一方不利的事。正解：道德風險。","11-13":"題意：保險為什麼有道德風險？正解：有了保險，被保險人更願意冒險。","11-14":"題意：存戶只拿固定報酬、銀行拿走剩餘利潤，存戶面臨＿問題，銀行可能冒＿風險？正解：道德風險；過多。","11-15":"題意：存款保險為何可能讓存戶更需要保護？正解：有存保的銀行會比沒存保時冒更大的風險。","11-16":"題意：開車技術差的人最搶著買碰撞險。正解：逆選擇問題。","11-17":"題意：存款保險的影響。正解：以上皆是：吸引愛冒險的人經營銀行、鼓勵經理人冒險、降低存戶監督銀行的誘因。","11-18":"題意：存款保險在哪些國家運作良好？正解：以上皆是：有法治傳統、有效監理金融體系、政府清廉。","11-19":"題意：存款保險在全球普及的經驗說明什麼？正解：存款保險只有在制度環境健全時才運作良好。","11-20":"題意：存款保險在哪些國家運作不佳？正解：制度環境薄弱的國家。","11-21":"題意：FDIC 認定銀行大到不能倒時，會用＿法，＿存戶受損？正解：購買與承接法；沒有任何。","11-22":"題意：大到不能倒政策的問題。正解：提高大銀行的道德風險誘因。","11-23":"題意：大到不能倒政策使＿銀行承擔＿風險？正解：大；更多。","11-24":"題意：大到不能倒使大銀行承擔＿風險，倒閉＿可能？正解：更多；更。","11-25":"題意：大到不能倒政策＿大銀行的＿誘因？正解：提高；道德風險。","11-26":"題意：大到不能倒政策的影響。正解：以上皆是：加重道德風險、小銀行較難吸引大額存款、對小銀行大額存戶不公平。","11-27":"題意：同上。正解：以上皆是。","11-28":"題意：同上，(b) 說「大」銀行處於劣勢。正解：(a)(c)。處於劣勢的是小銀行。","11-29":"題意：同上，(c) 說「改善」道德風險。正解：(a)(b)。大到不能倒會加重道德風險。","11-30":"題意：FDIC 為何在 1984 年接管而非清算 Continental Illinois？正解：認為它大到不能倒。","11-31":"題意：Continental Illinois 案中，貨幣監理署主張什麼？正解：最大的 11 家銀行大到不能倒。","11-32":"題意：大到不能倒的觀點解釋了什麼？正解：FDIC 處理大型倒閉銀行時採用購買與承接法。","11-33":"題意：FDIC 為避免金融體系動盪而保障所有存款時，用哪一種方法？正解：購買與承接法。","11-34":"題意：FDIC 認定大到不能倒時。正解：用購買與承接法，實際上保障所有存款，包括超過 10 萬美元的部分。","11-35":"題意：大銀行倒閉時，未受保存款為何仍被保障？正解：FDIC 安排健全銀行購買倒閉銀行並承接所有存款。","11-36":"題意：金融整併為何讓銀行監理更困難？正解：(a)(b)：大到不能倒的銀行變多；政府安全網延伸到新業務。","11-37":"題意：銀行倒閉的＿成本大於銀行的＿成本，所以銀行可能持有太高風險的資產？正解：社會；私人。","11-38":"題意：監理機關如何降低銀行資產組合風險？正解：(a)(b)：限制特定類別或單一借款人的放款額度、禁止持有普通股等高風險資產。","11-39":"題意：銀行為何不想持有太多資本？正解：(a)(b)：不必完全承擔倒閉成本；資本越少，股東權益報酬率越高。","11-40":"題意：大量資本為何有助防止倒閉？正解：可以吸收存款流出等造成的損失。","11-41":"題意：什麼情況下銀行較不容易倒閉？正解：銀行資本較多。","11-42":"題意：槓桿比率的定義。正解：資本 ÷ 總資產。","11-43":"題意：銀行資本要求包括什麼？正解：以上皆是：槓桿比率、風險基礎資本要求、銀行自己的風險模型。","11-44":"題意：資本充足的銀行倒閉時損失＿，所以冒險可能性＿？正解：較多；較低。","11-45":"題意：表外業務的特性。正解：帶來手續費收入，但會增加銀行風險。","11-46":"題意：資本要求的第一種形式。正解：以槓桿比率為基礎，資本 ÷ 總資產。","11-47":"題意：第二種形式。正解：與表外業務連結的風險基礎資本要求。","11-48":"題意：第三種形式。正解：涵蓋交易業務風險的資本要求。","11-49":"題意：1988 年巴塞爾協定的結果。正解：增加了冒險行為（因監理套利）。","11-50":"題意：1988 年巴塞爾協定的目的。正解：國際間統一銀行資本要求。","11-51":"題意：巴塞爾協定的明定目的。正解：(a)(b)：協調各國對資本、風險評估與資本適足標準的定義；讓資本要求與業務風險連動。","11-52":"題意：哪一個「不是」巴塞爾會議的目的？正解：設計防止國際銀行勾結的監督機制。","11-53":"題意：巴塞爾協定的內容。正解：(a)(c)：資產與表外業務依信用風險分類；總資本至少為風險調整後資產的 8%。核心資本要求是 4%，不是 10%。","11-54":"題意：巴塞爾協定下，資本要求最高的資產。正解：商業本票（100% 風險權數）。","11-55":"題意：下列何者資本要求最低？正解：政府機構證券（20% 權數）。","11-56":"題意：下列何者資本要求最低？正解：政府證券（0% 權數）。","11-57":"題意：保留高風險資產、移出同資本要求的低風險資產。正解：監理套利。","11-58":"題意：銀行怎麼做監理套利？正解：保留高風險資產、移出資本要求相同的低風險資產。","11-59":"題意：因監理套利，巴塞爾風險基礎資本要求可能造成什麼？正解：銀行冒更多風險。","11-60":"題意：發照主要處理＿問題，定期檢查主要減少＿問題？正解：逆選擇；道德風險。","11-61":"題意：發照處理＿，限制資產持有減少＿？正解：逆選擇；道德風險。","11-62":"題意：誰負責檢查銀行？正解：以上皆是：OCC、Fed、FDIC。","11-63":"題意：檢查銀行的聯邦機構包括。正解：(a)(c)：Fed、OCC。國稅局不檢查銀行經營。","11-64":"題意：定期檢查與限制資產能間接減少＿問題，因為愛冒險的人較不想進入銀行業？正解：逆選擇。","11-65":"題意：同上，填動詞。正解：減少；被勸退。","11-66":"題意：定期檢查直接減少＿，也間接減少＿？正解：道德風險；逆選擇。","11-67":"題意：監理如何減少逆選擇與道德風險？正解：以上皆是：發照防止壞人掌控銀行、禁止持有普通股等高風險資產、高資本要求提高股東的倒閉成本。","11-68":"題意：監理機關如何讓銀行與存戶的誘因一致？正解：以上皆是：維持高權益資本、分散放款、接受定期檢查。","11-69":"題意：監理機關如何讓存戶相信銀行沒冒太多風險？正解：要求銀行分散放款組合。","11-70":"題意：目前對風險管理的監理做法。正解：評估銀行風險管理流程是否健全，而不只看資產負債表。","11-71":"題意：銀行間的競爭。正解：會鼓勵銀行冒更多險以維持獲利。","11-72":"題意：減少銀行競爭的法規。正解：(a)(b)：分行限制、禁止非銀行機構經營銀行業務。","11-73":"題意：形塑目前監理體系的主要動機。正解：確保銀行體系健全。","11-74":"題意：規定商業銀行與投資銀行分離的法律。正解：Glass-Steagall 法。","11-75":"題意：1980 年存款機構解除管制及貨幣控制法的內容。正解：全國開放 NOW 帳戶。","11-76":"題意：同上。正解：以上皆是：開放 NOW 帳戶、統一準備要求、逐步取消存款利率上限。","11-77":"題意：為阻止儲貸與互助儲蓄銀行減少，1982 年 Garn-St. Germain 法開放了什麼？正解：貨幣市場存款帳戶（MMDA）。","11-78":"題意：Garn-St. Germain 法的影響。正解：讓銀行體系更有競爭力。","11-79":"題意：1981–1990 年關閉 1202 家銀行，倒閉率約是 1934–1980 年的幾倍？正解：約十倍。","11-80":"題意：1980 年代道德風險與逆選擇問題為何突出？正解：以上皆是：解除管制讓儲貸有更多冒險管道、金融創新擴大冒險範圍、存款保險額度從 4 萬提高到 10 萬美元。","11-81":"題意：同上，(c) 寫成保額「降低」。正解：(a)(b)。","11-82":"題意：1980 年代高風險銀行與儲貸靠什麼快速擴張？正解：以上皆是：存保額度提高到 10 萬、取消 Q 規則利率上限、擴大冒險範圍的金融創新。","11-83":"題意：1980 年代銀行危機早期，金融機構特別受到什麼打擊？正解：(a)(b)：1979 年底到 1981 年利率急升、1981–82 年嚴重衰退。物價並沒有急跌。","11-84":"題意：同上，(a) 寫利率下降。正解：只有 (b)：1981–82 年的嚴重衰退。","11-85":"題意：1982 年底約一半儲貸無力清償，監理機關卻採取＿，等於＿資本要求？正解：監理寬容；降低。","11-86":"題意：1980 年代初監理機關為何對無力清償機構採取寬容？正解：以上皆是：FSLIC 沒錢賠付、監理機關不想關掉支撐自己存在的機構、不願承認自己處理不了。","11-87":"題意：＿政策加重＿問題，儲貸為了翻身冒更大風險？正解：監理寬容；道德風險。","11-88":"題意：監理寬容的結果。正解：以上皆是：延後關閉殭屍儲貸；殭屍儲貸以高利率搶走健全儲貸的存款；整個產業獲利下降、殭屍變多。","11-89":"題意：同上，(c) 說健全儲貸受益。正解：(a)(b)。受益的是殭屍儲貸，不是健全儲貸。","11-90":"題意：監理寬容的意義。正解：延後關閉虧損不斷擴大的殭屍儲貸。它並沒有讓多數機構回到獲利、替 FSLIC 省錢。","11-91":"題意：1987 年淨值為負 2.9 億的 Far West S&L 說服 FHLB 借它超過 10 億。正解：監理寬容。","11-92":"題意：1987 年競爭平等銀行法的內容。正解：(a)(b)：給 FSLIC 的資金不足；要求監理機關繼續寬容。RTC 是 1989 年 FIRREA 設立的。","11-93":"題意：同上，選出主要條款。正解：指示聯邦住宅貸款銀行局繼續監理寬容。","11-94":"題意：同上，選項都是 1989 年 FIRREA 的內容。正解：以上皆非。","11-95":"題意：1987 年 CEBA 的條款。正解：額外撥給 FSLIC 108 億美元。","11-96":"題意：儲貸紓困成本高昂，該由誰負責？正解：政治人物。","11-97":"題意：「官僚賭博」指什麼？正解：監理官降低資本要求、實施寬容，賭儲貸業情況會好轉。","11-98":"題意：1980 年代儲貸監理官表現差的原因。正解：以上皆是：想逃避責任而官僚賭博；屈服於收政治獻金的政治人物壓力；國會不撥足檢查經費。","11-99":"題意：哪一個「不能」解釋監理官的差勁表現？正解：國會堅決保護納稅人。實際上國會是阻礙監理的一方。","11-100":"題意：儲貸危機的政治經濟分析能解釋什麼？正解：以上皆是：政治人物刪減監理預算並鼓勵寬容；監理官不願承認問題；監理官屈從國會壓力。","11-101":"題意：同上。正解：只有 (c)：監理官屈從國會議員的壓力。(a)(b) 方向寫反。","11-102":"題意：1984 到 1986 年中數百家儲貸一次都沒被檢查，原因是？正解：(a)(b)：國會不撥足經費；儲貸遊說團體大量獻金並要求寬容。","11-103":"題意：同上。正解：國會不願撥給監理機關必要的經費。","11-104":"題意：儲貸紓困為何拖延且代價更高？正解：以上皆是：監理官淡化問題、收獻金的政治人物期待問題自然好轉、國會鼓勵寬容而監理官配合。","11-105":"題意：同上，(c) 說國會等得不夠久。正解：(a)(b)。","11-106":"題意：1989 年 8 月前監理儲貸協會的機構。正解：聯邦住宅貸款銀行局（FHLBB）。","11-107":"題意：廢除 FHLBB 與 FSLIC 的法律。正解：1989 年金融機構改革復甦執行法（FIRREA）。","11-108":"題意：FIRREA 的主要內容。正解：以上皆是：廢除 FHLBB 與 FSLIC、監理職權移交財政部轄下的 OTS、FDIC 成為存保唯一管理者。","11-109":"題意：同上。正解：以上皆是：廢除兩機構、設 OTS、成立 RTC 處理無力清償儲貸。","11-110":"題意：同上。正解：以上皆是。","11-111":"題意：同上，(c) 說繼續寬容。正解：(a)(b)：擴大 FDIC 職責、成立 RTC。","11-112":"題意：同上，(a) 說縮減 FDIC 職責。正解：只有 (b)：成立 RTC。","11-113":"題意：同上。正解：成立重整信託公司（RTC）處理被接管的儲貸。","11-114":"題意：經濟學家為何對 FIRREA 略有批評？正解：沒有處理存款保險造成的逆選擇與道德風險根本問題。","11-115":"題意：1991 年 FDICIA 的內容。正解：(a)(b)：提高 FDIC 向財政部借款的能力、從幾方面縮小存款保險範圍。","11-116":"題意：同上。正解：(a)(c)：縮小存保範圍；讓資本充足的銀行可做一些證券承銷。","11-117":"題意：同上。正解：以上皆是：縮小存保範圍、限制大到不能倒、要求 FDIC 及早介入問題銀行。","11-118":"題意：同上。正解：要求 FDIC 訂定風險基礎存保費率。(b)(c) 方向寫反。","11-119":"題意：北歐（挪威、瑞典、芬蘭）銀行危機和美國的共同因素。正解：1980 年代的金融自由化。","11-120":"題意：同上。正解：金融自由化。","11-121":"題意：拉丁美洲銀行危機和美國的共同因素。正解：金融自由化。","11-122":"題意：比較美國、墨西哥、委內瑞拉的紓困成本。正解：墨西哥與委內瑞拉（占 GDP 比例）高於美國。","11-123":"題意：委內瑞拉近期銀行危機紓困成本可能超過 GDP 的多少？正解：題庫答 50%。","11-124":"題意：美國、北歐、拉美、日本、俄羅斯、東歐銀行危機的共同點。正解：以上皆是：金融自由化、銀行缺乏篩選與監督放款的專業、監理機關缺乏監督能力。","11-125":"題意：他國銀行危機的證據顯示什麼？正解：解除管制加上監理不足會提高道德風險誘因。","11-126":"題意：共同保險制度。正解：只保障存款的一定比例，存戶也要承擔一部分損失。","11-127":"題意：取消或縮減存款保險為何未必能帶來市場紀律？正解：(a)(b)：存戶可能沒有能力監督銀行；銀行可能遭擠兌而大量倒閉。","11-128":"題意：大銀行為何受未保險存戶的紀律約束不足？正解：大到不能倒政策。","11-129":"題意：風險基礎存保費率的效果。正解：(a)(b)：降低道德風險誘因、鼓勵銀行多持有資本。","11-130":"題意：市價會計相對於歷史成本會計的優點。正解：以上皆是：可在淨值歸零前就關閉銀行、減少孤注一擲的冒險、讓銀行與監理官、政治人物都更難隱藏無力清償。","S11-1":"題意：1832 年傑克森總統否決第二合眾國銀行換約之後發生什麼事。正解：(c)。1836 年第二合眾國銀行結束後，美國有將近三十年沒有中央銀行，由各州立銀行自行發行可兌換黃金的銀行券，監理鬆散、倒閉頻繁，稱為「野貓銀行時代」(wildcat banking era)。(a) Fed 是 1913 年才成立；(d) 國民銀行與 OCC 是 1863 年國家銀行法才建立；(b) FDIC 是 1933 年。","S11-2":"題意：比較 Edge 法案公司與國際銀行設施 (IBF)。正解：(d)。Edge 法案公司是依聯邦準備法設立的特許子公司，專辦國際業務，在 Riegle-Neal 法之前就能跨州設點。IBF 是 1981 年 Fed 核准、設在美國本土的專屬帳戶，只能收外國人的定期存款、只能放款給外國實體，免提法定準備、免利率上限與州地方稅，目的是讓滯留倫敦、開曼的美元業務回流。(b) 兩者都在美國境內，也不收本國居民存款；(c) IBF 免提準備；(a) 放款對象寫錯。","S11-3":"題意：1987 年聯準會利用 Glass-Steagall 法第 20 條漏洞，開放了什麼？正解：(b)。Fed 核准銀行控股公司 (BHCs) 成立子公司承銷部分證券，但證券業務營收占比起初不得超過 10%，後來放寬到 25%。1990 年 J.P. Morgan 獲准承銷公司債與股票，Glass-Steagall 防火牆實質被突破。(d) 不是銀行本身、也有上限；(c) 投資銀行收存款是 2008 年改制為 BHC 才發生；(a) 跨州分行是 1994 年 Riegle-Neal 法。","S11-4":"題意：1913 年聯邦準備法的內容。正解：(a)(b)。Fed 成立的目的是當最後貸款人 (lender of last resort)，防止個別銀行倒閉引發全面擠兌；國民銀行 (national banks) 必須加入成為會員銀行。州立銀行 (state banks) 則可以自行選擇是否加入，所以 (c) 錯。","S11-5":"題意：1933 年 Glass-Steagall 法包含哪些內容。正解：以上三項皆是。一、設立 FDIC 提供存款保險，終止擠兌連鎖反應；二、強制分離商業銀行與投資銀行，禁止商業銀行承銷交易證券；三、授權 Fed 訂定存款利率上限 (Regulation Q)，防止銀行過度競爭。","S11-6":"題意：有 FDIC 存保、但不是 Fed 會員的州立銀行，由誰監理？正解：(c) FDIC 與各州主管機關共同監理。美國多頭監理架構：OCC 管國民銀行；Fed（與州）管加入 Fed 的州立銀行，並單獨監理銀行控股公司；FDIC（與州）管未加入 Fed 但有投保的州立銀行；只有極少數未投保 FDIC 的州立銀行（資產不到 0.2%）完全由州管轄，所以 (d) 不對。","S11-7":"題意：利率劇烈波動時，機動利率房貸 (ARMs) 對放款機構的影響。正解：(a)。ARMs 的利率隨市場指標（如國庫券利率）定期調整，升息時放款收入跟著增加，降低儲貸機構「借短貸長」的利率風險 (interest-rate risk)。1975 年由加州儲貸首創。(d) 鎖定 30 年利率的是固定利率房貸；(c) ARMs 管的是利率風險，不能消除違約風險，反而升息時借款人負擔變重；(b) 利率風險移轉給了屋主，不是對放款機構沒影響。","S11-8":"題意：「發起後分銷」(originate-to-distribute) 模式為什麼讓次級房貸的授信標準下降？正解：(d)。房貸經紀商或銀行承做貸款後，交給投資銀行打包成 MBS/CDO 賣給投資人，發起者本身不承擔違約風險，於是沒有誘因好好審核，形成道德風險 (moral hazard)，成為金融海嘯的核心。(b) 相反，FICO 評分讓業者能對次級借款人計算風險；(c) Q 規則是存款利率上限，與房貸無關；(a) 沒有這種法規。","S11-9":"題意：法定準備的「隱含稅」計算。正解：(b)。法定準備＝100 萬 × 10%＝10 萬；這 10 萬不能放款賺利息，每年損失 10 萬 × 5%＝5,000，也就是隱含稅率 i × r＝5% × 10%＝0.5% 的存款。(d) 把 100 萬直接乘 5%；(a) 把準備率當成 5%；(c) 準備率當成 1%。","S11-10":"題意：銀行為什麼發展自動轉存帳戶 (sweep accounts)？正解：(c)。每天營業結束時，系統把企業支票帳戶超過門檻的資金「掃出」投入隔夜計息證券，這些資金不必提法定準備，銀行省下隱含稅，又等於替企業的活期資金付息（活期存款原本受 Q 規則限制不能付息）。這是典型的規避法規 (loophole mining) 創新。(a)(b) 方向相反；(d) 反而讓 M1 更難衡量。","S11-11":"題意：2008 年儲備初級基金 (Reserve Primary Fund) 「跌破面額」(breaking the buck)。正解：(a)。基金為追求高報酬買進 7.85 億美元雷曼兄弟商業本票，雷曼破產後價值歸零，每單位淨值跌到 97 美分，打破貨幣市場基金「保本」的信念，幾天內資產流失 90%，擴散為全產業擠兌，最後靠 Fed 緊急流動性機制和財政部暫時全額擔保才平息。(d) 貨幣市場基金沒有 FDIC 保險；(b) 貨幣市場基金本來就不受 Q 規則限制。","S11-12":"題意：傳統銀行業式微的兩個數字。正解：(d)。商業銀行在非金融部門借款的比重從 1974 年高峰超過 40% 降到 2020 年約 20%，地位減半；低成本支票存款占銀行負債從 1960 年代超過 60% 降到現在約 14%。(b) 40%→30% 是舊版（7 版）的數字；(a) 方向相反；(c) 兩組數字對調。","S11-13":"題意：傳統銀行業務式微後，銀行如何維持獲利？正解：(a)(b)。一是承做高風險高報酬的授信（商業不動產、企業槓桿收購 LBO 融資）；二是轉向表外業務 (off-balance-sheet activities) 賺手續費，使非利息收入比重倍增。(c) 錯：解除 Q 規則後，銀行反而必須付市場化利率才能爭取存款，資金成本上升。","S11-14":"題意：2020 年美國商業銀行業的結構。正解：(b) 雙峰分布。資產 10 億美元以下的社區銀行 (community banks) 占家數 83.9%，只握 7.2% 資產；資產 2,500 億美元以上的僅 13 家，卻握 50.4% 資產。(a) 美國因 1927 麥克法登法等分行限制，銀行家數仍有數千家；(d) 小銀行資產占比很低。","S11-15":"題意：共用 ATM 網路如何讓銀行規避分行限制？正解：(a)。法院認定由第三方擁有或按交易租用的 ATM 不算實體分行，所以銀行可透過 Cirrus、NYCE 等全國共用網路跨越地理邊界服務客戶。另一個規避方式是銀行控股公司 (BHCs) 在不同州持有附屬銀行。(d) 方向相反；(b)(c) 無此規定。","S11-16":"題意：超區域銀行 (superregional banks) 為什麼能在傳統金融中心之外興起？正解：(c)。各州體認到需要外州資本，1975 年緬因州、1982 年麻州陸續推出區域互惠協議，允許外州銀行控股公司併購本州銀行，誕生立足夏洛特、俄亥俄等地的超區域銀行。(d) 麥克法登法是禁止跨州設分行，不是要求遷出紐約；(a)(b) 無此規定。","S11-17":"題意：美國商業銀行家數變化與主因。正解：(b)。1934–1985 年受分行限制保護，長期維持約 14,000 家；1985 年起雪崩式整併，2007 年約 7,500 家，2019 年降到 5,000 家以下。縮減的銀行中倒閉比例很低（1992–2007 年不到 5%），絕大多數是跨區併購 (M&A)。(c) 主因寫錯；(a) 15,000→8,500 是舊版數字；(d) 方向相反。","S11-18":"題意：經濟學家對全國性銀行 (nationwide banking) 的整體評價。正解：(a) 利大於弊。優點：淘汰低效率銀行、發揮規模經濟與範疇經濟；地域分散降低系統性風險（例如 1980 年代德州油價重挫、1990 年新英格蘭蕭條造成的倒閉潮）。疑慮是中小企業的關係型融資 (relationship lending) 受損、大到不能倒，但實證上紐約州與加州自由化後社區銀行並沒有消失，所以 (b) 錯；(d) 分散化是降低而不是提高倒閉機率。","S11-19":"題意：1999 年金融服務現代化法 (GLBA) 的功能性監理 (functional regulation) 分工。正解：(d)。證券子公司歸 SEC、保險子公司歸各州保險局、銀行子公司歸 OCC／Fed／FDIC，最上層的金融控股公司 (financial holding company, FHC) 由 Fed 傘狀監理。GLBA 廢除 Glass-Steagall 防火牆，背景是 1998 年 Citicorp 與 Travelers 的合併案。其他選項都把監理機關配錯。","S11-20":"題意：2008 年五大獨立投資銀行的下場。正解：(c)。Bear Stearns（第 5）3 月在 Fed 協助下被摩根大通收購；Lehman Brothers（第 4）9 月 15 日破產；Merrill Lynch（第 3）賣給美國銀行；Goldman Sachs 與 Morgan Stanley 一週內改制為銀行控股公司 (BHCs)，以取得 FDIC 保險的穩定存款並接受 Fed 監理。依賴批發性融資 (wholesale funding) 的獨立投行模式從此結束。其他選項把結局張冠李戴（破產的是 Lehman、賣給美國銀行的是 Merrill）。"}</script>
